name: Recover AGOT draft-request carrier on pull request

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/export-agot-draft-pr-request-carrier-pr-v1.yml
      - asoiaf/public/review/agot-draft-pr-request-packet-v1/**

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Inventory every reachable carrier object and preserve raw bytes
        shell: bash
        run: |
          set -euo pipefail
          python -W error - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import json
          import os
          import re
          import subprocess
          import zipfile
          from io import BytesIO
          from pathlib import Path

          component_token = "asoiaf/public/review/agot-draft-pr-request-packet-v1"
          expected_base64_sha = "4fbbd9b17aa38a7962150be9bfe2324325f5cbf8da91553bef3f9db6dffa926b"
          expected_zip_sha = "5f3d5307dcab68f25de8ceaf9c9fdc303c9e74c29c274b34a41344b2f91b1c10"
          expected_chunk_blobs = {
              "06ffa3f3a3fd3e6a51b982904ef630b083d99ea9",
              "95d51ed852a8f16072f98d888a45a9c8d7ffecba",
              "21d07d34221eec480849cb181f94fc9ca459ca36",
              "c069f15d025cf5a209e988efdf0ad6d914804a2f",
          }

          out = Path(os.environ["RUNNER_TEMP"]) / "draft-request-recovery"
          blob_out = out / "blobs"
          ref_out = out / "refs"
          blob_out.mkdir(parents=True, exist_ok=False)
          ref_out.mkdir()

          def run(*args: str, check: bool = True) -> subprocess.CompletedProcess[str]:
              return subprocess.run(args, check=check, capture_output=True, text=True)

          objects: dict[str, set[str]] = {}
          for line in run("git", "rev-list", "--objects", "--all").stdout.splitlines():
              sha, _, path = line.partition(" ")
              if not path or component_token not in path:
                  continue
              object_type = run("git", "cat-file", "-t", sha, check=False)
              if object_type.returncode != 0 or object_type.stdout.strip() != "blob":
                  continue
              objects.setdefault(sha, set()).add(path)

          records: list[dict[str, object]] = []
          exact_base64_objects: list[str] = []
          exact_zip_objects: list[str] = []
          expected_chunk_objects_present: list[str] = []
          decoded_zip_candidates: list[dict[str, object]] = []

          for sha, paths in sorted(objects.items()):
              data = subprocess.run(["git", "cat-file", "blob", sha], check=True, capture_output=True).stdout
              (blob_out / sha).write_bytes(data)
              data_sha = hashlib.sha256(data).hexdigest()
              if sha in expected_chunk_blobs:
                  expected_chunk_objects_present.append(sha)
              if data_sha == expected_base64_sha:
                  exact_base64_objects.append(sha)
              candidate: dict[str, object] | None = None
              try:
                  text = data.decode("ascii")
                  if text and not any(character.isspace() for character in text) and re.fullmatch(r"[A-Za-z0-9+/]*={0,2}", text):
                      decoded = base64.b64decode(text, validate=True)
                      decoded_sha = hashlib.sha256(decoded).hexdigest()
                      candidate = {
                          "blobSha1": sha,
                          "base64Characters": len(text),
                          "base64Sha256": data_sha,
                          "decodedBytes": len(decoded),
                          "decodedSha256": decoded_sha,
                          "zipSignature": decoded.startswith(b"PK"),
                      }
                      if decoded_sha == expected_zip_sha:
                          exact_zip_objects.append(sha)
                      if decoded.startswith(b"PK"):
                          try:
                              with zipfile.ZipFile(BytesIO(decoded)) as archive:
                                  zip_state: dict[str, object] = {
                                      "memberCount": len(archive.infolist()),
                                      "badMember": archive.testzip(),
                                      "members": [info.filename for info in archive.infolist()],
                                  }
                              (out / f"decoded-{sha}.zip").write_bytes(decoded)
                          except Exception as exc:
                              zip_state = {"error": f"{type(exc).__name__}: {exc}"}
                          candidate["zipState"] = zip_state
                          decoded_zip_candidates.append(candidate)
              except Exception:
                  candidate = None

              records.append(
                  {
                      "blobSha1": sha,
                      "bytes": len(data),
                      "sha256": data_sha,
                      "paths": sorted(paths),
                      "base64Candidate": candidate,
                  }
              )

          refs = run("git", "for-each-ref", "--format=%(refname)", "refs/remotes/origin").stdout.splitlines()
          ref_records: list[dict[str, object]] = []
          for ref in refs:
              listing = run("git", "ls-tree", "-r", "--name-only", ref).stdout.splitlines()
              paths = [path for path in listing if component_token in path]
              if not paths:
                  continue
              safe_ref = re.sub(r"[^A-Za-z0-9._-]+", "_", ref)
              destination = ref_out / safe_ref
              destination.mkdir()
              copied = []
              for index, path in enumerate(paths, start=1):
                  data = subprocess.run(["git", "show", f"{ref}:{path}"], check=True, capture_output=True).stdout
                  name = f"{index:02d}-{Path(path).name}"
                  (destination / name).write_bytes(data)
                  copied.append({"path": path, "bytes": len(data), "sha256": hashlib.sha256(data).hexdigest(), "copy": name})
              ref_records.append({"ref": ref, "files": copied})

          fsck = run("git", "fsck", "--full", "--no-reflogs", "--unreachable", check=False)
          (out / "git-fsck.stdout.txt").write_text(fsck.stdout, encoding="utf-8")
          (out / "git-fsck.stderr.txt").write_text(fsck.stderr, encoding="utf-8")

          receipt = {
              "schema": "axm-asoiaf-agot-draft-request-carrier-recovery-diagnostic/1",
              "sourceCommit": os.environ["GITHUB_SHA"],
              "componentToken": component_token,
              "reachableComponentBlobCount": len(records),
              "refCountWithComponent": len(ref_records),
              "expectedBase64Sha256": expected_base64_sha,
              "expectedZipSha256": expected_zip_sha,
              "exactBase64Objects": sorted(exact_base64_objects),
              "exactZipObjects": sorted(exact_zip_objects),
              "expectedChunkBlobObjectsPresent": sorted(expected_chunk_objects_present),
              "decodedZipCandidates": decoded_zip_candidates,
              "objects": records,
              "refs": ref_records,
              "privateSourceTextPresent": False,
              "privatePayloadPresent": False,
              "canonEffect": "none",
              "graphEffect": "none",
              "status": "PASS_DIAGNOSTIC_OBJECT_INVENTORY_PRESERVED",
          }
          (out / "DIAGNOSTIC_RECEIPT.json").write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps({key: receipt[key] for key in (
              "status",
              "reachableComponentBlobCount",
              "refCountWithComponent",
              "exactBase64Objects",
              "exactZipObjects",
              "expectedChunkBlobObjectsPresent",
          )}, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: asoiaf-agot-draft-pr-request-packet-recovery-diagnostic-v1
          path: ${{ runner.temp }}/draft-request-recovery
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
