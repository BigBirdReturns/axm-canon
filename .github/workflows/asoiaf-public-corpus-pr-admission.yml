name: Admit real ASOIAF public corpus through observed PR

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".admission-trigger/**"

permissions:
  contents: write

concurrency:
  group: axm-canon-real-public-corpus-pr-admission
  cancel-in-progress: false

jobs:
  admit:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'ops/asoiaf-public-corpus-v1-admission'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Stage the authenticated carrier URL from the same-repository PR
        shell: bash
        run: |
          set -euo pipefail
          head_ref='refs/remotes/origin/ops/asoiaf-public-corpus-v1-admission'
          url_file="$RUNNER_TEMP/carrier.url"
          git show "$head_ref:.admission-trigger/carrier.url" > "$url_file"
          test "$(wc -l < "$url_file")" = '1'
          grep -Eq '^https://sdmntprwestus\.oaiusercontent\.com/files/.+/raw\?' "$url_file"
          cp "$url_file" .carrier-input/asoiaf-public-corpus-v1.url

      - name: Run exact admission operator against checked-out main
        shell: bash
        run: |
          set -euo pipefail
          operator="$RUNNER_TEMP/operator.sh"
          cat .admission-payload/operator.* | base64 --decode > "$operator"
          printf '%s  %s\n' \
            '6c73d685f27d462cf335c687fd57b1414201450d383fab81c9a558c20f1b887f' \
            "$operator" | sha256sum -c -
          python - "$operator" <<'PY'
          import pathlib
          import sys
          path = pathlib.Path(sys.argv[1])
          text = path.read_text(encoding='utf-8')
          old = 'if [[ "${GITHUB_REF_NAME:-}" != \'main\' ]]; then'
          new = 'if [[ "$(git branch --show-current)" != \'main\' ]]; then'
          if text.count(old) != 1:
              raise SystemExit('operator branch guard did not match exactly once')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          printf '%s  %s\n' \
            'ef2bb0220a29985152561b26a4dea03087331bcf689a5ff9091e7f61b1c04da9' \
            "$operator" | sha256sum -c -
          chmod +x "$operator"
          rm -f .github/workflows/asoiaf-public-corpus-pr-admission.yml
          "$operator"
