name: Admit real ASOIAF public corpus v1

on:
  push:
    branches: [main]
    paths:
      - ".carrier-input/asoiaf-public-corpus-v1.url"

permissions:
  contents: write

concurrency:
  group: axm-canon-real-public-corpus-admission-v2
  cancel-in-progress: false

jobs:
  admit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reconstruct and run the exact operator
        shell: bash
        run: |
          set -euo pipefail
          cat .admission-payload/operator.* | base64 --decode > "$RUNNER_TEMP/operator.sh"
          printf '%s  %s\n' '6c73d685f27d462cf335c687fd57b1414201450d383fab81c9a558c20f1b887f' "$RUNNER_TEMP/operator.sh" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/operator.sh"
          "$RUNNER_TEMP/operator.sh"
