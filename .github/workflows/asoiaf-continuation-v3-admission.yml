name: Admit exact ASOIAF continuation v3 payload

on:
  push:
    branches:
      - "asoiaf/continuation-v3-payload-admission"
    paths:
      - "continuation-carrier/READY"

permissions:
  contents: write

concurrency:
  group: axm-canon-asoiaf-continuation-v3-admission
  cancel-in-progress: false

jobs:
  admit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Reconstruct and authenticate exact continuation wave
        shell: bash
        run: |
          set -euo pipefail
          test -f continuation-carrier/READY
          test "$(find continuation-carrier -maxdepth 1 -name 'chunk-*.b64' -type f | wc -l)" = '5'
          cat continuation-carrier/chunk-*.b64 | tr -d '\r\n\t ' > "$RUNNER_TEMP/wave.b64"
          test "$(wc -c < "$RUNNER_TEMP/wave.b64")" = '185092'
          printf '%s  %s\n' 'ed776eca80050293b9ae02bffe3b6715a1bf819b2576d3e55bcbdc74e521cf5b' "$RUNNER_TEMP/wave.b64" | sha256sum -c -
          base64 --decode "$RUNNER_TEMP/wave.b64" > "$RUNNER_TEMP/asoiaf-continuation-wave-2026-08-18-v3.tar.zst"
          test "$(wc -c < "$RUNNER_TEMP/asoiaf-continuation-wave-2026-08-18-v3.tar.zst")" = '138818'
          printf '%s  %s\n' '0e999b7f8c921e7e81d439fc4c2fc1fd004a2b4a2adb375f0df3b99aefe92ab9' "$RUNNER_TEMP/asoiaf-continuation-wave-2026-08-18-v3.tar.zst" | sha256sum -c -
          zstd --decompress --stdout "$RUNNER_TEMP/asoiaf-continuation-wave-2026-08-18-v3.tar.zst" > "$RUNNER_TEMP/wave.tar"
          test "$(wc -c < "$RUNNER_TEMP/wave.tar")" = '204800'
          printf '%s  %s\n' '74bf0c4eca3925e893a460fc5ff34181798fe1f29eed290cc47c1b15d853db3e' "$RUNNER_TEMP/wave.tar" | sha256sum -c -

      - name: Reject unsafe archive structure and extract exact members
        shell: bash
        run: |
          set -euo pipefail
          export WAVE_TAR="$RUNNER_TEMP/wave.tar"
          export EXTRACTED="$RUNNER_TEMP/extracted"
          mkdir -p "$EXTRACTED"
          python - <<'PY'
          import os
          import pathlib
          import tarfile

          archive = pathlib.Path(os.environ['WAVE_TAR'])
          extracted = pathlib.Path(os.environ['EXTRACTED'])
          root = pathlib.PurePosixPath('asoiaf-continuation-wave-2026-08-18-v3')
          regular_files = 0
          with tarfile.open(archive, 'r:') as handle:
              members = handle.getmembers()
              for member in members:
                  path = pathlib.PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'unsafe path: {member.name}')
                  if path.parts[:1] != root.parts:
                      raise SystemExit(f'unexpected archive root: {member.name}')
                  if member.issym() or member.islnk() or member.isdev():
                      raise SystemExit(f'unsafe member type: {member.name}')
                  if member.isdir():
                      continue
                  if not member.isfile():
                      raise SystemExit(f'unsupported member type: {member.name}')
                  regular_files += 1
                  target = extracted.joinpath(*path.parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  source = handle.extractfile(member)
                  if source is None:
                      raise SystemExit(f'unreadable member: {member.name}')
                  target.write_bytes(source.read())
                  target.chmod(member.mode & 0o777)
          if regular_files != 22:
              raise SystemExit(f'expected 22 regular files, observed {regular_files}')
          PY

      - name: Replay wave and external receipts
        shell: bash
        run: |
          set -euo pipefail
          wave="$RUNNER_TEMP/extracted/asoiaf-continuation-wave-2026-08-18-v3"
          python "$wave/verify_wave.py" "$wave" --out "$RUNNER_TEMP/wave-verification.json"
          test "$(jq -r '.status' "$RUNNER_TEMP/wave-verification.json")" = 'PASS'
          test "$(jq -r '.passed' "$RUNNER_TEMP/wave-verification.json")" = '9'
          test "$(jq -r '.failed' "$RUNNER_TEMP/wave-verification.json")" = '0'
          test "$(jq -r '.automatic_canon_promotions' "$RUNNER_TEMP/wave-verification.json")" = '0'
          printf '%s  %s\n' 'fa21f597454daacb2ba789c734ae43c6bef700aa6940f3454dd4cc5e32a18b80' continuation-carrier/receipts/asoiaf-continuation-wave-2026-08-18-v3-archive-replay-verification.json | sha256sum -c -
          printf '%s  %s\n' 'e2a615adf1f686b4fde57d8e4aa96ae83f77322fd21dbaa74dd405b297a95e78' continuation-carrier/receipts/asoiaf-continuation-control-receipt-2026-08-18-v3.json | sha256sum -c -
          printf '%s  %s\n' 'e50a1acf76c048ec10a4a6943b1ed8d33e50cf0f5a41a1b1a7e1a9aa7e6a49fe' continuation-carrier/receipts/asoiaf-continuation-delivery-2026-08-18-v3.SHA256SUMS | sha256sum -c -

      - name: Materialize exact wave and component archives
        shell: bash
        run: |
          set -euo pipefail
          target='asoiaf/public/continuation/2026-08-18-v3'
          wave="$RUNNER_TEMP/extracted/asoiaf-continuation-wave-2026-08-18-v3"
          rm -rf "$target/artifacts" "$target/wave" "$target/receipts"
          mkdir -p "$target/artifacts" "$target/wave" "$target/receipts"
          cp "$RUNNER_TEMP/asoiaf-continuation-wave-2026-08-18-v3.tar.zst" "$target/artifacts/"
          cp -a "$wave/." "$target/wave/"
          cp continuation-carrier/receipts/* "$target/receipts/"
          cp "$RUNNER_TEMP/wave-verification.json" "$target/receipts/replayed-wave-verification.json"
          rm -rf continuation-carrier

      - name: Admit repository standing without widening authority
        shell: bash
        run: |
          set -euo pipefail
          target='asoiaf/public/continuation/2026-08-18-v3'
          cat > "$target/ADMISSION.json" <<'JSON'
          {
            "format": "axm-asoiaf-public-continuation-admission/2",
            "programme": "ASOIAF governed research estate",
            "wave": "2026-08-18-v3",
            "standing": "archive-and-components-materialized",
            "sourceArchive": {
              "name": "asoiaf-continuation-wave-2026-08-18-v3.tar.zst",
              "path": "artifacts/asoiaf-continuation-wave-2026-08-18-v3.tar.zst",
              "bytes": 138818,
              "sha256": "0e999b7f8c921e7e81d439fc4c2fc1fd004a2b4a2adb375f0df3b99aefe92ab9",
              "payloadMaterializedInRepository": true
            },
            "receipts": {
              "archiveReplay": {
                "path": "receipts/asoiaf-continuation-wave-2026-08-18-v3-archive-replay-verification.json",
                "sha256": "fa21f597454daacb2ba789c734ae43c6bef700aa6940f3454dd4cc5e32a18b80"
              },
              "control": {
                "path": "receipts/asoiaf-continuation-control-receipt-2026-08-18-v3.json",
                "sha256": "e2a615adf1f686b4fde57d8e4aa96ae83f77322fd21dbaa74dd405b297a95e78"
              },
              "deliveryLedger": {
                "path": "receipts/asoiaf-continuation-delivery-2026-08-18-v3.SHA256SUMS",
                "sha256": "e50a1acf76c048ec10a4a6943b1ed8d33e50cf0f5a41a1b1a7e1a9aa7e6a49fe",
                "fileCount": 19
              },
              "repositoryReplay": {
                "path": "receipts/replayed-wave-verification.json",
                "status": "PASS",
                "passed": 9,
                "failed": 0
              }
            },
            "qualification": {
              "componentCount": 7,
              "liveChecks": {"passed": 9, "total": 9},
              "archiveReplayChecks": {"passed": 9, "total": 9},
              "repositoryReplayChecks": {"passed": 9, "total": 9},
              "automaticCanonPromotions": 0
            },
            "components": [
              {"id": "v4.2-recovery-kit", "standing": "fail-closed operator", "payloadMaterialized": true, "artifact": "wave/components/asoiaf-v4.2-recovery-kit-v0.1.tar.zst", "sha256": "538410c5470f44e325952fe2c2b47142276be0670ca594361f3035500dd64a75"},
              {"id": "public-source-descent", "standing": "public-safe derived component", "payloadMaterialized": true, "artifact": "wave/components/asoiaf-public-source-descent-v0.1.tar.zst", "sha256": "db3a3c0073a742cf4bd6137e40fd3f7a403a74f415c015aecf68c1f0d052ed2e"},
              {"id": "multilingual-reception-atlas", "standing": "reception-history component", "payloadMaterialized": true, "artifact": "wave/components/asoiaf-multilingual-reception-atlas-v0.1.tar.zst", "sha256": "2d0659281fc1432ff86d7d9f07a69c600350dccddaf74354035ca67e218ac911"},
              {"id": "multilingual-term-audit", "standing": "terminology-control component", "payloadMaterialized": true, "artifact": "wave/components/asoiaf-multilingual-term-audit-v0.1.tar.zst", "sha256": "161a2cb7267b431cb47aaa469bec71bc15cc00cb0e5e94d3058e22806516cab9"},
              {"id": "ssm-item-descent", "standing": "source-specific proposition component", "payloadMaterialized": true, "artifact": "wave/components/asoiaf-ssm-item-descent-v0.1.tar.zst", "sha256": "2adc9a9a0818a1885a180569ff80ef6eaec08af74c82c4ca075024bb2e5ebb01", "itemCount": 10, "boundedPropositionCount": 23},
              {"id": "twow-released-material-registry", "standing": "released-future-material component", "payloadMaterialized": true, "artifact": "wave/components/asoiaf-twow-released-material-registry-v0.1.tar.zst", "sha256": "ac93ef471f05beb7e4ac1469baba4baca2d1550b246eb3b33ab50035c79333d0", "chapterWitnessCount": 11, "eventCount": 16, "sourceRouteCount": 17, "versionRelationCount": 47, "exactWitnessHoldCount": 14},
              {"id": "repository-state-patch", "standing": "historical repository patch", "payloadMaterialized": true, "artifact": "wave/components/axm-canon-state-refresh-v0.2.tar.zst", "sha256": "bd4b5f0d5fb46d9cc50e100f8911f7f066f8257c20056fc0928014576a47e533", "remoteEffect": "none"}
            ],
            "authorityBoundary": {
              "sourceTextPresent": false,
              "holderControlledPayloadPresent": false,
              "automaticCanonEffect": "none",
              "automaticGraphEffect": "none",
              "manifestDoesNotSubstituteForArchive": true,
              "archiveHashDoesNotProveRepositoryMaterialization": true,
              "repositoryMaterializationProvenByFileAndReplay": true
            },
            "privateIntegrationHold": {
              "requiredArchive": "asoiaf-private-world-estate-v4.1.tar.zst",
              "requiredBytes": 244436743,
              "requiredSha256": "48428ec5630971e75d0f9e0075b4d7fecacdfd2e61efc516ed01c3aaa17fb9d7",
              "materialized": false,
              "v4_2Built": false,
              "v4_2Claimed": false,
              "substitutionAllowed": false,
              "reconstructionAllowed": false
            }
          }
          JSON
          cat > "$target/README.md" <<'MD'
          # ASOIAF continuation wave 2026-08-18 v3

          The exact continuation-wave archive, its seven component archives, replay records, control receipt, and delivery ledger are materially present in this directory. The repository replay passes all 9 checks with zero automatic canon promotions.

          The component archives cover the fail-closed v4.2 recovery operator, public-source descent, multilingual reception, multilingual terminology control, item-level So Spake Martin descent, the released *Winds of Winter* witness registry, and the historical repository-state patch. Their presence grants custody and reproducibility, not fictional authority. Every component retains `canonEffect=none` unless a separate source-specific human review transaction grants standing.

          The exact private v4.2 integration remains held. The required inherited archive is `asoiaf-private-world-estate-v4.1.tar.zst`, 244,436,743 bytes, SHA-256 `48428ec5630971e75d0f9e0075b4d7fecacdfd2e61efc516ed01c3aaa17fb9d7`. No reconstruction or same-name substitution is admissible.
          MD
          python - <<'PY'
          import hashlib
          import json
          import pathlib

          root = pathlib.Path('asoiaf/public/continuation/2026-08-18-v3')
          records = []
          for path in sorted(root.rglob('*')):
              if not path.is_file() or path.name in {'PAYLOAD.SHA256SUMS', 'PAYLOAD_INVENTORY.json'}:
                  continue
              data = path.read_bytes()
              records.append({
                  'path': path.relative_to(root).as_posix(),
                  'bytes': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
              })
          (root / 'PAYLOAD_INVENTORY.json').write_text(json.dumps({
              'format': 'axm-asoiaf-continuation-repository-inventory/1',
              'fileCount': len(records),
              'files': records,
          }, indent=2) + '\n', encoding='utf-8')
          lines = [f"{record['sha256']}  {record['path']}" for record in records]
          (root / 'PAYLOAD.SHA256SUMS').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Update continuation custody tests
        shell: bash
        run: |
          set -euo pipefail
          cat > asoiaf/tests/asoiaf-public-continuation-admission.test.ts <<'TS'
          import { createHash } from "node:crypto";
          import { readFileSync, statSync } from "node:fs";
          import { resolve } from "node:path";
          import { describe, expect, it } from "vitest";

          const root = resolve(process.cwd(), "asoiaf/public/continuation/2026-08-18-v3");
          const admission = JSON.parse(readFileSync(resolve(root, "ADMISSION.json"), "utf8")) as {
            standing: string;
            sourceArchive: { path: string; bytes: number; sha256: string; payloadMaterializedInRepository: boolean };
            receipts: { deliveryLedger: { fileCount: number }; repositoryReplay: { status: string; passed: number; failed: number } };
            qualification: {
              componentCount: number;
              liveChecks: { passed: number; total: number };
              archiveReplayChecks: { passed: number; total: number };
              repositoryReplayChecks: { passed: number; total: number };
              automaticCanonPromotions: number;
            };
            components: Array<{ artifact: string; sha256: string; payloadMaterialized: boolean }>;
            authorityBoundary: {
              sourceTextPresent: boolean;
              holderControlledPayloadPresent: boolean;
              automaticCanonEffect: string;
              automaticGraphEffect: string;
              manifestDoesNotSubstituteForArchive: boolean;
              archiveHashDoesNotProveRepositoryMaterialization: boolean;
              repositoryMaterializationProvenByFileAndReplay: boolean;
            };
            privateIntegrationHold: {
              requiredBytes: number;
              requiredSha256: string;
              materialized: boolean;
              v4_2Built: boolean;
              v4_2Claimed: boolean;
              substitutionAllowed: boolean;
              reconstructionAllowed: boolean;
            };
          };

          function sha256(path: string) {
            return createHash("sha256").update(readFileSync(path)).digest("hex");
          }

          describe("ASOIAF continuation v3 payload admission", () => {
            it("materializes the exact wave archive and all seven component archives", () => {
              expect(admission.standing).toBe("archive-and-components-materialized");
              expect(admission.sourceArchive.payloadMaterializedInRepository).toBe(true);
              const archive = resolve(root, admission.sourceArchive.path);
              expect(statSync(archive).size).toBe(admission.sourceArchive.bytes);
              expect(sha256(archive)).toBe(admission.sourceArchive.sha256);
              expect(admission.components).toHaveLength(7);
              for (const component of admission.components) {
                expect(component.payloadMaterialized).toBe(true);
                expect(sha256(resolve(root, component.artifact))).toBe(component.sha256);
              }
            });

            it("retains all wave and repository replay counts", () => {
              expect(admission.receipts.deliveryLedger.fileCount).toBe(19);
              expect(admission.receipts.repositoryReplay).toEqual({ status: "PASS", passed: 9, failed: 0 });
              expect(admission.qualification.componentCount).toBe(7);
              expect(admission.qualification.liveChecks).toEqual({ passed: 9, total: 9 });
              expect(admission.qualification.archiveReplayChecks).toEqual({ passed: 9, total: 9 });
              expect(admission.qualification.repositoryReplayChecks).toEqual({ passed: 9, total: 9 });
              expect(admission.qualification.automaticCanonPromotions).toBe(0);
            });

            it("does not widen authority when payload becomes materialized", () => {
              expect(admission.authorityBoundary.sourceTextPresent).toBe(false);
              expect(admission.authorityBoundary.holderControlledPayloadPresent).toBe(false);
              expect(admission.authorityBoundary.automaticCanonEffect).toBe("none");
              expect(admission.authorityBoundary.automaticGraphEffect).toBe("none");
              expect(admission.authorityBoundary.manifestDoesNotSubstituteForArchive).toBe(true);
              expect(admission.authorityBoundary.archiveHashDoesNotProveRepositoryMaterialization).toBe(true);
              expect(admission.authorityBoundary.repositoryMaterializationProvenByFileAndReplay).toBe(true);
            });

            it("preserves the exact fail-closed v4.1 integration hold", () => {
              expect(admission.privateIntegrationHold.requiredBytes).toBe(244436743);
              expect(admission.privateIntegrationHold.requiredSha256).toBe(
                "48428ec5630971e75d0f9e0075b4d7fecacdfd2e61efc516ed01c3aaa17fb9d7",
              );
              expect(admission.privateIntegrationHold.materialized).toBe(false);
              expect(admission.privateIntegrationHold.v4_2Built).toBe(false);
              expect(admission.privateIntegrationHold.v4_2Claimed).toBe(false);
              expect(admission.privateIntegrationHold.substitutionAllowed).toBe(false);
              expect(admission.privateIntegrationHold.reconstructionAllowed).toBe(false);
            });
          });
          TS

      - name: Qualify repository and push admitted payload
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          PYTHONWARNINGS=error npm run validate
          rm -rf dist
          git diff --check
          git status --short
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git config user.name 'BigBirdReturns'
          git config user.email '219768509+BigBirdReturns@users.noreply.github.com'
          git commit -m 'Admit exact ASOIAF continuation v3 payload'
          git push origin "HEAD:${GITHUB_REF_NAME}"
