name: Reconcile admitted AGOT draft-request authorization branches

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/reconcile-agot-draft-request-authorization-v1.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 666f979b393e416bc0a28a9f5890bb4f5d1f5697
          fetch-depth: 0
          show-progress: false

      - name: Verify admitted main and delete exact terminal branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "666f979b393e416bc0a28a9f5890bb4f5d1f5697"
          test "$(git rev-parse HEAD^{tree})" = "538f77cff7a335a82f9dfc78985f979e58302e93"
          git cat-file -e HEAD:asoiaf/public/review/agot-draft-pr-request-authorization-sealer-v1/ADMISSION.json
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          targets = [
              ("agent/asoiaf-agot-draft-pr-request-authorization-sealer-v1", "4314dfe6f81be5e11d5ee078d880299d61fb1563"),
              ("ops/asoiaf-agot-draft-pr-request-source-export-v2", "1b42f1ba6dd3f74a0bf50d67f6e09c4c1aa0db1c"),
              ("ops/asoiaf-agot-draft-request-auth-post-merge-replay-v1", "aa2454174a78c30bd98168362d10243e1276bcf8"),
          ]

          def request(method: str, path: str, payload: dict | None = None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/{path}",
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(req) as response:
                      raw = response.read()
                      return response.status, json.loads(raw) if raw else None
              except urllib.error.HTTPError as exc:
                  raw = exc.read()
                  body = json.loads(raw) if raw else None
                  return exc.code, body

          outcomes = []
          for branch, expected in targets:
              encoded = urllib.parse.quote(f"heads/{branch}", safe="/")
              status, ref = request("GET", f"git/ref/{encoded}")
              if status == 404:
                  outcomes.append({"branch": branch, "expectedSha": expected, "outcome": "ABSENT_IDEMPOTENT_PASS"})
                  continue
              if status != 200:
                  raise SystemExit(f"failed to inspect {branch}: {status} {ref}")
              observed = ref["object"]["sha"]
              if observed != expected:
                  raise SystemExit(f"ref drift for {branch}: {observed} != {expected}")
              status, body = request("DELETE", f"git/refs/{encoded}")
              if status != 204:
                  raise SystemExit(f"failed to delete {branch}: {status} {body}")
              outcomes.append({"branch": branch, "expectedSha": expected, "observedSha": observed, "outcome": "DELETED_EXACT_SHA"})

          receipt = {
              "schema": "axm-asoiaf-agot-draft-request-authorization-branch-reconciliation/1",
              "status": "PASS_EXACT_TERMINAL_BRANCHES_RECONCILED",
              "repository": repository,
              "admissionCommit": "666f979b393e416bc0a28a9f5890bb4f5d1f5697",
              "admissionTree": "538f77cff7a335a82f9dfc78985f979e58302e93",
              "componentPullRequest": 102,
              "postMergeReplayPullRequest": 103,
              "postMergeReplayRun": 32921319886,
              "targets": outcomes,
              "privateSourceTextPresent": False,
              "privatePayloadPresent": False,
              "runtimeRequestAuthorizationEffect": "none",
              "runtimeRequestPacketEffect": "none",
              "runtimePullRequestCreationEffect": "none",
              "canonEffect": "none",
              "graphEffect": "none",
          }
          output = Path(os.environ["RUNNER_TEMP"]) / "BRANCH_RECONCILIATION_RECEIPT.json"
          output.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: asoiaf-agot-draft-request-authorization-branch-reconciliation-v1
          path: ${{ runner.temp }}/BRANCH_RECONCILIATION_RECEIPT.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Close cleanup PR and delete its exact head branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          number = event["pull_request"]["number"]
          branch = event["pull_request"]["head"]["ref"]
          expected = event["pull_request"]["head"]["sha"]

          def request(method: str, path: str, payload: dict | None = None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/{path}",
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(req) as response:
                      raw = response.read()
                      return response.status, json.loads(raw) if raw else None
              except urllib.error.HTTPError as exc:
                  raw = exc.read()
                  return exc.code, json.loads(raw) if raw else None

          status, body = request("PATCH", f"pulls/{number}", {"state": "closed"})
          if status != 200:
              raise SystemExit(f"failed to close cleanup PR: {status} {body}")
          encoded = urllib.parse.quote(f"heads/{branch}", safe="/")
          status, ref = request("GET", f"git/ref/{encoded}")
          if status != 200 or ref["object"]["sha"] != expected:
              raise SystemExit(f"cleanup ref drift: {status} {ref}")
          status, body = request("DELETE", f"git/refs/{encoded}")
          if status != 204:
              raise SystemExit(f"failed to delete cleanup branch: {status} {body}")
          PY
