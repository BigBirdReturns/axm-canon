name: Materialize exact ASOIAF public corpus from carrier custody

on:
  push:
    branches:
      - "asoiaf/public-corpus-v1-carrier"
    paths:
      - "carrier/RECOVER_V3"

permissions:
  contents: write
  pull-requests: write
  actions: read
  checks: read

concurrency:
  group: axm-canon-asoiaf-public-corpus-carrier-recovery-v3
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install transport and history dependencies
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v zstd >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends zstd
          fi
          zstd --version
          git --version

      - name: Resolve exact 32-file public corpus
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -f carrier/RECOVER_V3
          export RESOLUTION_ROOT="$RUNNER_TEMP/public-corpus-resolution"
          mkdir -p "$RESOLUTION_ROOT"
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import io
          import itertools
          import json
          import os
          import pathlib
          import re
          import shutil
          import subprocess
          import tarfile
          import urllib.request
          import zipfile

          ROOT = pathlib.Path(os.environ['RESOLUTION_ROOT'])
          REPOSITORY = os.environ['REPOSITORY']
          TOKEN = os.environ['GH_TOKEN']
          EXPECTED_B64_BYTES = 826356
          EXPECTED_B64_SHA = 'd4151d244b0541be1dbb1a1ef5a5ed7c4c808ba11d0ad494450acc58b11e6eaa'
          EXPECTED_ZST_BYTES = 619766
          EXPECTED_ZST_SHA = 'a545ed4384238f329f6fa6e6be2dd25150ac3377837defd3e06d26eabdea2476'
          EXPECTED_TAR_BYTES = 8017920
          EXPECTED_TAR_SHA = '9b66aff01f12ae3e6f018fd1c5ccd1d9b1fd96810da4343b3d11e3f69bfaab84'
          KNOWN_SERVER_BLOBS = [
              'e1da7c586ead1161924ad58155b72096091eec92',
              '6617eb350712506bd2fdf3db6174af473338cf24',
          ]

          def run(*args: str, cwd: pathlib.Path | None = None, text: bool = False) -> bytes | str:
              return subprocess.check_output(args, cwd=cwd, text=text)

          def sha256(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()

          def safe_members(archive: tarfile.TarFile) -> list[tarfile.TarInfo]:
              members = archive.getmembers()
              if len(members) != 32:
                  raise ValueError(f'expected 32 archive members, observed {len(members)}')
              for member in members:
                  path = pathlib.PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts:
                      raise ValueError(f'unsafe path: {member.name}')
                  if not member.isfile() or member.issym() or member.islnk():
                      raise ValueError(f'non-regular member: {member.name}')
              return members

          candidates: list[tuple[str, bytes]] = []
          seen: set[str] = set()
          diagnostics: list[dict[str, object]] = []

          def add_candidate(label: str, data: bytes) -> None:
              if not data:
                  return
              digest = sha256(data)
              if digest in seen:
                  return
              seen.add(digest)
              candidates.append((label, data))
              diagnostics.append({'label': label, 'bytes': len(data), 'sha256': digest})

          carrier = pathlib.Path('carrier')
          for path in sorted(carrier.rglob('*')) if carrier.is_dir() else []:
              if path.is_file() and path.name not in {'RECOVER_V2', 'RECOVER_V3', 'READY'}:
                  add_candidate(f'working-tree:{path.as_posix()}', path.read_bytes())

          for row in run('git', 'rev-list', '--objects', '--all', text=True).splitlines():
              if ' ' not in row:
                  continue
              oid, name = row.split(' ', 1)
              if not name.startswith('carrier/'):
                  continue
              try:
                  if run('git', 'cat-file', '-t', oid, text=True).strip() != 'blob':
                      continue
                  size = int(run('git', 'cat-file', '-s', oid, text=True).strip())
                  if size > 2_000_000:
                      continue
                  data = run('git', 'cat-file', 'blob', oid)
              except subprocess.CalledProcessError:
                  continue
              add_candidate(f'history:{oid}:{name}', data)

          for oid in KNOWN_SERVER_BLOBS:
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{REPOSITORY}/git/blobs/{oid}',
                  headers={
                      'Authorization': f'Bearer {TOKEN}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'axm-canon-public-corpus-resolution-v3',
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      payload = json.load(response)
                  add_candidate(f'known-server-blob:{oid}', base64.b64decode(payload['content']))
              except Exception as exc:
                  diagnostics.append({'label': f'known-server-blob:{oid}', 'error': repr(exc)})

          recovered: tuple[str, bytes] | None = None

          def accept(label: str, raw: bytes) -> bool:
              nonlocal recovered
              if len(raw) == EXPECTED_ZST_BYTES and sha256(raw) == EXPECTED_ZST_SHA:
                  recovered = (label + ':compressed', raw)
                  return True
              canonical = b''.join(raw.split())
              if len(canonical) == EXPECTED_B64_BYTES and sha256(canonical) == EXPECTED_B64_SHA:
                  try:
                      compressed = base64.b64decode(canonical, validate=True)
                  except Exception:
                      return False
                  if len(compressed) == EXPECTED_ZST_BYTES and sha256(compressed) == EXPECTED_ZST_SHA:
                      recovered = (label + ':base64', compressed)
                      return True
              if raw.startswith(b'PK\x03\x04'):
                  try:
                      with zipfile.ZipFile(io.BytesIO(raw)) as archive:
                          for name in archive.namelist():
                              if not name.endswith('/') and accept(label + f':zip:{name}', archive.read(name)):
                                  return True
                  except Exception:
                      pass
              return False

          for label, data in candidates:
              if accept(label, data):
                  break

          if recovered is None:
              named_chunks: dict[int, tuple[str, bytes]] = {}
              pattern = re.compile(r'(?:^|:)chunk-(\d{3})\.b64$')
              for label, data in candidates:
                  match = pattern.search(label)
                  if match:
                      named_chunks[int(match.group(1))] = (label, data)
              if sorted(named_chunks) == list(range(1, 14)):
                  accept(
                      'reachable-named-chunks-001-through-013',
                      b''.join(named_chunks[index][1] for index in range(1, 14)),
                  )

          if recovered is None:
              plausible = [(label, data) for label, data in candidates if len(data) <= EXPECTED_B64_BYTES]
              for (la, da), (lb, db) in itertools.permutations(plausible, 2):
                  if len(da) + len(db) > EXPECTED_B64_BYTES + 32:
                      continue
                  if accept(f'pair:{la}+{lb}', da + db):
                      break

          extracted = ROOT / 'extracted'
          extracted.mkdir(parents=True, exist_ok=True)
          inventory: list[dict[str, object]] = []
          mechanism: dict[str, object]

          if recovered is not None:
              label, compressed = recovered
              zst = ROOT / 'carrier.tar.zst'
              tar_path = ROOT / 'carrier.tar'
              zst.write_bytes(compressed)
              subprocess.run(
                  ['zstd', '--decompress', '--stdout', str(zst)],
                  check=True,
                  stdout=tar_path.open('wb'),
              )
              tar_bytes = tar_path.read_bytes()
              if len(tar_bytes) != EXPECTED_TAR_BYTES or sha256(tar_bytes) != EXPECTED_TAR_SHA:
                  raise SystemExit('recovered compressed object did not yield authenticated tar')
              with tarfile.open(tar_path, 'r:') as archive:
                  for member in safe_members(archive):
                      source = archive.extractfile(member)
                      if source is None:
                          raise SystemExit(f'unreadable member: {member.name}')
                      data = source.read()
                      target = extracted.joinpath(*pathlib.PurePosixPath(member.name).parts)
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(data)
                      target.chmod(member.mode & 0o777)
                      inventory.append({
                          'path': member.name,
                          'bytes': len(data),
                          'sha256': sha256(data),
                          'mode': oct(member.mode & 0o777),
                          'source': label,
                      })
              mechanism = {
                  'class': 'authenticated-carrier-reconstruction',
                  'carrierArchiveReconstructed': True,
                  'source': label,
              }
          else:
              manifest_path = pathlib.Path('carrier/FILES.SHA256SUMS')
              files_path = pathlib.Path('carrier/FILES.txt')
              if not manifest_path.is_file() or not files_path.is_file():
                  report = {
                      'format': 'axm-asoiaf-public-corpus-resolution-diagnostic/3',
                      'result': 'FAIL',
                      'reason': 'carrier-unavailable-and-file-manifests-missing',
                      'candidates': diagnostics,
                  }
                  (ROOT / 'diagnostic.json').write_text(json.dumps(report, indent=2) + '\n')
                  raise SystemExit(report['reason'])

              expected_paths = files_path.read_text(encoding='utf-8').splitlines()
              expected: dict[str, str] = {}
              for line in manifest_path.read_text(encoding='utf-8').splitlines():
                  digest, path = line.split('  ', 1)
                  expected[path] = digest
              if sorted(expected) != sorted(expected_paths) or len(expected) != 32:
                  raise SystemExit('file manifest inventory mismatch')

              mirrors = [pathlib.Path('.').resolve()]
              axm_arc = ROOT / 'axm-arc.git'
              subprocess.run(
                  ['git', 'clone', '--mirror', '--quiet', 'https://github.com/BigBirdReturns/axm-arc.git', str(axm_arc)],
                  check=True,
              )
              mirrors.append(axm_arc)

              wanted = set(expected.values())
              found: dict[str, tuple[bytes, str]] = {}
              scan_rows: list[dict[str, object]] = []
              for mirror in mirrors:
                  object_ids: list[str] = []
                  for row in run('git', 'rev-list', '--objects', '--all', cwd=mirror, text=True).splitlines():
                      object_ids.append(row.split(' ', 1)[0])
                  unique = list(dict.fromkeys(object_ids))
                  for oid in unique:
                      if len(found) == len(wanted):
                          break
                      try:
                          kind = run('git', 'cat-file', '-t', oid, cwd=mirror, text=True).strip()
                          if kind != 'blob':
                              continue
                          size = int(run('git', 'cat-file', '-s', oid, cwd=mirror, text=True).strip())
                          if size > 16_000_000:
                              continue
                          data = run('git', 'cat-file', 'blob', oid, cwd=mirror)
                      except subprocess.CalledProcessError:
                          continue
                      digest = sha256(data)
                      if digest in wanted and digest not in found:
                          found[digest] = (data, f'git:{mirror.name}:{oid}')
                          scan_rows.append({'digest': digest, 'bytes': len(data), 'source': found[digest][1]})

              missing = {path: digest for path, digest in expected.items() if digest not in found}
              if missing:
                  report = {
                      'format': 'axm-asoiaf-public-corpus-resolution-diagnostic/3',
                      'result': 'FAIL',
                      'reason': 'exact-file-digests-not-found-in-public-git-history',
                      'carrierCandidates': diagnostics,
                      'resolvedDigests': scan_rows,
                      'missing': missing,
                  }
                  (ROOT / 'diagnostic.json').write_text(json.dumps(report, indent=2) + '\n')
                  raise SystemExit(report['reason'])

              for path, digest in expected.items():
                  data, source = found[digest]
                  target = extracted.joinpath(*pathlib.PurePosixPath(path).parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
                  target.chmod(0o644)
                  inventory.append({
                      'path': path,
                      'bytes': len(data),
                      'sha256': digest,
                      'mode': '0o644',
                      'source': source,
                  })
              mechanism = {
                  'class': 'exact-file-digest-materialization',
                  'carrierArchiveReconstructed': False,
                  'source': 'reachable-public-git-history',
                  'archiveDigestAuthority': 'receipt-only',
              }

          inventory.sort(key=lambda row: row['path'])
          if len(inventory) != 32:
              raise SystemExit(f'expected 32 resolved files, observed {len(inventory)}')
          resolution = {
              'format': 'axm-asoiaf-public-corpus-resolution-receipt/3',
              'result': 'PASS',
              'mechanism': mechanism,
              'carrierCandidateCount': len(candidates),
              'files': inventory,
          }
          (ROOT / 'resolution.json').write_text(json.dumps(resolution, indent=2) + '\n')
          PY

      - name: Overlay resolved files and qualify full repository
        shell: bash
        run: |
          set -euo pipefail
          cp -a "$RESOLUTION_ROOT/extracted/." .
          npm ci --no-audit --no-fund
          PYTHONWARNINGS=error npm run validate
          rm -rf dist
          git diff --check
          python - <<'PY'
          import json
          import os
          import pathlib
          import subprocess

          root = pathlib.Path(os.environ['RESOLUTION_ROOT'])
          resolution = json.loads((root / 'resolution.json').read_text())
          expected = {row['path'] for row in resolution['files']}
          tracked = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          untracked = subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], text=True).splitlines()
          observed = set(tracked + untracked)
          allowed = {
              '.github/workflows/asoiaf-public-corpus-carrier-import.yml',
              '.github/workflows/asoiaf-public-corpus-carrier-recovery-v2.yml',
              '.github/workflows/asoiaf-public-corpus-carrier-recovery-v3.yml',
          }
          allowed.update(path.as_posix() for path in pathlib.Path('carrier').rglob('*') if path.is_file())
          unexpected = observed - expected - allowed
          if unexpected:
              raise SystemExit(f'unexpected generated paths: {sorted(unexpected)}')

          receipt = {
              'format': 'axm-asoiaf-public-corpus-carrier-import-receipt/3',
              'baseCommit': 'fec0ddc9a5697d465ac46e55b7e3cb7647221952',
              'carrierFileCount': 32,
              'sourceAttachment': 'axm-canon-asoiaf-corpus-v1-carrier.b64.txt',
              'sourceAttachmentSha256': 'sha256:d4151d244b0541be1dbb1a1ef5a5ed7c4c808ba11d0ad494450acc58b11e6eaa',
              'canonicalBase64Sha256': 'sha256:d4151d244b0541be1dbb1a1ef5a5ed7c4c808ba11d0ad494450acc58b11e6eaa',
              'compressedBytes': 619766,
              'compressedSha256': 'sha256:a545ed4384238f329f6fa6e6be2dd25150ac3377837defd3e06d26eabdea2476',
              'tarBytes': 8017920,
              'tarSha256': 'sha256:9b66aff01f12ae3e6f018fd1c5ccd1d9b1fd96810da4343b3d11e3f69bfaab84',
              'resolution': resolution['mechanism'],
              'qualification': {
                  'npmValidate': 'pass',
                  'publicCorpusBoundary': 'pass',
                  'privateCorpusOperatorTests': 'pass',
                  'fileInventory': 'pass',
                  'fileDigests': 'pass',
                  'unexpectedPathRejection': 'pass',
              },
              'sourcePayloadPresent': False,
              'sourceTextPresent': False,
              'canonEffect': 'none',
              'graphEffect': 'none',
          }
          pathlib.Path('asoiaf/docs/ASOIAF_PUBLIC_CORPUS_V1_IMPORT_RECEIPT.json').write_text(
              json.dumps(receipt, indent=2) + '\n', encoding='utf-8'
          )
          PY

      - name: Replace transport with qualified public corpus commit
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          rm -rf carrier
          rm -f .github/workflows/asoiaf-public-corpus-carrier-import.yml
          rm -f .github/workflows/asoiaf-public-corpus-carrier-recovery-v2.yml
          rm -f .github/workflows/asoiaf-public-corpus-carrier-recovery-v3.yml
          git add -A
          git diff --cached --check
          git config user.name 'BigBirdReturns'
          git config user.email '219768509+BigBirdReturns@users.noreply.github.com'
          git commit -m 'Publish six-edition ASOIAF public corpus v1'
          published_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          printf 'published_sha=%s\n' "$published_sha" >> "$GITHUB_OUTPUT"

      - name: Open and merge exact publication pull request
        id: integrate
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="$GITHUB_REF_NAME"
          pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --base main --state open --json number --jq '.[0].number' || true)"
          if [ -z "$pr" ]; then
            pr="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
              --title 'Publish six-edition ASOIAF public corpus v1' \
              --body $'Publishes the qualified 32-file public-safe ASOIAF corpus. The branch passed the complete repository validation suite and preserves source- and review-specific authority. No private book payload, source text, automatic canon promotion, or graph promotion is present.' \
              --json number --jq '.number')"
          fi
          printf 'pr=%s\n' "$pr" >> "$GITHUB_OUTPUT"
          gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --merge --delete-branch \
            --match-head-commit "${{ steps.publish.outputs.published_sha }}"

      - name: Seal resolution artifact
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root="$RESOLUTION_ROOT"
          printf '%s\n' \
            "candidate=${{ github.sha }}" \
            "published=${{ steps.publish.outputs.published_sha }}" \
            "pr=${{ steps.integrate.outputs.pr }}" \
            "integrationOutcome=${{ steps.integrate.outcome }}" \
            > "$root/workflow-terminal.txt"
          find "$root" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum | sed "s#  $root/#  #" > "$root/SHA256SUMS"

      - name: Upload resolution artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axm-canon-asoiaf-public-corpus-resolution-v3
          path: ${{ runner.temp }}/public-corpus-resolution
          if-no-files-found: warn
          retention-days: 30
