Materialize the sealed continuation-v3 component payloads under their exact manifests, then continue item-level author-statement and released-future-material descent. Additional orchestration alone does not close either acquisition.
'''
          pathlib.Path('asoiaf/docs/ASOIAF_PROGRAMME_STATE.md').write_text(state_md, encoding='utf-8')

          garbage = f'''# Garbage and residue ledger

This ledger names construction residue, namespace pollution, and unfinished work so none of it can quietly re-enter the canon repository.

## Public-corpus transport cleanup

The real public-safe corpus was admitted at `{admission}` from the authenticated 32-member carrier. The preceding main tip is preserved at `archive/main-pre-real-public-corpus-admission-20260819`. Carrier files, replay markers, recovery triggers, temporary write-enabled workflows, branch admission controllers, and state markers had transport authority only and were removed from the admitted tree.

The earlier commit `026a7485466f8b22dea6bb8cb3c9359f546cf541` remains historical evidence of a failed or no-op admission attempt. Its message does not establish payload custody, because its tree did not contain `asoiaf/public/corpus-v1`. It has no controlling product authority.

## Tier Bench boundary

Work orders, leases, settlements, workers, exchanges, supervision, authenticated transport, credentials, actor runtimes, adapter hosts, and operating-system isolation belong to Tier Bench. They are not lore and they are not canon.

## Evidence that is not lore

Synthetic fixtures, CI estates, workflow logs, artifact receipts, transport manifests, model-recall confidence scores, and repository-state markers qualify mechanisms. They do not establish fictional facts and cannot be promoted without exact-source review.

## Current unfinished corpus work

The continuation-v3 manifest is admitted, but its component payloads remain outside the repository. The exact private v4.1 archive required for v4.2 is not in current custody. Further progress requires a named source object, exact payload admission, or a governed review disposition rather than additional transport machinery.
'''
          pathlib.Path('GARBAGE_LEDGER.md').write_text(garbage, encoding='utf-8')
          PY
          PYTHONWARNINGS=error npm run validate
          rm -rf dist
          git diff --check
          git add README.md GARBAGE_LEDGER.md asoiaf/README.md asoiaf/docs/ASOIAF_PROGRAMME_STATE.md asoiaf/docs/ASOIAF_PROGRAMME_STATE.json asoiaf/docs/ASOIAF_PUBLIC_CORPUS_V1_ADMISSION.json
          git diff --cached --check
