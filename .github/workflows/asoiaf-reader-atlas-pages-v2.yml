name: Deploy ASOIAF reader atlas v2

on:
  push:
    branches: [main]
    paths:
      - "docs/asoiaf/**"
      - ".github/workflows/asoiaf-reader-atlas-pages-v2.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: axm-canon-asoiaf-reader-atlas-pages-v2
  cancel-in-progress: true

jobs:
  qualify-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Qualify static reader artifact
        shell: bash
        run: |
          set -euo pipefail
          root='docs/asoiaf'
          test -f "$root/index.html"
          test -f "$root/styles.css"
          test -f "$root/app.js"
          test -f "$root/data/atlas.json"
          test -f "$root/data/programme-state.md"
          test -f "$root/data/continuation-custody.md"
          grep -Fq 'The Narrow Wall' "$root/index.html"
          grep -Fq 'Build a bounded research question' "$root/index.html"
          jq -e '
            .version == "1.0.0" and
            .boundary.sourceTextPresent == false and
            .boundary.holderControlledPayloadPresent == false and
            .boundary.automaticCanonEffect == "none" and
            .boundary.automaticGraphEffect == "none" and
            (.sourceLanes | length) == 7 and
            (.twowChapters | length) == 11 and
            .custody.privateArchiveHold.materialized == false and
            .custody.privateArchiveHold.v4_2Built == false and
            .custody.publicWave.sha256 == "0e999b7f8c921e7e81d439fc4c2fc1fd004a2b4a2adb375f0df3b99aefe92ab9" and
            .custody.publicWave.repositoryMaterialized == false
          ' "$root/data/atlas.json" >/dev/null
          if grep -RIl --exclude='*.md' --exclude='*.json' --exclude='*.html' --exclude='*.css' --exclude='*.js' --exclude='.nojekyll' . "$root" | grep -q .; then
            echo 'unexpected reader artifact file type' >&2
            exit 1
          fi

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/asoiaf

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
