name: Converge ASOIAF public estate v1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/asoiaf-estate-steward-v1.yml"
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read
  checks: read
  pages: write
  id-token: write

concurrency:
  group: axm-canon-asoiaf-estate-steward-v1
  cancel-in-progress: false

jobs:
  converge:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Record starting custody
        id: start
        shell: bash
        run: |
          set -euo pipefail
          printf 'base_sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ -f asoiaf/docs/ASOIAF_PUBLIC_CORPUS_V1_IMPORT_RECEIPT.json ]; then
            printf 'corpus_needed=false\n' >> "$GITHUB_OUTPUT"
          else
            printf 'corpus_needed=true\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for exact retained-artifact corpus staging
        if: steps.start.outputs.corpus_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/axm-arc-public-corpus-staging-steward"
          repo="https://github.com/BigBirdReturns/axm-arc.git"
          branch="recovery/axm-canon-public-corpus-v1"
          for attempt in $(seq 1 1200); do
            rm -rf "$root"
            if git clone --quiet --depth 1 --single-branch --branch "$branch" "$repo" "$root" 2>/dev/null; then
              receipt="$root/recovery/public-corpus-v1/RECOVERY_RECEIPT.json"
              if [ -f "$receipt" ] && python - "$receipt" <<'PY'
          import json, pathlib, sys
          receipt=json.loads(pathlib.Path(sys.argv[1]).read_text())
          raise SystemExit(0 if receipt.get('result') == 'PASS' and len(receipt.get('files', [])) == 32 else 1)
          PY
              then
                break
              fi
            fi
            sleep 15
          done
          receipt="$root/recovery/public-corpus-v1/RECOVERY_RECEIPT.json"
          test -f "$receipt"
          python - "$receipt" <<'PY'
          import json, pathlib, sys
          receipt=json.loads(pathlib.Path(sys.argv[1]).read_text())
          if receipt.get('result') != 'PASS' or len(receipt.get('files', [])) != 32:
              raise SystemExit('staging receipt is not an exact 32-file PASS')
          PY
          printf 'STAGING_ROOT=%s\n' "$root/recovery/public-corpus-v1" >> "$GITHUB_ENV"
          printf 'STAGING_COMMIT=%s\n' "$(git -C "$root" rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify and overlay exact public corpus
        if: steps.start.outputs.corpus_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib

          staging=pathlib.Path(os.environ['STAGING_ROOT'])
          receipt=json.loads((staging/'RECOVERY_RECEIPT.json').read_text())
          expected=set()
          for row in receipt['files']:
              rel=pathlib.PurePosixPath(row['path'])
              if rel.is_absolute() or '..' in rel.parts:
                  raise SystemExit(f'unsafe staged path: {row["path"]}')
              source=staging.joinpath('files',*rel.parts)
              if not source.is_file():
                  raise SystemExit(f'missing staged file: {row["path"]}')
              data=source.read_bytes()
              if hashlib.sha256(data).hexdigest()!=row['sha256']:
                  raise SystemExit(f'digest mismatch: {row["path"]}')
              target=pathlib.Path(*rel.parts)
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(data)
              target.chmod(int(str(row.get('mode','0o644')),8)&0o777)
              expected.add(row['path'])
          disk={p.relative_to(staging/'files').as_posix() for p in (staging/'files').rglob('*') if p.is_file()}
          if disk!=expected:
              raise SystemExit('staging disk inventory differs from receipt')
          pathlib.Path(os.environ['RUNNER_TEMP'],'staging-receipt-steward.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY

      - name: Write exact public-corpus admission receipt
        if: steps.start.outputs.corpus_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import pathlib

          staging=json.loads(pathlib.Path(os.environ['RUNNER_TEMP'],'staging-receipt-steward.json').read_text())
          receipt={
            'format':'axm-asoiaf-public-corpus-carrier-import-receipt/7',
            'baseCommit':'${{ steps.start.outputs.base_sha }}',
            'carrierFileCount':32,
            'sourceAttachment':'axm-canon-asoiaf-corpus-v1-carrier.b64.txt',
            'sourceAttachmentSha256':'sha256:d4151d244b0541be1dbb1a1ef5a5ed7c4c808ba11d0ad494450acc58b11e6eaa',
            'canonicalBase64Sha256':'sha256:d4151d244b0541be1dbb1a1ef5a5ed7c4c808ba11d0ad494450acc58b11e6eaa',
            'compressedBytes':619766,
            'compressedSha256':'sha256:a545ed4384238f329f6fa6e6be2dd25150ac3377837defd3e06d26eabdea2476',
            'tarBytes':8017920,
            'tarSha256':'sha256:9b66aff01f12ae3e6f018fd1c5ccd1d9b1fd96810da4343b3d11e3f69bfaab84',
            'materialization':{
              'class':'estate-steward-retained-artifact-staging-admission',
              'repository':'BigBirdReturns/axm-arc',
              'branch':'recovery/axm-canon-public-corpus-v1',
              'commit':os.environ['STAGING_COMMIT'],
              'upstreamMechanism':staging['mechanism'],
            },
            'qualification':{
              'stagingReceipt':'pass','fileInventory':'pass','fileDigests':'pass',
              'unsafePathRejection':'pass','unexpectedPathRejection':'pending-repository-qualification',
              'npmValidate':'pending-repository-qualification',
            },
            'sourcePayloadPresent':False,
            'sourceTextPresent':False,
            'canonEffect':'none',
            'graphEffect':'none',
          }
          out=pathlib.Path('asoiaf/docs/ASOIAF_PUBLIC_CORPUS_V1_IMPORT_RECEIPT.json')
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(receipt,indent=2)+'\n')
          PY

      - name: Refresh repository standing and install deterministic reader
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scripts docs/asoiaf asoiaf/docs .github/workflows
          python - <<'PY'
          from __future__ import annotations

          import json
          import pathlib
          import re

          START='<!-- ASOIAF_CURRENT_STATE_V1_START -->'
          END='<!-- ASOIAF_CURRENT_STATE_V1_END -->'

          def replace_marker(path:pathlib.Path,body:str)->None:
              text=path.read_text(encoding='utf-8') if path.exists() else ''
              block=f'{START}\n{body.rstrip()}\n{END}'
              pattern=re.compile(re.escape(START)+r'.*?'+re.escape(END),re.S)
              text=pattern.sub(block,text) if pattern.search(text) else text.rstrip()+'\n\n'+block+'\n'
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_text(text,encoding='utf-8')

          receipt_path=pathlib.Path('asoiaf/docs/ASOIAF_PUBLIC_CORPUS_V1_IMPORT_RECEIPT.json')
          receipt=json.loads(receipt_path.read_text())
          top='''## Current ASOIAF standing

The repository owns a qualified public-safe ASOIAF corpus and portable canon-constraint machinery. The controlling custody object is [`asoiaf/docs/ASOIAF_PUBLIC_CORPUS_V1_IMPORT_RECEIPT.json`](asoiaf/docs/ASOIAF_PUBLIC_CORPUS_V1_IMPORT_RECEIPT.json). It records the exact import surface and excludes private book payloads, source text, automatic canon promotion, and automatic graph promotion.

Holder-controlled edition bytes remain outside this public repository. Exact-source review, provisional-candidate adjudication, released-future witness control, and reader-facing synthesis retain separate authority.'''
          replace_marker(pathlib.Path('README.md'),top)
          domain='''## Current estate boundary

This directory contains the public-safe corpus, acquisition and review machinery, source-specific evidence records, and the receipts required to distinguish observation from canon admission. Public metadata may identify an edition, source route, released preview, or reviewed proposition, but it cannot impersonate absent edition bytes or create canon authority by accumulation.

The holder-controlled six-edition estate remains private. Chapter-level reconciliation, the 805 provisional-candidate queue, edition-specific conflict handling, and reviewed reader synthesis remain open work. The reader atlas is a custody-visible navigation product over repository records. Its mechanical classes do not change source authority.'''
          replace_marker(pathlib.Path('asoiaf/README.md'),domain)

          ledger=pathlib.Path('GARBAGE_LEDGER.md')
          if ledger.exists():
              text=ledger.read_text(encoding='utf-8')
              replacement='''## Known unfinished corpus work

The public-safe corpus surface is admitted under an exact import receipt, while holder-controlled book bytes remain outside this repository. The main novels have not been reconciled chapter by chapter, the 805 provisional candidates remain a review queue, and the reader-facing atlas remains a governed navigation layer rather than a completed lore encyclopedia. Released-future material, model recall, conversation synthesis, synthetic fixtures, workflow evidence, and external observations retain bounded authority until proposition-level review admits them. Additional orchestration does not close those gaps.
'''
              text=re.sub(r'## Known unfinished corpus work\n.*\Z',replacement,text,flags=re.S) if '## Known unfinished corpus work' in text else text.rstrip()+'\n\n'+replacement
              ledger.write_text(text,encoding='utf-8')

          state=f'''# ASOIAF repository standing

This document records repository ownership after admission of the public-safe corpus. It is a navigation and boundary object, not an independent lore source.

## Admitted public surface

- Import receipt: `{receipt.get('format')}`
- Exact imported file count: `{receipt.get('carrierFileCount')}`
- Private book payload present: `{str(receipt.get('sourcePayloadPresent')).lower()}`
- Source text present: `{str(receipt.get('sourceTextPresent')).lower()}`
- Automatic canon effect: `{receipt.get('canonEffect')}`
- Automatic graph effect: `{receipt.get('graphEffect')}`

## Private and external boundaries

The holder-controlled six-edition book estate is not stored in the public repository. Public observations may support acquisition and review, but they do not substitute for exact edition bytes. Qualified successor packets outside repository ownership remain external until an exact admission commit and receipt say otherwise.

## Open work

Chapter-level reconciliation, adjudication of 805 provisional candidates, edition-specific conflict handling, released-future witness acquisition, and publication of proposition-level reader views remain open. The controlling question for each admission is whether it increases source-backed reader capability without collapsing custody, version, or authority boundaries.
'''
          pathlib.Path('asoiaf/docs/ASOIAF_CURRENT_STATE.md').write_text(state,encoding='utf-8')
          PY

          cat > scripts/build-asoiaf-reader-atlas.py <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations

          import hashlib
          import html
          import json
          import pathlib
          import re
          from collections import Counter
          from typing import Any, Iterable

          ROOT=pathlib.Path(__file__).resolve().parents[1]
          ASOIAF=ROOT/'asoiaf'
          OUT=ROOT/'docs'/'asoiaf'
          OUT.mkdir(parents=True,exist_ok=True)
          EXCLUDED={'private','node_modules','dist','coverage','.git','fixtures','__snapshots__','tests','test'}
          SENSITIVE={'text','content','excerpt','quote','quotation','payload','raw','rawtext','raw_text','response','body','chaptertext','source_text','sourcetext','transcript','lyrics'}
          DISPLAY=('id','recordId','record_id','claimId','claim_id','title','name','subject','entity','question','proposition','summary','description','author','date','publishedAt','published_at','status','state','reviewStatus','review_status','authority','classification','tier','source','sourceId','source_id','sourceUrl','source_url','url','route','citation','work','chapter','edition','language','relationship','relation')
          ARRAYS=('records','items','claims','propositions','observations','candidates','sources','entries','results','questions','answers','relations','events','chapters')

          def canon(value:Any)->bytes:
              return json.dumps(value,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()
          def sha(data:bytes)->str:
              return hashlib.sha256(data).hexdigest()
          def safe(value:Any,limit:int=360)->str|None:
              if value is None or isinstance(value,(dict,list)): return None
              text=re.sub(r'\s+',' ',str(value).replace('\x00','').strip())
              if not text:return None
              return text if len(text)<=limit else text[:limit-1].rstrip()+'…'
          def records(value:Any)->Iterable[tuple[str,Any]]:
              if isinstance(value,list):
                  for i,item in enumerate(value):yield str(i),item
                  return
              if isinstance(value,dict):
                  emitted=False
                  for key in ARRAYS:
                      items=value.get(key)
                      if isinstance(items,list):
                          emitted=True
                          for i,item in enumerate(items):yield f'{key}:{i}',item
                  if emitted:return
              yield 'root',value
          def tokens(value:Any)->set[str]:
              out:set[str]=set(); wanted={'status','state','authority','classification','tier','reviewstatus','review_status','admission','canoneffect','canon_effect','grapheffect','graph_effect','effect','terminal','outcome','sourceclass','source_class'}
              def walk(node:Any,depth:int=0)->None:
                  if depth>6:return
                  if isinstance(node,dict):
                      for key,child in node.items():
                          normalized=str(key).replace('-','_').lower()
                          if normalized in wanted:
                              values=child if isinstance(child,list) else [child]
                              for item in values:
                                  if isinstance(item,(str,int,float,bool)):out.update(re.findall(r'[a-z0-9_-]+',str(item).lower()))
                          walk(child,depth+1)
                  elif isinstance(node,list):
                      for child in node[:100]:walk(child,depth+1)
              walk(value);return out
          def classify(path:pathlib.Path,record:Any)->tuple[str,str]:
              t=tokens(record)|set(re.findall(r'[a-z0-9_-]+',path.as_posix().lower()))
              if t&{'fixture','fixtures','synthetic','canary','test','tests','rejected','excluded','garbage','invalid','failed','failure'}:return 'excluded','test, synthetic, rejected, or excluded marker'
              if t&{'provisional','candidate','candidates','pending','unreviewed','model-recall','model_recall','conversation-synthesis','conversation_synthesis','hypothesis','unknown','none'}:return 'provisional','provisional or non-authoritative marker'
              if t&{'admitted','accepted','approved','reviewed','canonical','source-specific','source_specific','qualified','verified'}:return 'admitted','explicit reviewed, admitted, qualified, or source-specific marker'
              return 'observed','source observation without an explicit admission marker'
          def fields(record:Any)->dict[str,str]:
              if not isinstance(record,dict):
                  value=safe(record);return {'value':value} if value else {}
              out:dict[str,str]={}; lower={str(k).lower():k for k in record}
              for key in DISPLAY:
                  actual=record.get(key)
                  if actual is None and key.lower() in lower:actual=record[lower[key.lower()]]
                  value=safe(actual)
                  if value is not None and key.replace('-','_').lower() not in SENSITIVE:out[key.replace('_',' ')]=value
                  if len(out)>=14:break
              if not out:
                  for key,actual in record.items():
                      if str(key).replace('-','_').lower() in SENSITIVE:continue
                      value=safe(actual,180)
                      if value is not None:out[str(key)]=value
                      if len(out)>=8:break
              return out

          files=sorted(path for path in ASOIAF.rglob('*.json') if not any(part.lower() in EXCLUDED for part in path.relative_to(ROOT).parts))
          entries=[];failures=[]
          for path in files:
              rel=path.relative_to(ROOT);raw=path.read_bytes()
              try:document=json.loads(raw)
              except Exception as exc:failures.append({'path':rel.as_posix(),'error':type(exc).__name__});continue
              for locator,record in records(document):
                  bucket,reason=classify(rel,record)
                  entries.append({'id':f'{rel.as_posix()}#{locator}','bucket':bucket,'classificationReason':reason,'sourcePath':rel.as_posix(),'fileSha256':sha(raw),'recordSha256':sha(canon(record)),'fields':fields(record)})
          entries.sort(key=lambda row:(row['bucket'],row['sourcePath'],row['id']))
          counts=Counter(row['bucket'] for row in entries)
          fingerprint=sha(canon([(path.relative_to(ROOT).as_posix(),sha(path.read_bytes())) for path in files]))
          atlas={'format':'axm-asoiaf-reader-atlas/0.2','corpusFingerprint':fingerprint,'boundary':{'classificationAuthority':'navigation-only','canonEffect':'none','graphEffect':'none','sourceTextIncluded':False,'privatePayloadIncluded':False,'rule':'Source records and review decisions remain controlling; the reader does not promote records.'},'counts':dict(sorted(counts.items())),'sourceFileCount':len(files),'entryCount':len(entries),'parseFailures':failures,'entries':entries}
          encoded=json.dumps(atlas,ensure_ascii=False,indent=2)+'\n'
          lowered=encoded.lower()
          for forbidden in ('"raw_text"','"source_text"','"chaptertext"','"payload"'):
              if forbidden in lowered:raise SystemExit(f'forbidden field leaked: {forbidden}')
          if len(entries)!=sum(counts.values()):raise SystemExit('entry reconstruction failed')
          (OUT/'atlas.json').write_text(encoded,encoding='utf-8')

          cards=[]
          for entry in entries:
              title=entry['fields'].get('title') or entry['fields'].get('name') or entry['fields'].get('subject') or entry['fields'].get('id') or entry['id']
              search=' '.join([entry['id'],entry['sourcePath'],entry['bucket'],*entry['fields'].values()]).lower()
              rows=''.join(f'<dt>{html.escape(str(k))}</dt><dd>{html.escape(str(v))}</dd>' for k,v in entry['fields'].items())
              cards.append(f'<article class="card" data-bucket="{html.escape(entry["bucket"])}" data-search="{html.escape(search,quote=True)}"><div class="eyebrow">{html.escape(entry["bucket"])}</div><h2>{html.escape(str(title))}</h2><p class="path">{html.escape(entry["sourcePath"])}</p><dl>{rows}</dl><details><summary>Custody</summary><code>file sha256:{entry["fileSha256"]}</code><code>record sha256:{entry["recordSha256"]}</code><p>{html.escape(entry["classificationReason"])}</p></details></article>')
          summary=' · '.join(f'{k} {v}' for k,v in sorted(counts.items())) or 'no records'
          page=f'''<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AXM ASOIAF Reader Atlas</title><style>:root{{color-scheme:light dark;font-family:Inter,ui-sans-serif,system-ui,sans-serif}}body{{margin:0;background:Canvas;color:CanvasText}}header{{position:sticky;top:0;z-index:3;padding:1.1rem clamp(1rem,4vw,3rem);background:color-mix(in srgb,Canvas 92%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid color-mix(in srgb,CanvasText 18%,transparent)}}h1{{margin:0 0 .35rem;font-size:clamp(1.55rem,4vw,2.8rem);line-height:1.05}}.sub{{max-width:76rem;margin:0;line-height:1.5}}.controls{{display:grid;grid-template-columns:minmax(12rem,1fr) auto;gap:.75rem;margin-top:1rem}}input,select{{width:100%;box-sizing:border-box;padding:.75rem .85rem;border-radius:.55rem;border:1px solid color-mix(in srgb,CanvasText 28%,transparent);background:Canvas;color:CanvasText;font:inherit}}main{{padding:1.5rem clamp(1rem,4vw,3rem) 4rem}}.grid{{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,22rem),1fr));gap:1rem;align-items:start}}.card{{border:1px solid color-mix(in srgb,CanvasText 20%,transparent);border-radius:.8rem;padding:1rem;background:color-mix(in srgb,Canvas 96%,CanvasText 4%);overflow-wrap:anywhere}}.card[hidden]{{display:none}}.eyebrow{{text-transform:uppercase;letter-spacing:.09em;font-size:.72rem;opacity:.72}}h2{{font-size:1.05rem;margin:.35rem 0 .25rem}}.path,code{{font-family:ui-monospace,monospace;font-size:.75rem;overflow-wrap:anywhere}}dl{{display:grid;grid-template-columns:minmax(6rem,auto) 1fr;gap:.3rem .7rem;margin:.8rem 0}}dt{{font-weight:650}}dd{{margin:0}}details{{border-top:1px solid color-mix(in srgb,CanvasText 14%,transparent);padding-top:.7rem}}code{{display:block;margin-top:.45rem;white-space:normal}}.boundary{{max-width:80rem;border-left:.25rem solid currentColor;padding:.2rem 0 .2rem 1rem;margin:1rem 0 1.5rem;line-height:1.55}}footer{{padding:2rem clamp(1rem,4vw,3rem);border-top:1px solid color-mix(in srgb,CanvasText 18%,transparent);line-height:1.5}}@media(max-width:640px){{.controls{{grid-template-columns:1fr}}dl{{grid-template-columns:1fr;gap:.1rem}}dd{{margin-bottom:.45rem}}}}</style></head><body><header><h1>ASOIAF Reader Atlas</h1><p class="sub">A custody-visible map of public repository records. Navigation classes preserve the distinction among reviewed material, observations, provisional candidates, and excluded evidence.</p><div class="controls"><input id="query" type="search" placeholder="Search entities, sources, paths, and identifiers" aria-label="Search atlas"><select id="bucket" aria-label="Filter authority class"><option value="all">All authority classes</option><option value="admitted">Admitted or reviewed</option><option value="observed">Source observations</option><option value="provisional">Provisional queue</option><option value="excluded">Excluded or test material</option></select></div></header><main><p id="ledger">{html.escape(summary)}</p><div class="boundary"><strong>Boundary.</strong> The atlas makes evidence and review state inspectable. It does not alter source authority, admit a proposition, or supply absent edition text.</div><section class="grid">{''.join(cards)}</section></main><footer>Control question: what exact source and review act would change this entry’s authority?</footer><script>const q=document.querySelector('#query'),b=document.querySelector('#bucket'),cards=[...document.querySelectorAll('.card')],ledger=document.querySelector('#ledger');function apply(){{const n=q.value.trim().toLowerCase(),k=b.value;let v=0;for(const c of cards){{c.hidden=!((k==='all'||c.dataset.bucket===k)&&(!n||c.dataset.search.includes(n)));if(!c.hidden)v++}}ledger.textContent=`${{v}} visible of ${{cards.length}} records · {html.escape(summary)}`}}q.addEventListener('input',apply);b.addEventListener('change',apply);apply();</script></body></html>'''
          (OUT/'index.html').write_text(page,encoding='utf-8')
          (OUT/'README.md').write_text(f'# ASOIAF Reader Atlas v0.2\n\nThis deterministic static reader contains {len(entries)} navigable records across {len(files)} public source files. Corpus fingerprint: `{fingerprint}`. Classification is navigation-only and has no canon or graph effect.\n',encoding='utf-8')
          print(json.dumps({'ok':True,'files':len(files),'entries':len(entries),'counts':dict(counts),'corpusFingerprint':fingerprint,'parseFailures':len(failures)},sort_keys=True))
          PY
          chmod +x scripts/build-asoiaf-reader-atlas.py

          cat > .github/workflows/asoiaf-reader-atlas.yml <<'YAML'
          name: ASOIAF reader atlas qualification

          on:
            pull_request:
              paths: ["asoiaf/**", "scripts/build-asoiaf-reader-atlas.py", "docs/asoiaf/**", ".github/workflows/asoiaf-reader-atlas.yml"]
            push:
              branches: [main]
              paths: ["asoiaf/**", "scripts/build-asoiaf-reader-atlas.py", "docs/asoiaf/**", ".github/workflows/asoiaf-reader-atlas.yml"]
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            qualify:
              runs-on: ubuntu-24.04
              timeout-minutes: 30
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-python@v5
                  with:
                    python-version: '3.11'
                - run: python scripts/build-asoiaf-reader-atlas.py | tee "$RUNNER_TEMP/reader-atlas.json"
                - run: git diff --check
                - name: Require deterministic checked-in reader
                  run: git diff --exit-code -- docs/asoiaf
                - uses: actions/upload-artifact@v4
                  with:
                    name: axm-canon-asoiaf-reader-atlas-qualification
                    path: ${{ runner.temp }}/reader-atlas.json
                    if-no-files-found: error
                    retention-days: 30
          YAML

          cat > .github/workflows/pages.yml <<'YAML'
          name: Publish AXM Canon pages

          on:
            push:
              branches: [main]
              paths: ["docs/**", ".github/workflows/pages.yml"]
            workflow_dispatch:

          permissions:
            contents: read
            pages: write
            id-token: write

          concurrency:
            group: axm-canon-pages
            cancel-in-progress: true

          jobs:
            deploy:
              environment:
                name: github-pages
                url: ${{ steps.deployment.outputs.page_url }}
              runs-on: ubuntu-24.04
              timeout-minutes: 30
              steps:
                - uses: actions/checkout@v4
                - uses: actions/configure-pages@v5
                - uses: actions/upload-pages-artifact@v3
                  with:
                    path: docs
                - id: deployment
                  uses: actions/deploy-pages@v4
          YAML

          cat > asoiaf/docs/ASOIAF_READER_ATLAS_V0_2.md <<'EOF'
          # ASOIAF Reader Atlas v0.2

          The reader atlas is a deterministic, custody-visible map over public repository records. It separates reviewed or admitted material, source observations, provisional candidates, and excluded or synthetic evidence while preserving each record's repository path, file digest, and record digest.

          The builder excludes private and test paths, suppresses common raw-text and payload fields, and assigns its own navigation classes no canon or graph effect. The source object's authority remains controlling. The next substantive expansion is proposition-level domain views for characters, places, chronology, source routes, edition conflicts, and unresolved alternatives.
          EOF

      - name: Prove deterministic reader reconstruction
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build-asoiaf-reader-atlas.py | tee "$RUNNER_TEMP/atlas-build-1.json"
          find docs/asoiaf -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/atlas-pass-1.SHA256SUMS"
          python scripts/build-asoiaf-reader-atlas.py | tee "$RUNNER_TEMP/atlas-build-2.json"
          find docs/asoiaf -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/atlas-pass-2.SHA256SUMS"
          diff -u "$RUNNER_TEMP/atlas-build-1.json" "$RUNNER_TEMP/atlas-build-2.json"
          diff -u "$RUNNER_TEMP/atlas-pass-1.SHA256SUMS" "$RUNNER_TEMP/atlas-pass-2.SHA256SUMS"
          python - <<'PY'
          import json,pathlib
          atlas=json.loads(pathlib.Path('docs/asoiaf/atlas.json').read_text())
          if atlas['boundary']['canonEffect']!='none' or atlas['boundary']['graphEffect']!='none':raise SystemExit('reader changed authority')
          if atlas['boundary']['sourceTextIncluded'] or atlas['boundary']['privatePayloadIncluded']:raise SystemExit('reader leaked bounded content')
          if atlas['entryCount']!=len(atlas['entries']):raise SystemExit('entry count mismatch')
          for entry in atlas['entries']:
              if not entry.get('fileSha256') or not entry.get('recordSha256') or not entry.get('sourcePath'):raise SystemExit('entry lacks custody')
          PY
          git diff --check

      - name: Qualify complete repository and finalize receipt
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          PYTHONWARNINGS=error npm run validate
          rm -rf dist
          python - <<'PY'
          import json,pathlib
          path=pathlib.Path('asoiaf/docs/ASOIAF_PUBLIC_CORPUS_V1_IMPORT_RECEIPT.json')
          receipt=json.loads(path.read_text())
          qualification=receipt.setdefault('qualification',{})
          qualification.update({'npmValidate':'pass','unexpectedPathRejection':'pass','readerAtlasDeterminism':'pass','readerAtlasBoundary':'pass'})
          path.write_text(json.dumps(receipt,indent=2)+'\n')
          PY
          git diff --check

      - name: Commit converged estate and remove temporary control plane
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -f .github/workflows/asoiaf-public-corpus-recovery-watch.yml
          rm -f .github/workflows/asoiaf-estate-steward-v1.yml
          git add -A
          git diff --cached --check
          git config user.name 'BigBirdReturns'
          git config user.email '219768509+BigBirdReturns@users.noreply.github.com'
          if git diff --cached --quiet; then
            printf 'result=no-change\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m 'Converge governed ASOIAF public estate and reader atlas v0.2'
          sha="$(git rev-parse HEAD)"
          printf 'published_sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
          set +e
          git push origin HEAD:main >"$RUNNER_TEMP/direct-push.log" 2>&1
          direct=$?
          set -e
          if [ "$direct" = '0' ]; then
            printf 'result=direct-main\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          branch="asoiaf/estate-steward-v1-${GITHUB_RUN_ID}"
          git push origin "HEAD:$branch"
          pr="$(gh api --method POST "repos/$GITHUB_REPOSITORY/pulls" -f title='Converge governed ASOIAF public estate and reader atlas v0.2' -f head="$branch" -f base=main -f body='Admits the exact public corpus when required, refreshes repository standing, publishes the deterministic custody-visible reader atlas, and removes the temporary recovery control plane. Full repository validation and two byte-identical atlas reconstructions passed.' --jq '.number')"
          printf 'pr=%s\n' "$pr" >> "$GITHUB_OUTPUT"
          set +e
          gh api --method PUT "repos/$GITHUB_REPOSITORY/pulls/$pr/merge" -f merge_method=merge -f sha="$sha" >"$RUNNER_TEMP/merge.json" 2>&1
          merged=$?
          set -e
          if [ "$merged" = '0' ]; then
            printf 'result=merged-pr\n' >> "$GITHUB_OUTPUT"
          else
            printf 'result=branch-ready\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Retain convergence receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/asoiaf-estate-steward-v1"
          mkdir -p "$root"
          cp "$RUNNER_TEMP/atlas-build-1.json" "$RUNNER_TEMP/atlas-build-2.json" "$RUNNER_TEMP/atlas-pass-1.SHA256SUMS" "$RUNNER_TEMP/atlas-pass-2.SHA256SUMS" "$root/" 2>/dev/null || true
          cp "$RUNNER_TEMP/direct-push.log" "$RUNNER_TEMP/merge.json" "$root/" 2>/dev/null || true
          printf '%s\n' \
            "base=${{ steps.start.outputs.base_sha }}" \
            "corpusNeeded=${{ steps.start.outputs.corpus_needed }}" \
            "staging=${STAGING_COMMIT:-none}" \
            "published=${{ steps.publish.outputs.published_sha }}" \
            "result=${{ steps.publish.outputs.result }}" \
            "pr=${{ steps.publish.outputs.pr }}" > "$root/terminal.txt"
          find "$root" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum | sed "s#  $root/#  #" > "$root/SHA256SUMS"

      - name: Upload convergence receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axm-canon-asoiaf-estate-steward-v1
          path: ${{ runner.temp }}/asoiaf-estate-steward-v1
          if-no-files-found: error
          retention-days: 30
