name: Admit AGOT patch-bundle worktree compatibility auditor

on:
  push:
    branches:
      - ops/asoiaf-agot-patch-bundle-worktree-compatibility-auditor-admission-v1
    paths:
      - .github/workflows/admit-agot-patch-bundle-worktree-compatibility-auditor-v1.yml

permissions:
  contents: write
  pull-requests: write
  actions: read
  checks: read
  statuses: read

jobs:
  admit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: BigBirdReturns/axm-canon
      HEAD_BRANCH: agent/asoiaf-agot-patch-bundle-worktree-compatibility-auditor-v1
      UPSTREAM_RECEIPT_REF: receipt/asoiaf-agot-local-feature-patch-bundle-sealer-v1
      AUDITOR_RECEIPT_REF: receipt/asoiaf-agot-patch-bundle-worktree-compatibility-auditor-v1
      ADAPTER_REQUIRED_REF: receipt/asoiaf-agot-patch-bundle-worktree-compatibility-adapter-required-v1
      DIRECT_COMPATIBLE_REF: receipt/asoiaf-agot-patch-bundle-worktree-direct-compatible-v1
      COMPONENT_ROOT: asoiaf/public/review/agot-patch-bundle-worktree-compatibility-auditor-v1
      TEST_PATH: asoiaf/tests/asoiaf-agot-patch-bundle-worktree-compatibility-auditor-source.test.ts
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Resolve exact pull request, upstream receipt, and compare surface
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          pr_json="$(gh pr list --repo "$REPOSITORY" --state open --head "$HEAD_BRANCH" --base main --limit 2 --json number,headRefOid,isDraft,url)"
          test "$(jq 'length' <<<"$pr_json")" -eq 1
          pr="$(jq -r '.[0].number' <<<"$pr_json")"
          head="$(jq -r '.[0].headRefOid' <<<"$pr_json")"
          receipt_sha="$(git ls-remote --heads origin "refs/heads/$UPSTREAM_RECEIPT_REF" | awk '{print $1}')"
          test -n "$receipt_sha"
          git fetch --no-tags origin "+refs/heads/$HEAD_BRANCH:refs/remotes/origin/$HEAD_BRANCH" "+refs/heads/$UPSTREAM_RECEIPT_REF:refs/remotes/origin/$UPSTREAM_RECEIPT_REF" "+refs/heads/main:refs/remotes/origin/main"
          test "$(git merge-base "$receipt_sha" "$head")" = "$receipt_sha"
          test "$(git merge-base "$receipt_sha" refs/remotes/origin/main)" = "$receipt_sha"
          base="$(git merge-base refs/remotes/origin/main "$head")"
          mapfile -t observed < <(git diff --name-only "$base...$head" | LC_ALL=C sort)
          mapfile -t expected < <(printf '%s\n' \
            "$COMPONENT_ROOT/CONTRACT.json" \
            "$COMPONENT_ROOT/CURRENT_STANDING.json" \
            "$COMPONENT_ROOT/README.md" \
            "$COMPONENT_ROOT/Run-Audit-Patch-Bundle-Worktree-Compatibility.cmd" \
            "$COMPONENT_ROOT/audit_compatibility.py" \
            "$COMPONENT_ROOT/synthetic_campaign.py" \
            "$COMPONENT_ROOT/verify.py" \
            "$TEST_PATH" | LC_ALL=C sort)
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${observed[@]}")
          test "${#observed[@]}" -eq 8
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "upstream_receipt_sha=$receipt_sha" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Check out exact observed head
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "${{ steps.resolve.outputs.head }}"
          test "$(git rev-parse HEAD)" = "${{ steps.resolve.outputs.head }}"

      - name: Install repository dependencies
        run: npm ci

      - name: Run direct warnings-as-errors qualification and exact current audit
        id: direct
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONSAFEPATH=1
          export PYTHONWARNINGS=error
          python -W error -S "$COMPONENT_ROOT/verify.py" | tee /tmp/auditor-static.json
          python -W error -S "$COMPONENT_ROOT/synthetic_campaign.py" | tee /tmp/auditor-synthetic.json
          python -W error -S "$COMPONENT_ROOT/audit_compatibility.py" --repository-root "$GITHUB_WORKSPACE" | tee /tmp/current-audit.json
          test "$(jq -r .status /tmp/auditor-static.json)" = PASS
          test "$(jq -r .passed /tmp/auditor-static.json)" = "$(jq -r .total /tmp/auditor-static.json)"
          test "$(jq -r .status /tmp/auditor-synthetic.json)" = PASS
          test "$(jq -r .passed /tmp/auditor-synthetic.json)" = "$(jq -r .total /tmp/auditor-synthetic.json)"
          test "$(jq -r .status /tmp/current-audit.json)" = PASS_PATCH_BUNDLE_WORKTREE_COMPATIBILITY_AUDIT_COMPLETED_EFFECT_WITHHELD
          outcome="$(jq -r .outcome /tmp/current-audit.json)"
          case "$outcome" in
            DIRECTLY_COMPATIBLE_EXECUTION_WITHHELD|ADAPTER_REQUIRED_EXECUTION_WITHHELD) ;;
            *) exit 1 ;;
          esac
          test "$(jq -r '[.directCompatibilityProven,.adapterRequired] | map(select(. == true)) | length' /tmp/current-audit.json)" -eq 1
          echo "static_passed=$(jq -r .passed /tmp/auditor-static.json)" >> "$GITHUB_OUTPUT"
          echo "static_total=$(jq -r .total /tmp/auditor-static.json)" >> "$GITHUB_OUTPUT"
          echo "synthetic_passed=$(jq -r .passed /tmp/auditor-synthetic.json)" >> "$GITHUB_OUTPUT"
          echo "synthetic_total=$(jq -r .total /tmp/auditor-synthetic.json)" >> "$GITHUB_OUTPUT"
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
          echo "next_hold=$(jq -r .nextAuthorityHold /tmp/current-audit.json)" >> "$GITHUB_OUTPUT"
          echo "audit_sha=$(jq -r .auditSha256 /tmp/current-audit.json)" >> "$GITHUB_OUTPUT"
          echo "mismatch_count=$(jq -r '.mismatches | length' /tmp/current-audit.json)" >> "$GITHUB_OUTPUT"

      - name: Run strict TypeScript, targeted replay, and complete repository suite
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck --if-present
          npx vitest run "$TEST_PATH"
          npx vitest run

      - name: Mark exact pull request ready
        shell: bash
        run: |
          set -euo pipefail
          pr="${{ steps.resolve.outputs.pr }}"
          head="${{ steps.resolve.outputs.head }}"
          test "$(gh pr view "$pr" --repo "$REPOSITORY" --json headRefOid --jq .headRefOid)" = "$head"
          if gh pr view "$pr" --repo "$REPOSITORY" --json isDraft --jq .isDraft | grep -qx true; then
            gh pr ready "$pr" --repo "$REPOSITORY"
          fi

      - name: Require ordinary ASOIAF qualification on exact head
        id: ordinary
        shell: bash
        run: |
          set -euo pipefail
          head="${{ steps.resolve.outputs.head }}"
          run_id=""
          for attempt in $(seq 1 72); do
            run_id="$(gh run list --repo "$REPOSITORY" --workflow "ASOIAF canon estate qualification" --commit "$head" --limit 20 --json databaseId,headSha,status,conclusion --jq '[.[] | select(.headSha == "'"$head"'")] | sort_by(.databaseId) | last | .databaseId // empty')"
            if test -n "$run_id"; then break; fi
            sleep 5
          done
          test -n "$run_id"
          gh run watch "$run_id" --repo "$REPOSITORY" --exit-status
          test "$(gh run view "$run_id" --repo "$REPOSITORY" --json conclusion --jq .conclusion)" = success
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Squash merge with exact head guard
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          pr="${{ steps.resolve.outputs.pr }}"
          head="${{ steps.resolve.outputs.head }}"
          test "$(gh pr view "$pr" --repo "$REPOSITORY" --json headRefOid --jq .headRefOid)" = "$head"
          gh pr merge "$pr" --repo "$REPOSITORY" --squash --match-head-commit "$head" \
            --subject "Admit AGOT patch-bundle worktree compatibility auditor (#$pr)" \
            --body "Admit the exact conservative compatibility auditor after direct warnings-as-errors qualification, exact executor-package reconstruction, targeted and complete repository replay, and ordinary ASOIAF qualification on head $head. Preserve the classified compatibility outcome as an execution hold and retain zero real bundle, adapter, worktree, index, commit, reference, remote, pull-request, canon, and graph effects."
          for attempt in $(seq 1 30); do
            merged="$(gh pr view "$pr" --repo "$REPOSITORY" --json mergedAt --jq .mergedAt)"
            if test "$merged" != null; then break; fi
            sleep 2
          done
          test "$merged" != null
          main_sha="$(gh api "repos/$REPOSITORY/branches/main" --jq .commit.sha)"
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"

      - name: Replay exact audit from merged main
        id: replay
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git checkout --detach "${{ steps.merge.outputs.main_sha }}"
          test "$(git rev-parse HEAD)" = "${{ steps.merge.outputs.main_sha }}"
          export PYTHONSAFEPATH=1
          export PYTHONWARNINGS=error
          python -W error -S "$COMPONENT_ROOT/verify.py" | tee /tmp/merged-static.json
          python -W error -S "$COMPONENT_ROOT/synthetic_campaign.py" | tee /tmp/merged-synthetic.json
          python -W error -S "$COMPONENT_ROOT/audit_compatibility.py" --repository-root "$GITHUB_WORKSPACE" | tee /tmp/merged-audit.json
          test "$(jq -r .status /tmp/merged-static.json)" = PASS
          test "$(jq -r .status /tmp/merged-synthetic.json)" = PASS
          test "$(jq -r .status /tmp/merged-audit.json)" = PASS_PATCH_BUNDLE_WORKTREE_COMPATIBILITY_AUDIT_COMPLETED_EFFECT_WITHHELD
          test "$(jq -r .outcome /tmp/merged-audit.json)" = "${{ steps.direct.outputs.outcome }}"
          test "$(jq -r .auditSha256 /tmp/merged-audit.json)" = "${{ steps.direct.outputs.audit_sha }}"
          npx vitest run "$TEST_PATH"
          echo "main_tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"

      - name: Fix exact receipt and outcome references
        shell: bash
        run: |
          set -euo pipefail
          main_sha="${{ steps.merge.outputs.main_sha }}"
          fix_ref() {
            local ref="$1"
            local old
            old="$(git ls-remote --heads origin "refs/heads/$ref" | awk '{print $1}')"
            if test -n "$old" && test "$old" != "$main_sha"; then
              echo "divergent receipt reference refused: $ref" >&2
              exit 1
            fi
            if test -z "$old"; then
              git push origin "$main_sha:refs/heads/$ref"
            fi
          }
          fix_ref "$AUDITOR_RECEIPT_REF"
          case "${{ steps.direct.outputs.outcome }}" in
            ADAPTER_REQUIRED_EXECUTION_WITHHELD) fix_ref "$ADAPTER_REQUIRED_REF" ;;
            DIRECTLY_COMPATIBLE_EXECUTION_WITHHELD) fix_ref "$DIRECT_COMPATIBLE_REF" ;;
            *) exit 1 ;;
          esac

      - name: Write admission and compatibility receipts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/admission
          cp /tmp/current-audit.json /tmp/admission/DIRECT_AUDIT.json
          cp /tmp/merged-audit.json /tmp/admission/MERGED_MAIN_AUDIT.json
          cp /tmp/auditor-static.json /tmp/admission/DIRECT_STATIC.json
          cp /tmp/auditor-synthetic.json /tmp/admission/DIRECT_SYNTHETIC.json
          cp /tmp/merged-static.json /tmp/admission/MERGED_STATIC.json
          cp /tmp/merged-synthetic.json /tmp/admission/MERGED_SYNTHETIC.json
          jq -n \
            --arg componentId "asoiaf-agot-patch-bundle-worktree-compatibility-auditor-v1" \
            --arg upstreamReceiptCommit "${{ steps.resolve.outputs.upstream_receipt_sha }}" \
            --arg candidateCommit "${{ steps.resolve.outputs.head }}" \
            --argjson pullRequest "${{ steps.resolve.outputs.pr }}" \
            --argjson ordinaryRun "${{ steps.ordinary.outputs.run_id }}" \
            --arg mergeCommit "${{ steps.merge.outputs.main_sha }}" \
            --arg mergeTree "${{ steps.replay.outputs.main_tree }}" \
            --arg outcome "${{ steps.direct.outputs.outcome }}" \
            --arg nextAuthorityHold "${{ steps.direct.outputs.next_hold }}" \
            --arg auditSha256 "${{ steps.direct.outputs.audit_sha }}" \
            --argjson mismatchCount "${{ steps.direct.outputs.mismatch_count }}" \
            --argjson staticPassed "${{ steps.direct.outputs.static_passed }}" \
            --argjson staticTotal "${{ steps.direct.outputs.static_total }}" \
            --argjson syntheticPassed "${{ steps.direct.outputs.synthetic_passed }}" \
            --argjson syntheticTotal "${{ steps.direct.outputs.synthetic_total }}" \
            '{schema:"axm-asoiaf-agot-patch-bundle-worktree-compatibility-auditor-admission/1",componentId:$componentId,upstreamReceiptCommit:$upstreamReceiptCommit,candidateCommit:$candidateCommit,pullRequest:$pullRequest,ordinaryQualificationRun:$ordinaryRun,mergeCommit:$mergeCommit,mergeTree:$mergeTree,outcome:$outcome,nextAuthorityHold:$nextAuthorityHold,auditSha256:$auditSha256,mismatchCount:$mismatchCount,qualification:{static:{passed:$staticPassed,total:$staticTotal},synthetic:{passed:$syntheticPassed,total:$syntheticTotal},warningsAsErrors:true,currentAudit:true,targetedRepositoryReplay:true,completeRepositoryReplay:true,mergedMainReplay:true},counts:{realPatchBundlesConsumed:0,realCompatibilityAuditsExecuted:0,realAdaptersMaterialized:0,realWorktreeDryRunsExecuted:0,realWorktreesModified:0,realLiveIndexesModified:0,realCommitsCreatedByRuntime:0,realReferencesUpdated:0,realRemotePushes:0,realPullRequestsOpenedByRuntime:0,automaticCanonPromotions:0,automaticGraphMutations:0},status:"PASS_REPOSITORY_SOURCE_ADMITTED_CURRENT_COMPATIBILITY_CLASSIFIED_AND_MERGED_MAIN_REPLAYED"}' \
            > /tmp/admission/ADMISSION_RECEIPT.json

      - uses: actions/upload-artifact@v4
        with:
          name: asoiaf-agot-patch-bundle-worktree-compatibility-auditor-admission-v1
          path: /tmp/admission
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
