name: ASOIAF canon estate qualification

on:
  pull_request:
    paths:
      - "asoiaf/**"
      - "src/**"
      - "scripts/validate-estate.ts"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "vitest.config.ts"
      - ".github/workflows/asoiaf.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: axm-canon-asoiaf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci --no-audit --no-fund
      - name: Strict TypeScript
        run: npm run typecheck | tee "$RUNNER_TEMP/typecheck.log"
      - name: Complete canon and ASOIAF tests
        run: npm test | tee "$RUNNER_TEMP/tests.log"
      - name: Private-corpus operator witnesses
        run: npm run test:python | tee "$RUNNER_TEMP/python-tests.log"
      - name: Public corpus and reader boundary
        run: npm run validate:public-corpus | tee "$RUNNER_TEMP/public-corpus-verification.json"
      - name: Build package and reconstruct estate counts
        shell: bash
        run: |
          set -euo pipefail
          npm run build | tee "$RUNNER_TEMP/build.log"
          npm run smoke:asoiaf | tee "$RUNNER_TEMP/estate-smoke.json"
      - name: Retain qualification receipt
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/axm-canon-asoiaf-qualification"
          mkdir -p "$root"
          cp "$RUNNER_TEMP/typecheck.log" "$RUNNER_TEMP/tests.log" "$RUNNER_TEMP/python-tests.log" "$RUNNER_TEMP/public-corpus-verification.json" "$RUNNER_TEMP/build.log" "$RUNNER_TEMP/estate-smoke.json" "$root/"
          git rev-parse HEAD > "$root/candidate-sha.txt"
          printf '%s\n' \
            'authority=source-and-review-specific' \
            'modelRecallAuthority=none' \
            'conversationSynthesisAuthority=none' \
            'tierBenchIncluded=false' \
            'privateBookPayloadIncluded=false' \
            'publicSourceTextIncluded=false' \
            'editionCount=6' \
            'paragraphLocatorCount=45828' \
            'candidatePromotionCount=0' \
            > "$root/boundary.txt"
          find "$root" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum | sed "s#  $root/#  #" > "$root/SHA256SUMS"
          git diff --check
          rm -rf dist
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        with:
          name: axm-canon-asoiaf-qualification
          path: ${{ runner.temp }}/axm-canon-asoiaf-qualification
          if-no-files-found: error
          retention-days: 30
