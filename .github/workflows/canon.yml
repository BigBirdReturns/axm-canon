name: AXM Canon qualification

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "vitest.config.ts"
      - ".github/workflows/canon.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: axm-canon-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test:core
      - run: npm run build
      - name: Require clean tracked source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          rm -rf dist
          test -z "$(git status --porcelain)"
