name: Admit AGOT commit-receipt reference-updater compatibility auditor

on:
  push:
    branches:
      - ops/asoiaf-agot-commit-receipt-reference-updater-compatibility-auditor-admission-v1
    paths:
      - .github/workflows/admit-agot-commit-receipt-reference-updater-compatibility-auditor-v1.yml

permissions:
  contents: write
  pull-requests: write
  actions: read
  checks: read
  statuses: read

jobs:
  admit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: BigBirdReturns/axm-canon
      HEAD_BRANCH: agent/asoiaf-agot-commit-receipt-reference-updater-compatibility-auditor-qualified-v1
      QUALIFIED_REF: receipt/asoiaf-agot-commit-receipt-reference-updater-compatibility-auditor-candidate-qualified-v1
      UPSTREAM_RECEIPT_REF: receipt/asoiaf-agot-temporary-index-commit-object-ready-for-reference-update-v1
      AUDITOR_RECEIPT_REF: receipt/asoiaf-agot-commit-receipt-reference-updater-compatibility-auditor-v1
      DETACHMENT_REQUIRED_REF: receipt/asoiaf-agot-commit-receipt-reference-updater-worktree-detachment-required-v1
      ADAPTER_REQUIRED_REF: receipt/asoiaf-agot-commit-receipt-reference-updater-adapter-required-v1
      DIRECT_COMPATIBLE_REF: receipt/asoiaf-agot-commit-receipt-reference-updater-direct-compatible-v1
      COMPONENT_ROOT: asoiaf/public/review/agot-commit-receipt-reference-updater-compatibility-auditor-v1
      TEST_PATH: asoiaf/tests/asoiaf-agot-commit-receipt-reference-updater-compatibility-auditor-source.test.ts
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Resolve exact pull request, qualification receipts, and compare surface
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          pr_json="$(gh pr list --repo "$REPOSITORY" --state open --head "$HEAD_BRANCH" --base main --limit 2 --json number,headRefOid,isDraft,url)"
          test "$(jq 'length' <<<"$pr_json")" -eq 1
          pr="$(jq -r '.[0].number' <<<"$pr_json")"
          head="$(jq -r '.[0].headRefOid' <<<"$pr_json")"
          qualified="$(git ls-remote --heads origin "refs/heads/$QUALIFIED_REF" | awk '{print $1}')"
          upstream="$(git ls-remote --heads origin "refs/heads/$UPSTREAM_RECEIPT_REF" | awk '{print $1}')"
          test -n "$qualified"
          test -n "$upstream"
          test "$head" = "$qualified"
          git fetch --no-tags origin \
            "+refs/heads/$HEAD_BRANCH:refs/remotes/origin/$HEAD_BRANCH" \
            "+refs/heads/$QUALIFIED_REF:refs/remotes/origin/$QUALIFIED_REF" \
            "+refs/heads/$UPSTREAM_RECEIPT_REF:refs/remotes/origin/$UPSTREAM_RECEIPT_REF" \
            "+refs/heads/main:refs/remotes/origin/main"
          test "$(git merge-base "$upstream" "$head")" = "$upstream"
          test "$(git merge-base "$upstream" refs/remotes/origin/main)" = "$upstream"
          base="$(git merge-base refs/remotes/origin/main "$head")"
          mapfile -t observed < <(git diff --name-only "$base...$head" | LC_ALL=C sort)
          mapfile -t expected < <(printf '%s\n' \
            "$COMPONENT_ROOT/CONTRACT.json" \
            "$COMPONENT_ROOT/CURRENT_STANDING.json" \
            "$COMPONENT_ROOT/README.md" \
            "$COMPONENT_ROOT/Run-Audit-Commit-Receipt-Reference-Updater-Compatibility.cmd" \
            "$COMPONENT_ROOT/audit_compatibility.py" \
            "$COMPONENT_ROOT/synthetic_campaign.py" \
            "$COMPONENT_ROOT/verify.py" \
            "$TEST_PATH" | LC_ALL=C sort)
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${observed[@]}")
          test "${#observed[@]}" -eq 8
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "qualified_receipt=$qualified" >> "$GITHUB_OUTPUT"
          echo "upstream_receipt=$upstream" >> "$GITHUB_OUTPUT"

      - name: Check out exact observed head
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "${{ steps.resolve.outputs.head }}"
          test "$(git rev-parse HEAD)" = "${{ steps.resolve.outputs.head }}"

      - name: Install repository dependencies
        run: npm ci

      - name: Run direct qualification and exact current audit
        id: direct
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONSAFEPATH=1
          export PYTHONWARNINGS=error
          python -W error -S "$COMPONENT_ROOT/verify.py" | tee /tmp/static.json
          python -W error -S "$COMPONENT_ROOT/synthetic_campaign.py" | tee /tmp/synthetic.json
          python -W error -S "$COMPONENT_ROOT/audit_compatibility.py" --repository-root "$GITHUB_WORKSPACE" | tee /tmp/audit.json
          test "$(jq -r .status /tmp/static.json)" = PASS
          test "$(jq -r .passed /tmp/static.json)" = "$(jq -r .total /tmp/static.json)"
          test "$(jq -r .status /tmp/synthetic.json)" = PASS
          test "$(jq -r .passed /tmp/synthetic.json)" = "$(jq -r .total /tmp/synthetic.json)"
          test "$(jq -r .status /tmp/audit.json)" = PASS_COMMIT_RECEIPT_REFERENCE_UPDATER_COMPATIBILITY_AUDIT_COMPLETED_EFFECT_WITHHELD
          outcome="$(jq -r .outcome /tmp/audit.json)"
          case "$outcome" in
            DIRECTLY_COMPATIBLE_REFERENCE_UPDATE_WITHHELD|REFERENCE_UPDATER_ADAPTER_REQUIRED_WITHHELD|FEATURE_WORKTREE_DETACHMENT_REQUIRED_WITHHELD|FEATURE_WORKTREE_DETACHMENT_AND_REFERENCE_ADAPTER_REQUIRED_WITHHELD) ;;
            *) exit 1 ;;
          esac
          echo "static_passed=$(jq -r .passed /tmp/static.json)" >> "$GITHUB_OUTPUT"
          echo "static_total=$(jq -r .total /tmp/static.json)" >> "$GITHUB_OUTPUT"
          echo "synthetic_passed=$(jq -r .passed /tmp/synthetic.json)" >> "$GITHUB_OUTPUT"
          echo "synthetic_total=$(jq -r .total /tmp/synthetic.json)" >> "$GITHUB_OUTPUT"
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
          echo "next_hold=$(jq -r .nextAuthorityHold /tmp/audit.json)" >> "$GITHUB_OUTPUT"
          echo "audit_sha=$(jq -r .auditSha256 /tmp/audit.json)" >> "$GITHUB_OUTPUT"
          echo "mismatch_count=$(jq -r '.mismatches | length' /tmp/audit.json)" >> "$GITHUB_OUTPUT"
          echo "detachment_required=$(jq -r .worktreeDetachmentRequired /tmp/audit.json)" >> "$GITHUB_OUTPUT"
          echo "adapter_required=$(jq -r .metadataAdapterRequired /tmp/audit.json)" >> "$GITHUB_OUTPUT"

      - name: Run strict TypeScript, targeted replay, and complete repository suite
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck --if-present
          npx vitest run "$TEST_PATH"
          npx vitest run

      - name: Mark exact pull request ready
        shell: bash
        run: |
          set -euo pipefail
          pr="${{ steps.resolve.outputs.pr }}"
          head="${{ steps.resolve.outputs.head }}"
          test "$(gh pr view "$pr" --repo "$REPOSITORY" --json headRefOid --jq .headRefOid)" = "$head"
          if gh pr view "$pr" --repo "$REPOSITORY" --json isDraft --jq .isDraft | grep -qx true; then gh pr ready "$pr" --repo "$REPOSITORY"; fi

      - name: Require ordinary ASOIAF qualification on exact head
        id: ordinary
        shell: bash
        run: |
          set -euo pipefail
          head="${{ steps.resolve.outputs.head }}"
          run_id=""
          for attempt in $(seq 1 96); do
            run_id="$(gh run list --repo "$REPOSITORY" --workflow "ASOIAF canon estate qualification" --commit "$head" --limit 20 --json databaseId,headSha,status,conclusion --jq '[.[] | select(.headSha == "'"$head"'")] | sort_by(.databaseId) | last | .databaseId // empty')"
            if test -n "$run_id"; then break; fi
            sleep 5
          done
          test -n "$run_id"
          gh run watch "$run_id" --repo "$REPOSITORY" --exit-status
          test "$(gh run view "$run_id" --repo "$REPOSITORY" --json conclusion --jq .conclusion)" = success
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Squash merge with exact head guard
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          pr="${{ steps.resolve.outputs.pr }}"
          head="${{ steps.resolve.outputs.head }}"
          test "$(gh pr view "$pr" --repo "$REPOSITORY" --json headRefOid --jq .headRefOid)" = "$head"
          gh pr merge "$pr" --repo "$REPOSITORY" --squash --match-head-commit "$head" \
            --subject "Admit AGOT commit-receipt reference-updater compatibility auditor (#$pr)" \
            --body "Admit the exact receipt-qualified metadata and topology auditor after reconstructing the 19,441-byte reference updater, direct warnings-as-errors qualification, targeted and complete repository replay, and ordinary ASOIAF qualification on head $head. Preserve worktree detachment and branch compare-and-swap as distinct withheld transitions."
          for attempt in $(seq 1 30); do
            merged="$(gh pr view "$pr" --repo "$REPOSITORY" --json mergedAt --jq .mergedAt)"
            if test "$merged" != null; then break; fi
            sleep 2
          done
          test "$merged" != null
          echo "main_sha=$(gh api "repos/$REPOSITORY/branches/main" --jq .commit.sha)" >> "$GITHUB_OUTPUT"

      - name: Replay exact audit from merged main
        id: replay
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git checkout --detach "${{ steps.merge.outputs.main_sha }}"
          export PYTHONSAFEPATH=1
          export PYTHONWARNINGS=error
          python -W error -S "$COMPONENT_ROOT/verify.py" | tee /tmp/merged-static.json
          python -W error -S "$COMPONENT_ROOT/synthetic_campaign.py" | tee /tmp/merged-synthetic.json
          python -W error -S "$COMPONENT_ROOT/audit_compatibility.py" --repository-root "$GITHUB_WORKSPACE" | tee /tmp/merged-audit.json
          test "$(jq -r .status /tmp/merged-static.json)" = PASS
          test "$(jq -r .status /tmp/merged-synthetic.json)" = PASS
          test "$(jq -r .outcome /tmp/merged-audit.json)" = "${{ steps.direct.outputs.outcome }}"
          test "$(jq -r .auditSha256 /tmp/merged-audit.json)" = "${{ steps.direct.outputs.audit_sha }}"
          npx vitest run "$TEST_PATH"
          echo "main_tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"

      - name: Fix auditor and normalized outcome references
        shell: bash
        run: |
          set -euo pipefail
          main_sha="${{ steps.merge.outputs.main_sha }}"
          fix_ref() {
            local ref="$1"
            local old
            old="$(git ls-remote --heads origin "refs/heads/$ref" | awk '{print $1}')"
            if test -n "$old" && test "$old" != "$main_sha"; then echo "divergent receipt reference: $ref" >&2; exit 1; fi
            if test -z "$old"; then git push origin "$main_sha:refs/heads/$ref"; fi
          }
          fix_ref "$AUDITOR_RECEIPT_REF"
          if test "${{ steps.direct.outputs.detachment_required }}" = true; then fix_ref "$DETACHMENT_REQUIRED_REF"; fi
          if test "${{ steps.direct.outputs.adapter_required }}" = true; then fix_ref "$ADAPTER_REQUIRED_REF"; fi
          if test "${{ steps.direct.outputs.outcome }}" = DIRECTLY_COMPATIBLE_REFERENCE_UPDATE_WITHHELD; then fix_ref "$DIRECT_COMPATIBLE_REF"; fi

      - name: Write admission receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/admission
          cp /tmp/audit.json /tmp/admission/DIRECT_AUDIT.json
          cp /tmp/merged-audit.json /tmp/admission/MERGED_AUDIT.json
          cp /tmp/static.json /tmp/admission/DIRECT_STATIC.json
          cp /tmp/synthetic.json /tmp/admission/DIRECT_SYNTHETIC.json
          cp /tmp/merged-static.json /tmp/admission/MERGED_STATIC.json
          cp /tmp/merged-synthetic.json /tmp/admission/MERGED_SYNTHETIC.json
          jq -n \
            --arg componentId "asoiaf-agot-commit-receipt-reference-updater-compatibility-auditor-v1" \
            --arg qualifiedCandidateCommit "${{ steps.resolve.outputs.qualified_receipt }}" \
            --arg upstreamReceiptCommit "${{ steps.resolve.outputs.upstream_receipt }}" \
            --arg candidateCommit "${{ steps.resolve.outputs.head }}" \
            --argjson pullRequest "${{ steps.resolve.outputs.pr }}" \
            --argjson ordinaryRun "${{ steps.ordinary.outputs.run_id }}" \
            --arg mergeCommit "${{ steps.merge.outputs.main_sha }}" \
            --arg mergeTree "${{ steps.replay.outputs.main_tree }}" \
            --arg outcome "${{ steps.direct.outputs.outcome }}" \
            --arg nextAuthorityHold "${{ steps.direct.outputs.next_hold }}" \
            --arg auditSha256 "${{ steps.direct.outputs.audit_sha }}" \
            --argjson mismatchCount "${{ steps.direct.outputs.mismatch_count }}" \
            --argjson detachmentRequired "${{ steps.direct.outputs.detachment_required }}" \
            --argjson metadataAdapterRequired "${{ steps.direct.outputs.adapter_required }}" \
            --argjson staticPassed "${{ steps.direct.outputs.static_passed }}" \
            --argjson staticTotal "${{ steps.direct.outputs.static_total }}" \
            --argjson syntheticPassed "${{ steps.direct.outputs.synthetic_passed }}" \
            --argjson syntheticTotal "${{ steps.direct.outputs.synthetic_total }}" \
            '{schema:"axm-asoiaf-agot-commit-receipt-reference-updater-compatibility-auditor-admission/1",componentId:$componentId,qualifiedCandidateCommit:$qualifiedCandidateCommit,upstreamReceiptCommit:$upstreamReceiptCommit,candidateCommit:$candidateCommit,pullRequest:$pullRequest,ordinaryQualificationRun:$ordinaryRun,mergeCommit:$mergeCommit,mergeTree:$mergeTree,outcome:$outcome,nextAuthorityHold:$nextAuthorityHold,auditSha256:$auditSha256,mismatchCount:$mismatchCount,worktreeDetachmentRequired:$detachmentRequired,metadataAdapterRequired:$metadataAdapterRequired,qualification:{static:{passed:$staticPassed,total:$staticTotal},synthetic:{passed:$syntheticPassed,total:$syntheticTotal},warningsAsErrors:true,currentAudit:true,targetedRepositoryReplay:true,completeRepositoryReplay:true,mergedMainReplay:true},counts:{realCommitReceiptsConsumed:0,realCompatibilityAuditsExecuted:0,realWorktreeDetachmentsExecuted:0,realReferenceUpdaterAdaptersMaterialized:0,realReferenceUpdateDryRunsExecuted:0,realHeadPseudorefsModified:0,realBranchReferencesUpdated:0,realWorktreeMutations:0,realLiveIndexMutations:0,realRemotePushes:0,realPullRequestsOpened:0,automaticCanonPromotions:0,automaticGraphMutations:0},status:"PASS_REPOSITORY_SOURCE_ADMITTED_CURRENT_COMPATIBILITY_AND_TOPOLOGY_CLASSIFIED_AND_MERGED_MAIN_REPLAYED"}' > /tmp/admission/ADMISSION_RECEIPT.json

      - uses: actions/upload-artifact@v4
        with:
          name: asoiaf-agot-commit-receipt-reference-updater-compatibility-auditor-admission-v1
          path: /tmp/admission
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
