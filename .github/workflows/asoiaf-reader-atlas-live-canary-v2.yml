name: Verify live ASOIAF reader atlas v2

on:
  workflow_run:
    workflows: ["Deploy ASOIAF reader atlas v2"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: axm-canon-asoiaf-reader-atlas-live-canary-v2
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Verify rendered endpoint and deployed boundary
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/asoiaf-reader-atlas-live-v2"
          mkdir -p "$root"
          site='https://bigbirdreturns.github.io/axm-canon/'
          matched=false

          for attempt in $(seq 1 20); do
            code="$(curl --location --silent --show-error --output "$root/index.html" --write-out '%{http_code}' --max-time 25 -H 'Cache-Control: no-cache' "$site" || true)"
            if test "$code" = '200' && grep -Fq 'The Narrow Wall' "$root/index.html" && grep -Fq 'Build a bounded research question' "$root/index.html"; then
              matched=true
              break
            fi
            sleep 15
          done
          test "$matched" = true

          for asset in data/atlas.json styles.css app.js data/programme-state.md data/continuation-custody.md; do
            curl --location --fail --silent --show-error --max-time 25 -H 'Cache-Control: no-cache' "$site$asset" -o "$root/$(basename "$asset")"
          done

          jq -e '
            .version == "1.0.0" and
            .boundary.sourceTextPresent == false and
            .boundary.holderControlledPayloadPresent == false and
            .boundary.automaticCanonEffect == "none" and
            .boundary.automaticGraphEffect == "none" and
            (.sourceLanes | length) == 7 and
            (.twowChapters | length) == 11 and
            .custody.privateArchiveHold.materialized == false and
            .custody.privateArchiveHold.v4_2Built == false and
            .custody.publicWave.sha256 == "0e999b7f8c921e7e81d439fc4c2fc1fd004a2b4a2adb375f0df3b99aefe92ab9" and
            .custody.publicWave.repositoryMaterialized == false
          ' "$root/atlas.json" >/dev/null

          printf '%s\n' \
            'format=axm-asoiaf-reader-atlas-live-receipt/2' \
            "verifiedAt=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            "site=$site" \
            'renderedTitle=The Narrow Wall' \
            'sourceTextPresent=false' \
            'holderControlledPayloadPresent=false' \
            'automaticCanonEffect=none' \
            'automaticGraphEffect=none' \
            'sourceLaneCount=7' \
            'releasedFutureWitnessCount=11' \
            'continuationPayloadMaterialized=false' \
            > "$root/receipt.txt"
          find "$root" -type f ! -name LIVE.SHA256SUMS -print0 | sort -z | xargs -0 sha256sum | sed "s#  $root/#  #" > "$root/LIVE.SHA256SUMS"

      - uses: actions/upload-artifact@v4
        with:
          name: asoiaf-reader-atlas-live-receipt-v2
          path: ${{ runner.temp }}/asoiaf-reader-atlas-live-v2
          if-no-files-found: error
          retention-days: 30
