name: Reconcile admitted AGOT worktree diff-review branches

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/reconcile-agot-named-human-worktree-diff-review-v2.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 566200a79ad132af9e2c31799863c3216e53872e
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify exact admitted main state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "566200a79ad132af9e2c31799863c3216e53872e"
          test "$(git rev-parse HEAD^{tree})" = "32cab6847ace9ed17b1791bf5f7257a0302b27de"
          test "$(git rev-parse HEAD^)" = "91bd4ec198d9c856fcf5bfb764468cd4cd4f4418"
          test -f asoiaf/public/review/agot-named-human-worktree-diff-review-recorder-v1/CONTRACT.json
          test -f asoiaf/tests/asoiaf-agot-named-human-worktree-diff-review-recorder-source.test.ts

      - name: Install repository dependencies
        run: npm ci --no-audit --no-fund

      - name: Replay exact component and downstream compatibility
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONSAFEPATH=1
          export PYTHONWARNINGS=error
          output="$RUNNER_TEMP/agot-diff-review-reconciliation"
          mkdir -p "$output"
          npm run typecheck | tee "$output/typecheck.log"
          npx vitest run asoiaf/tests/asoiaf-agot-named-human-worktree-diff-review-recorder-source.test.ts \
            | tee "$output/targeted-test.log"
          component="asoiaf/public/review/agot-named-human-worktree-diff-review-recorder-v1"
          python -W error -S "$component/verify.py" > "$output/verify.json"
          python -W error -S "$component/synthetic_campaign.py" > "$output/synthetic.json"
          python -W error - <<'PY'
          from __future__ import annotations
          import json
          import os
          from pathlib import Path

          output = Path(os.environ["RUNNER_TEMP"]) / "agot-diff-review-reconciliation"
          verify = json.loads((output / "verify.json").read_text(encoding="utf-8"))
          synthetic = json.loads((output / "synthetic.json").read_text(encoding="utf-8"))
          if verify.get("status") != "PASS" or (verify.get("passed"), verify.get("total")) != (158, 158):
              raise SystemExit("static qualification mismatch")
          if synthetic.get("status") != "PASS" or (synthetic.get("passed"), synthetic.get("total")) != (98, 98):
              raise SystemExit("synthetic qualification mismatch")
          PY

      - name: Delete exact construction branches under SHA leases
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/agot-diff-review-reconciliation"
          outcomes="$output/branch-outcomes.ndjson"
          : > "$outcomes"

          delete_exact() {
            branch="$1"
            expected="$2"
            actual="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq .object.sha 2>/dev/null || true)"
            if [ -z "$actual" ]; then
              printf '{"branch":"%s","expectedSha":"%s","observedSha":null,"outcome":"ALREADY_ABSENT"}\n' "$branch" "$expected" >> "$outcomes"
              return 0
            fi
            if [ "$actual" != "$expected" ]; then
              printf '{"branch":"%s","expectedSha":"%s","observedSha":"%s","outcome":"REFUSE_DIVERGENT_BRANCH"}\n' "$branch" "$expected" "$actual" >> "$outcomes"
              echo "Refusing divergent branch $branch: expected $expected, observed $actual" >&2
              return 1
            fi
            gh api --method DELETE "/repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
            remaining="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq .object.sha 2>/dev/null || true)"
            if [ -n "$remaining" ]; then
              echo "Branch remained after deletion: $branch" >&2
              return 1
            fi
            printf '{"branch":"%s","expectedSha":"%s","observedSha":"%s","outcome":"DELETED_EXACT_SHA"}\n' "$branch" "$expected" "$actual" >> "$outcomes"
          }

          delete_exact "agent/asoiaf-agot-named-human-worktree-diff-review-recorder-v1" "322e3a9efc404b909cc9e56670a1664033aad77a"
          delete_exact "ops/asoiaf-agot-named-human-worktree-diff-review-admission-v1" "b63202f23d743845de24bbc77655f20b7bddcf5c"
          delete_exact "ops/asoiaf-agot-named-human-worktree-diff-review-admission-v2" "4dd3f752fb5833aa3e94092ad5f71cec7bf72b18"
          delete_exact "ops/asoiaf-agot-named-human-worktree-diff-review-post-merge-replay-v1" "6583b2d927ecfb14229f36dba83cae28803c69e3"
          delete_exact "ops/asoiaf-agot-commit-object-sealer-source-export-v1" "73f9f887780d9490a6109ca8f934ad1875938c42"

      - name: Seal branch-reconciliation receipt
        shell: bash
        run: |
          set -euo pipefail
          python -W error - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import os
          from pathlib import Path

          output = Path(os.environ["RUNNER_TEMP"]) / "agot-diff-review-reconciliation"
          outcomes = [
              json.loads(line)
              for line in (output / "branch-outcomes.ndjson").read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          if len(outcomes) != 5:
              raise SystemExit("branch outcome census mismatch")
          if any(row["outcome"] not in {"DELETED_EXACT_SHA", "ALREADY_ABSENT"} for row in outcomes):
              raise SystemExit("branch reconciliation did not pass")
          receipt = {
              "schema": "axm-asoiaf-agot-named-human-worktree-diff-review-branch-reconciliation/1",
              "componentId": "asoiaf-agot-named-human-worktree-diff-review-recorder-v1",
              "admissionCommit": "566200a79ad132af9e2c31799863c3216e53872e",
              "admissionTree": "32cab6847ace9ed17b1791bf5f7257a0302b27de",
              "qualificationRun": 32776202506,
              "postMergeReplayRun": 32776486973,
              "postMergeReplayArtifactId": 9538156788,
              "postMergeReplayArtifactDigest": "sha256:cb7c361354070a6f9664b602fb14e2d36eb677f31bb77975a0b1ddfdd85cf9d1",
              "staticQualification": {"passed": 158, "total": 158},
              "syntheticCampaign": {"passed": 98, "total": 98},
              "exactCompatibilityCampaign": {"passed": 31, "total": 31},
              "branches": outcomes,
              "cleanupPullRequest": int(os.environ["PR_NUMBER"]),
              "cleanupBranch": os.environ["SELF_BRANCH"],
              "cleanupBranchExpectedSha": os.environ["SELF_SHA"],
              "cleanupBranchDeletion": "PENDING_FINAL_EXACT_SHA_STEP",
              "realHumanDiffReviewsConsumed": 0,
              "realCommitObjectsCreated": 0,
              "automaticCanonPromotions": 0,
              "automaticGraphMutations": 0,
              "privateSourceTextPresent": False,
              "privatePayloadPresent": False,
              "status": "PASS_CONSTRUCTION_BRANCHES_RECONCILED_SELF_CLEANUP_PENDING",
          }
          payload = json.dumps(receipt, indent=2, sort_keys=True) + "\n"
          (output / "BRANCH_RECONCILIATION_RECEIPT.json").write_text(payload, encoding="utf-8")
          (output / "BRANCH_RECONCILIATION_RECEIPT.SHA256").write_text(
              hashlib.sha256(payload.encode("utf-8")).hexdigest() + "  BRANCH_RECONCILIATION_RECEIPT.json\n",
              encoding="utf-8",
          )
          print(payload)
          PY
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SELF_BRANCH: ${{ github.event.pull_request.head.ref }}
          SELF_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Upload reconciliation evidence
        uses: actions/upload-artifact@v4
        with:
          name: asoiaf-agot-named-human-worktree-diff-review-branch-reconciliation-v2
          path: ${{ runner.temp }}/agot-diff-review-reconciliation
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Close cleanup PR and delete exact cleanup branch
        shell: bash
        run: |
          set -euo pipefail
          pr="${{ github.event.pull_request.number }}"
          branch="${{ github.event.pull_request.head.ref }}"
          expected="${{ github.event.pull_request.head.sha }}"
          actual="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq .object.sha)"
          test "$actual" = "$expected"
          gh pr close "$pr" --repo "$GITHUB_REPOSITORY" --comment "Exact merged-main replay passed and all recorded construction branches were reconciled under SHA leases. This cleanup workflow remains unmerged."
          gh api --method DELETE "/repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
