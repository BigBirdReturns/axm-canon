name: ASOIAF public corpus recovery bridge

on:
  push:
    branches:
      - recovery/asoiaf-public-corpus-v1

permissions:
  contents: write

concurrency:
  group: axm-canon-asoiaf-public-corpus-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      RECOVERY_FILE_ID: 191uvDW9JXUrUAlaiCsjhhO4mOY-hv7Fw
      RECOVERY_ARCHIVE_SHA256: a2466f9f701cccc6a04dbccf33af8f7984c1c1a7bf577502076cbbf52ad93da8
      RECOVERY_ARCHIVE_BYTES: '603356'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/asoiaf-public-corpus-v1
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Recover the checksum-bound public-safe overlay
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/asoiaf-public-corpus-v1-direct-overlay.tar.xz"
          candidate="$archive.candidate"
          rm -f "$archive" "$candidate"
          urls=(
            "https://drive.usercontent.google.com/download?id=${RECOVERY_FILE_ID}&export=download&confirm=t"
            "https://drive.google.com/uc?export=download&id=${RECOVERY_FILE_ID}"
          )
          for url in "${urls[@]}"; do
            rm -f "$candidate"
            if ! curl --fail --location --silent --show-error --retry 4 --retry-all-errors --connect-timeout 20 --max-time 240 "$url" --output "$candidate"; then
              continue
            fi
            if [ "$(stat -c '%s' "$candidate")" != "$RECOVERY_ARCHIVE_BYTES" ]; then
              continue
            fi
            if printf '%s  %s\n' "$RECOVERY_ARCHIVE_SHA256" "$candidate" | sha256sum --check --status; then
              mv "$candidate" "$archive"
              break
            fi
          done
          test -f "$archive"
          printf '%s  %s\n' "$RECOVERY_ARCHIVE_SHA256" "$archive" | sha256sum --check
          python - "$archive" <<'PY'
          import sys
          import tarfile
          from pathlib import PurePosixPath

          archive = sys.argv[1]
          required = {
              "README.md",
              "package.json",
              ".github/workflows/asoiaf.yml",
              "asoiaf/public/corpus-v1/PUBLIC_CORPUS_MANIFEST.json",
              "asoiaf/reader/index.html",
              "asoiaf/recovery/V4_1_ARCHIVE_IDENTITY.json",
          }
          observed = set()
          with tarfile.open(archive, "r:xz") as handle:
              for member in handle.getmembers():
                  normalized = member.name.removeprefix("./")
                  path = PurePosixPath(normalized)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"unsafe archive path: {member.name}")
                  if not (member.isfile() or member.isdir()):
                      raise SystemExit(f"unsupported archive member: {member.name}")
                  if normalized:
                      observed.add(normalized)
          missing = sorted(required - observed)
          if missing:
              raise SystemExit(f"required overlay entries missing: {missing}")
          print(f"archive preflight PASS: {len(observed)} entries")
          PY
          tar -xJf "$archive" -C .
          rm -f .github/workflows/asoiaf-public-corpus-recovery.yml
      - name: Record direct admission without transport residue
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          receipt = {
              "format": "axm-asoiaf-public-corpus-branch-admission/1",
              "status": "PASS_PENDING_QUALIFICATION",
              "admittedAt": datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "repository": os.environ["GITHUB_REPOSITORY"],
              "branch": os.environ["GITHUB_REF_NAME"],
              "bootstrapCommit": os.environ["GITHUB_SHA"],
              "workflowRunId": os.environ["GITHUB_RUN_ID"],
              "archive": {
                  "bytes": int(os.environ["RECOVERY_ARCHIVE_BYTES"]),
                  "sha256": os.environ["RECOVERY_ARCHIVE_SHA256"],
                  "committed": False
              },
              "boundary": {
                  "privateBookPayloadIncluded": False,
                  "publicSourceTextIncluded": False,
                  "transportFragmentsCommitted": False,
                  "canonEffect": "none",
                  "graphEffect": "none"
              }
          }
          target = Path("asoiaf/recovery/PUBLIC_CORPUS_V1_BRANCH_ADMISSION.json")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
      - name: Qualify the recovered repository state
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/recovery-qualification"
          mkdir -p "$receipt"
          npm ci --no-audit --no-fund
          npm run typecheck | tee "$receipt/typecheck.log"
          npm test | tee "$receipt/tests.log"
          npm run test:python | tee "$receipt/python-tests.log"
          npm run validate:public-corpus | tee "$receipt/public-corpus-verification.json"
          npm run verify:v4.1-identity | tee "$receipt/v4.1-identity.json"
          npm run build | tee "$receipt/build.log"
          npm run smoke:asoiaf | tee "$receipt/estate-smoke.json"
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("asoiaf/recovery/PUBLIC_CORPUS_V1_BRANCH_ADMISSION.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          data["status"] = "PASS"
          data["qualification"] = {
              "typescript": "PASS",
              "vitest": "PASS",
              "pythonOperatorTests": "PASS",
              "publicCorpusValidator": "PASS",
              "v4_1IdentityGate": "PASS_HOLD_PRESERVED",
              "build": "PASS",
              "estateSmoke": "PASS"
          }
          path.write_text(json.dumps(data, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          rm -rf dist
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -name '*.pyc' -delete
          git diff --check
      - name: Commit the direct public corpus and remove the bridge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Recover ASOIAF public corpus and preserve v4.1 custody gate"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git rev-parse HEAD > "$RUNNER_TEMP/recovery-qualification/admitted-commit.txt"
          printf '%s\n' \
            'privateBookPayloadIncluded=false' \
            'publicSourceTextIncluded=false' \
            'transportFragmentsCommitted=false' \
            'candidatePromotionCount=0' \
            'v4.1CustodyHold=preserved' \
            'v4.2IntegratedEstateClaimed=false' \
            > "$RUNNER_TEMP/recovery-qualification/boundary.txt"
          find "$RUNNER_TEMP/recovery-qualification" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum | sed "s#  $RUNNER_TEMP/recovery-qualification/#  #" > "$RUNNER_TEMP/recovery-qualification/SHA256SUMS"
      - uses: actions/upload-artifact@v4
        with:
          name: axm-canon-asoiaf-public-corpus-recovery
          path: ${{ runner.temp }}/recovery-qualification
          if-no-files-found: error
          retention-days: 30
