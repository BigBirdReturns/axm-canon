name: Admit exact AGOT named-human disposition recorder

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/admit-agot-named-human-disposition-recorder-v1.yml

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write
  statuses: write

jobs:
  qualify-and-admit:
    if: github.event.pull_request.head.ref == 'ops/asoiaf-agot-named-human-disposition-recorder-admission-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPONENT_BRANCH: agent/asoiaf-agot-named-human-disposition-recorder-source-final-admission-v1
      COMPONENT_PATH: asoiaf/public/review/agot-named-human-disposition-recorder-v1
      STANDARD_WORKFLOW: ASOIAF canon estate qualification
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve exact component pull request head
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$COMPONENT_BRANCH" --base main --state open --json number --jq '.[0].number')"
          test -n "$pr_number"
          pr_head="$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')"
          test -n "$pr_head"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "pr_head=$pr_head" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.pr_head }}
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prove checkout and compare surface
        shell: bash
        run: |
          set -euo pipefail
          observed="$(git rev-parse HEAD)"
          test "$observed" = "${{ steps.resolve.outputs.pr_head }}"
          git diff --name-only origin/main...HEAD | tee "$RUNNER_TEMP/changed-paths.txt"
          test "$(wc -l < "$RUNNER_TEMP/changed-paths.txt")" -eq 10
          test "$(grep -c '^asoiaf/public/review/agot-named-human-disposition-recorder-v1/' "$RUNNER_TEMP/changed-paths.txt")" -eq 9
          test "$(grep -c '^asoiaf/tests/asoiaf-agot-named-human-disposition-recorder-source.test.ts$' "$RUNNER_TEMP/changed-paths.txt")" -eq 1

      - name: Install repository dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund

      - name: Strict TypeScript
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck | tee "$RUNNER_TEMP/typecheck.log"

      - name: Complete repository test suite
        shell: bash
        run: |
          set -euo pipefail
          npm test | tee "$RUNNER_TEMP/tests.log"

      - name: Targeted warnings-as-errors replay
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONSAFEPATH=1
          python -W error -S "$COMPONENT_PATH/verify.py" | tee "$RUNNER_TEMP/recorder-verify.json"
          python -W error -S "$COMPONENT_PATH/synthetic_campaign.py" | tee "$RUNNER_TEMP/recorder-synthetic.json"
          python - <<'PY'
          import json
          from pathlib import Path
          import os
          root = Path(os.environ['RUNNER_TEMP'])
          verify = json.loads((root / 'recorder-verify.json').read_text())
          synthetic = json.loads((root / 'recorder-synthetic.json').read_text())
          assert verify['status'] == 'PASS'
          assert (verify['passed'], verify['total']) == (52, 52)
          assert synthetic['status'] == 'PASS'
          assert (synthetic['passed'], synthetic['total']) == (20, 20)
          assert verify['realNamedHumanDispositionsConsumed'] == 0
          assert verify['realLocalFeatureMaterializationRequests'] == 0
          assert synthetic['privateSourceTextUsed'] is False
          assert synthetic['automaticCanonPromotions'] == 0
          assert synthetic['automaticGraphMutations'] == 0
          PY
          git diff --exit-code

      - name: Require ordinary ASOIAF qualification for exact head
        id: standard
        shell: bash
        run: |
          set -euo pipefail
          head_sha="${{ steps.resolve.outputs.pr_head }}"
          run_id=""
          conclusion=""
          for attempt in $(seq 1 120); do
            response="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$head_sha&event=pull_request&per_page=100")"
            run_id="$(jq -r --arg name "$STANDARD_WORKFLOW" '.workflow_runs | map(select(.name == $name)) | sort_by(.created_at) | reverse | .[0].id // empty' <<<"$response")"
            if test -n "$run_id"; then
              status="$(jq -r --argjson id "$run_id" '.workflow_runs[] | select(.id == $id) | .status' <<<"$response")"
              conclusion="$(jq -r --argjson id "$run_id" '.workflow_runs[] | select(.id == $id) | .conclusion // empty' <<<"$response")"
              if test "$status" = completed; then
                break
              fi
            fi
            sleep 10
          done
          test -n "$run_id"
          test "$conclusion" = success
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Stamp and squash-admit only the observed head
        id: admit
        shell: bash
        run: |
          set -euo pipefail
          pr_number="${{ steps.resolve.outputs.pr_number }}"
          head_sha="${{ steps.resolve.outputs.pr_head }}"
          current_head="$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')"
          test "$current_head" = "$head_sha"
          target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$head_sha" \
            -f state=success \
            -f context='ASOIAF independent exact-head recorder replay' \
            -f description='52 static, 20 synthetic, full repository suite passed' \
            -f target_url="$target_url" >/dev/null
          gh pr ready "$pr_number" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || true
          gh pr merge "$pr_number" --repo "$GITHUB_REPOSITORY" \
            --squash \
            --match-head-commit "$head_sha" \
            --subject "Admit AGOT named-human disposition recorder source (#$pr_number)" \
            --body "Admit the repository-native public-safe recorder after the ordinary ASOIAF qualification and an independent exact-head replay. Preserve zero real private paragraphs, validated intakes, named-human dispositions, proposition admissions, materialization requests, canon effects, and graph effects."
          merge_sha="$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json mergeCommit --jq '.mergeCommit.oid')"
          test -n "$merge_sha"
          echo "merge_sha=$merge_sha" >> "$GITHUB_OUTPUT"

      - name: Retain admission receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          receipt = {
              'schema': 'axm-asoiaf-agot-named-human-disposition-recorder-repository-admission/1',
              'componentId': 'asoiaf-agot-named-human-disposition-recorder-v1',
              'componentPullRequest': int(os.environ['COMPONENT_PR']),
              'qualifiedHeadSha': os.environ['COMPONENT_HEAD'],
              'ordinaryQualificationRunId': int(os.environ['STANDARD_RUN']),
              'independentAdmissionRunId': int(os.environ['GITHUB_RUN_ID']),
              'mergeCommitSha': os.environ['MERGE_SHA'],
              'staticQualification': {'passed': 52, 'total': 52},
              'syntheticCampaign': {'passed': 20, 'total': 20},
              'fullRepositorySuite': 'PASS',
              'exactHeadGuard': True,
              'mergeMethod': 'squash',
              'realPrivateParagraphsConsumed': 0,
              'realValidatedIntakesConsumed': 0,
              'realNamedHumanDispositionsConsumed': 0,
              'realPropositionAdmissions': 0,
              'realLocalFeatureMaterializationRequests': 0,
              'automaticCanonPromotions': 0,
              'automaticGraphMutations': 0,
              'status': 'PASS_REPOSITORY_SOURCE_ADMITTED_REAL_DISPOSITION_WITHHELD',
          }
          out = Path(os.environ['RUNNER_TEMP']) / 'RECORDER_REPOSITORY_ADMISSION.json'
          out.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          print(out.read_text())
          PY
        env:
          COMPONENT_PR: ${{ steps.resolve.outputs.pr_number }}
          COMPONENT_HEAD: ${{ steps.resolve.outputs.pr_head }}
          STANDARD_RUN: ${{ steps.standard.outputs.run_id }}
          MERGE_SHA: ${{ steps.admit.outputs.merge_sha }}

      - uses: actions/upload-artifact@v4
        with:
          name: agot-named-human-disposition-recorder-repository-admission
          path: |
            ${{ runner.temp }}/RECORDER_REPOSITORY_ADMISSION.json
            ${{ runner.temp }}/changed-paths.txt
            ${{ runner.temp }}/recorder-verify.json
            ${{ runner.temp }}/recorder-synthetic.json
            ${{ runner.temp }}/typecheck.log
            ${{ runner.temp }}/tests.log
          if-no-files-found: error
          retention-days: 7

      - name: Close the transport-only operations pull request unmerged
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          gh pr close "${{ github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY" \
            --comment "Transport-only admission runner completed. The recorder component was independently qualified and exact-head squash-merged. This operations pull request remains unmerged and carries no repository authority." >/dev/null
