name: Replay exact merged AGOT local-postimage patch-bundle sealer

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/replay-agot-local-postimage-patch-bundle-sealer-main-v1.yml

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      MERGED_MAIN: 91bd4ec198d9c856fcf5bfb764468cd4cd4f4418
      MERGED_TREE: 51f897f9d6e5b1f26b0a86b826cb700d9897fc04
      MERGED_PARENT: ca74f4a51a18a754f21bfdbab8ca2782d3c5665b
      COMPONENT_ID: asoiaf-agot-local-postimage-patch-bundle-sealer-v1
      COMPONENT_DIR: agot-local-postimage-patch-bundle-sealer-v1
      PACKAGE_SHA256: 3c9cfc5ebd9576f898d1f5442e25919c3577511bc67361c67f043eb413eb4e12
      CARRIER_SHA256: dd457edb4c8e9ee30aefd0c4478eb244d337c19dfc1642fc15e81072001fd232
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 91bd4ec198d9c856fcf5bfb764468cd4cd4f4418
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify exact commit, tree, parent, and squash surface
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MERGED_MAIN"
          test "$(git rev-parse HEAD^{tree})" = "$MERGED_TREE"
          test "$(git rev-parse HEAD^)" = "$MERGED_PARENT"
          mapfile -t observed < <(git diff-tree --no-commit-id --name-only -r "$MERGED_PARENT" "$MERGED_MAIN" | LC_ALL=C sort)
          mapfile -t expected < <(printf '%s\n' \
            asoiaf/public/review/agot-local-postimage-patch-bundle-sealer-v1/ADMISSION.json \
            asoiaf/public/review/agot-local-postimage-patch-bundle-sealer-v1/CARRIER.SHA256SUMS \
            asoiaf/public/review/agot-local-postimage-patch-bundle-sealer-v1/CARRIER.json \
            asoiaf/public/review/agot-local-postimage-patch-bundle-sealer-v1/README.md \
            asoiaf/public/review/agot-local-postimage-patch-bundle-sealer-v1/carrier/part-0001.b64 \
            asoiaf/public/review/agot-local-postimage-patch-bundle-sealer-v1/carrier/part-0002.b64 \
            asoiaf/public/review/agot-local-postimage-patch-bundle-sealer-v1/carrier/part-0003.b64 \
            asoiaf/public/review/agot-local-postimage-patch-bundle-sealer-v1/carrier/part-0004.b64 \
            asoiaf/public/review/agot-local-postimage-patch-bundle-sealer-v1/carrier/part-0005.b64 \
            asoiaf/public/review/agot-local-postimage-patch-bundle-sealer-v1/carrier/part-0006.b64 \
            asoiaf/public/review/agot-local-postimage-patch-bundle-sealer-v1/carrier/part-0007.b64 \
            asoiaf/public/review/agot-local-postimage-patch-bundle-sealer-v1/carrier/part-0008.b64 \
            asoiaf/public/review/agot-local-postimage-patch-bundle-sealer-v1/carrier/part-0009.b64 \
            asoiaf/public/review/agot-local-postimage-patch-bundle-sealer-v1/carrier/part-0010.b64 \
            asoiaf/tests/asoiaf-agot-local-postimage-patch-bundle-sealer-source.test.ts | LC_ALL=C sort)
          test "${#observed[@]}" -eq 15
          test "$(printf '%s\n' "${observed[@]}")" = "$(printf '%s\n' "${expected[@]}")"

      - name: Reconstruct exact package and replay component directly
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONSAFEPATH=1
          export PYTHONWARNINGS=error
          python -W error - <<'PY'
          from __future__ import annotations
          import base64, hashlib, json, os, subprocess, tarfile
          from pathlib import Path, PurePosixPath

          root = Path("asoiaf/public/review/agot-local-postimage-patch-bundle-sealer-v1")
          carrier = json.loads((root / "CARRIER.json").read_text(encoding="utf-8"))
          assert carrier["componentId"] == os.environ["COMPONENT_ID"]
          assert carrier["encoding"] == "RFC4648-base64-no-whitespace"
          assert carrier["chunkCount"] == 10
          assert [entry["path"] for entry in carrier["chunks"]] == carrier["concatenationOrder"]
          pieces = []
          for entry in carrier["chunks"]:
              path = root / entry["path"]
              data = path.read_bytes()
              assert len(data) == entry["characters"]
              assert not any(chr(value).isspace() for value in data)
              assert hashlib.sha256(data).hexdigest() == entry["sha256"]
              blob = subprocess.run(["git", "hash-object", "--", str(path)], check=True, capture_output=True, text=True).stdout.strip()
              assert blob == entry["gitBlobSha1"]
              pieces.append(data)
          encoded = b"".join(pieces)
          assert len(encoded) == carrier["base64Characters"] == 38956
          assert hashlib.sha256(encoded).hexdigest() == os.environ["CARRIER_SHA256"]
          package = base64.b64decode(encoded, validate=True)
          assert len(package) == carrier["decodedObject"]["bytes"] == 29217
          assert hashlib.sha256(package).hexdigest() == os.environ["PACKAGE_SHA256"]

          output = Path(os.environ["RUNNER_TEMP"]) / "local-postimage-patch-bundle-sealer-replay"
          output.mkdir(parents=True, exist_ok=False)
          archive_path = output / carrier["decodedObject"]["filename"]
          archive_path.write_bytes(package)
          extract_root = output / "extracted"
          extract_root.mkdir()
          with tarfile.open(archive_path, "r:gz") as archive:
              files = []
              for member in archive.getmembers():
                  pure = PurePosixPath(member.name)
                  assert not pure.is_absolute()
                  assert ".." not in pure.parts
                  assert "\\" not in member.name
                  assert not (member.issym() or member.islnk() or member.isdev() or member.isfifo())
                  if member.isfile():
                      files.append(member.name)
              assert files == carrier["expandedPaths"]
              archive.extractall(extract_root, filter="data")

          component = extract_root / "asoiaf" / "public" / "review" / os.environ["COMPONENT_DIR"]
          results = []
          for script, expected in (("verify.py", 199), ("synthetic_campaign.py", 62)):
              completed = subprocess.run(
                  ["python", "-W", "error", "-S", str(component / script)],
                  cwd=component,
                  env={**os.environ, "PYTHONSAFEPATH": "1", "PYTHONWARNINGS": "error"},
                  check=True,
                  capture_output=True,
                  text=True,
              )
              parsed = json.loads(completed.stdout)
              assert parsed["status"] == "PASS"
              assert parsed["passed"] == expected == parsed["total"]
              results.append({"script": script, "passed": expected, "total": expected})
              (output / f"{script}.stdout.json").write_text(completed.stdout, encoding="utf-8")
              (output / f"{script}.stderr.txt").write_text(completed.stderr, encoding="utf-8")

          receipt = {
              "schema": "axm-asoiaf-agot-local-postimage-patch-bundle-sealer-post-merge-replay/1",
              "componentId": os.environ["COMPONENT_ID"],
              "mergedMainCommit": os.environ["MERGED_MAIN"],
              "mergedMainTree": os.environ["MERGED_TREE"],
              "parentCommit": os.environ["MERGED_PARENT"],
              "changedPathCount": 15,
              "base64Characters": len(encoded),
              "base64Sha256": hashlib.sha256(encoded).hexdigest(),
              "packageBytes": len(package),
              "packageSha256": hashlib.sha256(package).hexdigest(),
              "qualification": results,
              "worktreeExecutorCompatibilityReplayRequired": True,
              "realMaterializationRequestsConsumed": 0,
              "realMaterializationReceiptsConsumed": 0,
              "realPatchBundlesSealed": 0,
              "bundleFilesWrittenByRuntime": 0,
              "repositoryFilesWrittenByRuntime": 0,
              "worktreesModifiedByRuntime": 0,
              "liveIndexesModifiedByRuntime": 0,
              "commitsCreatedByRuntime": 0,
              "referencesUpdatedByRuntime": 0,
              "remotePushesByRuntime": 0,
              "pullRequestsOpenedByRuntime": 0,
              "automaticCanonPromotions": 0,
              "automaticGraphMutations": 0,
              "privateSourceTextPresent": False,
              "privatePayloadPresent": False,
              "status": "PASS_MERGED_MAIN_PATCH_BUNDLE_SEALER_RECONSTRUCTED_AND_QUALIFIED",
          }
          (output / "POST_MERGE_REPLAY_RECEIPT.json").write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Install repository dependencies
        run: npm ci --no-audit --no-fund

      - name: Strict TypeScript from exact merged main
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck | tee "$RUNNER_TEMP/post-merge-typecheck.log"

      - name: Targeted repository interoperability replay
        shell: bash
        run: |
          set -euo pipefail
          npx vitest run asoiaf/tests/asoiaf-agot-local-postimage-patch-bundle-sealer-source.test.ts | tee "$RUNNER_TEMP/post-merge-targeted.log"

      - name: Complete repository replay from exact merged main
        shell: bash
        run: |
          set -euo pipefail
          npm test | tee "$RUNNER_TEMP/post-merge-complete.log"

      - name: Retain replay transcripts
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/post-merge-typecheck.log" "$RUNNER_TEMP/local-postimage-patch-bundle-sealer-replay/"
          cp "$RUNNER_TEMP/post-merge-targeted.log" "$RUNNER_TEMP/local-postimage-patch-bundle-sealer-replay/"
          cp "$RUNNER_TEMP/post-merge-complete.log" "$RUNNER_TEMP/local-postimage-patch-bundle-sealer-replay/"

      - uses: actions/upload-artifact@v4
        with:
          name: asoiaf-agot-local-postimage-patch-bundle-sealer-post-merge-replay-v1
          path: ${{ runner.temp }}/local-postimage-patch-bundle-sealer-replay
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
