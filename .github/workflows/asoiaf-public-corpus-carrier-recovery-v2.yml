name: Recover and import exact ASOIAF public corpus carrier

on:
  push:
    branches:
      - "asoiaf/public-corpus-v1-carrier"
    paths:
      - "carrier/RECOVER_V2"

permissions:
  contents: write

concurrency:
  group: axm-canon-asoiaf-public-corpus-carrier-recovery-v2
  cancel-in-progress: false

jobs:
  recover-import:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install exact transport dependency
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v zstd >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends zstd
          fi
          zstd --version

      - name: Recover authenticated carrier from reachable history and known blobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -f carrier/RECOVER_V2
          export RECOVERY_ROOT="$RUNNER_TEMP/carrier-recovery"
          mkdir -p "$RECOVERY_ROOT"
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import io
          import itertools
          import json
          import os
          import pathlib
          import re
          import subprocess
          import urllib.request
          import zipfile

          EXPECTED_B64_BYTES = 826356
          EXPECTED_B64_SHA = 'd4151d244b0541be1dbb1a1ef5a5ed7c4c808ba11d0ad494450acc58b11e6eaa'
          EXPECTED_ZST_BYTES = 619766
          EXPECTED_ZST_SHA = 'a545ed4384238f329f6fa6e6be2dd25150ac3377837defd3e06d26eabdea2476'
          EXPECTED_TAR_BYTES = 8017920
          EXPECTED_TAR_SHA = '9b66aff01f12ae3e6f018fd1c5ccd1d9b1fd96810da4343b3d11e3f69bfaab84'
          KNOWN_SERVER_BLOBS = [
              'e1da7c586ead1161924ad58155b72096091eec92',
              '6617eb350712506bd2fdf3db6174af473338cf24',
          ]

          root = pathlib.Path(os.environ['RECOVERY_ROOT'])
          candidates: list[tuple[str, bytes]] = []
          diagnostics: list[dict[str, object]] = []

          def sha256(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()

          def add_candidate(label: str, data: bytes) -> None:
              if not data:
                  return
              digest = sha256(data)
              if any(existing_digest == digest for existing_digest in seen):
                  return
              seen.add(digest)
              candidates.append((label, data))
              diagnostics.append({'label': label, 'bytes': len(data), 'sha256': digest})

          seen: set[str] = set()

          carrier = pathlib.Path('carrier')
          if carrier.is_dir():
              for path in sorted(carrier.rglob('*')):
                  if path.is_file() and path.name not in {'RECOVER_V2', 'READY'}:
                      add_candidate(f'working-tree:{path.as_posix()}', path.read_bytes())

          objects = subprocess.check_output(
              ['git', 'rev-list', '--objects', '--all'], text=True
          ).splitlines()
          for row in objects:
              if ' ' not in row:
                  continue
              oid, name = row.split(' ', 1)
              if not name.startswith('carrier/'):
                  continue
              try:
                  kind = subprocess.check_output(['git', 'cat-file', '-t', oid], text=True).strip()
                  if kind != 'blob':
                      continue
                  size = int(subprocess.check_output(['git', 'cat-file', '-s', oid], text=True).strip())
                  if size > 2_000_000:
                      continue
                  data = subprocess.check_output(['git', 'cat-file', 'blob', oid])
              except subprocess.CalledProcessError:
                  continue
              add_candidate(f'history:{oid}:{name}', data)

          token = os.environ['GH_TOKEN']
          repository = os.environ['REPOSITORY']
          for oid in KNOWN_SERVER_BLOBS:
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repository}/git/blobs/{oid}',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'axm-canon-carrier-recovery-v2',
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      payload = json.load(response)
                  data = base64.b64decode(payload['content'])
                  add_candidate(f'known-server-blob:{oid}', data)
              except Exception as exc:
                  diagnostics.append({'label': f'known-server-blob:{oid}', 'error': repr(exc)})

          recovered: tuple[str, bytes, bytes] | None = None

          def accept(label: str, raw: bytes) -> bool:
              nonlocal recovered
              if len(raw) == EXPECTED_ZST_BYTES and sha256(raw) == EXPECTED_ZST_SHA:
                  recovered = (label + ':compressed', base64.b64encode(raw), raw)
                  return True
              canonical = b''.join(raw.split())
              if len(canonical) == EXPECTED_B64_BYTES and sha256(canonical) == EXPECTED_B64_SHA:
                  try:
                      compressed = base64.b64decode(canonical, validate=True)
                  except Exception:
                      return False
                  if len(compressed) == EXPECTED_ZST_BYTES and sha256(compressed) == EXPECTED_ZST_SHA:
                      recovered = (label + ':base64', canonical, compressed)
                      return True
              if raw.startswith(b'PK\x03\x04'):
                  try:
                      with zipfile.ZipFile(io.BytesIO(raw)) as archive:
                          for name in archive.namelist():
                              if name.endswith('/'):
                                  continue
                              if accept(label + f':zip:{name}', archive.read(name)):
                                  return True
                  except Exception:
                      return False
              return False

          for label, data in candidates:
              if accept(label, data):
                  break

          if recovered is None:
              named_chunks: dict[int, tuple[str, bytes]] = {}
              chunk_pattern = re.compile(r'(?:^|:)chunk-(\d{3})\.b64$')
              for label, data in candidates:
                  match = chunk_pattern.search(label)
                  if match:
                      named_chunks[int(match.group(1))] = (label, data)
              if sorted(named_chunks) == list(range(1, 14)):
                  joined = b''.join(named_chunks[index][1] for index in range(1, 14))
                  accept('reachable-named-chunks-001-through-013', joined)

          if recovered is None:
              plausible = [
                  (label, data)
                  for label, data in candidates
                  if len(data) <= EXPECTED_B64_BYTES
              ]
              for (label_a, data_a), (label_b, data_b) in itertools.permutations(plausible, 2):
                  total = len(data_a) + len(data_b)
                  if total not in range(EXPECTED_ZST_BYTES - 16, EXPECTED_B64_BYTES + 32):
                      continue
                  if accept(f'pair:{label_a}+{label_b}', data_a + data_b):
                      break

          if recovered is None:
              report = {
                  'format': 'axm-asoiaf-public-corpus-carrier-recovery-diagnostic/2',
                  'result': 'FAIL',
                  'candidateCount': len(candidates),
                  'expected': {
                      'base64Bytes': EXPECTED_B64_BYTES,
                      'base64Sha256': EXPECTED_B64_SHA,
                      'compressedBytes': EXPECTED_ZST_BYTES,
                      'compressedSha256': EXPECTED_ZST_SHA,
                  },
                  'candidates': diagnostics,
              }
              (root / 'diagnostic.json').write_text(json.dumps(report, indent=2) + '\n')
              raise SystemExit('exact carrier not recoverable from reachable history or known server blobs')

          label, canonical, compressed = recovered
          assert len(compressed) == EXPECTED_ZST_BYTES
          assert sha256(compressed) == EXPECTED_ZST_SHA
          (root / 'carrier.b64').write_bytes(canonical + b'\n')
          (root / 'carrier.tar.zst').write_bytes(compressed)
          report = {
              'format': 'axm-asoiaf-public-corpus-carrier-recovery-receipt/2',
              'result': 'PASS',
              'mechanism': label,
              'candidateCount': len(candidates),
              'canonicalBase64Bytes': len(canonical),
              'canonicalBase64Sha256': sha256(canonical),
              'compressedBytes': len(compressed),
              'compressedSha256': sha256(compressed),
              'knownServerBlobs': KNOWN_SERVER_BLOBS,
          }
          (root / 'recovery.json').write_text(json.dumps(report, indent=2) + '\n')
          PY
          zstd --decompress --stdout "$RECOVERY_ROOT/carrier.tar.zst" > "$RECOVERY_ROOT/carrier.tar"
          test "$(wc -c < "$RECOVERY_ROOT/carrier.tar")" = '8017920'
          printf '%s  %s\n' '9b66aff01f12ae3e6f018fd1c5ccd1d9b1fd96810da4343b3d11e3f69bfaab84' "$RECOVERY_ROOT/carrier.tar" | sha256sum -c -

      - name: Reject unsafe archive structure and extract exact files
        shell: bash
        run: |
          set -euo pipefail
          export CARRIER_TAR="$RECOVERY_ROOT/carrier.tar"
          export EXTRACTED="$RECOVERY_ROOT/extracted"
          mkdir -p "$EXTRACTED"
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import tarfile

          archive = pathlib.Path(os.environ['CARRIER_TAR'])
          extracted = pathlib.Path(os.environ['EXTRACTED'])
          inventory = []
          with tarfile.open(archive, 'r:') as handle:
              members = handle.getmembers()
              if len(members) != 32:
                  raise SystemExit(f'expected 32 members, observed {len(members)}')
              for member in members:
                  path = pathlib.PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'unsafe path: {member.name}')
                  if not member.isfile() or member.issym() or member.islnk():
                      raise SystemExit(f'non-regular member: {member.name}')
                  source = handle.extractfile(member)
                  if source is None:
                      raise SystemExit(f'unreadable member: {member.name}')
                  data = source.read()
                  target = extracted.joinpath(*path.parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
                  target.chmod(member.mode & 0o777)
                  inventory.append({
                      'path': member.name,
                      'bytes': len(data),
                      'sha256': hashlib.sha256(data).hexdigest(),
                      'mode': oct(member.mode & 0o777),
                  })
          inventory.sort(key=lambda row: row['path'])
          (pathlib.Path(os.environ['RECOVERY_ROOT']) / 'inventory.json').write_text(
              json.dumps(inventory, indent=2) + '\n', encoding='utf-8'
          )
          PY

      - name: Overlay exact carrier and qualify repository
        shell: bash
        run: |
          set -euo pipefail
          cp -a "$RECOVERY_ROOT/extracted/." .
          npm ci --no-audit --no-fund
          PYTHONWARNINGS=error npm run validate
          rm -rf dist
          git diff --check
          python - <<'PY'
          import json
          import pathlib
          import subprocess

          inventory = json.loads(pathlib.Path(__import__('os').environ['RECOVERY_ROOT'], 'inventory.json').read_text())
          expected = {row['path'] for row in inventory}
          tracked = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          untracked = subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], text=True).splitlines()
          observed = set(tracked + untracked)
          allowed_transport = {
              '.github/workflows/asoiaf-public-corpus-carrier-import.yml',
              '.github/workflows/asoiaf-public-corpus-carrier-recovery-v2.yml',
          }
          allowed_transport.update(
              path.as_posix() for path in pathlib.Path('carrier').rglob('*') if path.is_file()
          )
          unexpected = observed - expected - allowed_transport
          if unexpected:
              raise SystemExit(f'unexpected generated paths: {sorted(unexpected)}')
          recovery = json.loads(pathlib.Path(__import__('os').environ['RECOVERY_ROOT'], 'recovery.json').read_text())
          receipt = {
              'format': 'axm-asoiaf-public-corpus-carrier-import-receipt/2',
              'baseCommit': 'fec0ddc9a5697d465ac46e55b7e3cb7647221952',
              'carrierFileCount': 32,
              'sourceAttachment': 'axm-canon-asoiaf-corpus-v1-carrier.b64.txt',
              'sourceAttachmentSha256': 'sha256:d4151d244b0541be1dbb1a1ef5a5ed7c4c808ba11d0ad494450acc58b11e6eaa',
              'canonicalBase64Sha256': 'sha256:d4151d244b0541be1dbb1a1ef5a5ed7c4c808ba11d0ad494450acc58b11e6eaa',
              'compressedBytes': 619766,
              'compressedSha256': 'sha256:a545ed4384238f329f6fa6e6be2dd25150ac3377837defd3e06d26eabdea2476',
              'tarBytes': 8017920,
              'tarSha256': 'sha256:9b66aff01f12ae3e6f018fd1c5ccd1d9b1fd96810da4343b3d11e3f69bfaab84',
              'recoveryMechanism': recovery['mechanism'],
              'qualification': {
                  'npmValidate': 'pass',
                  'publicCorpusBoundary': 'pass',
                  'privateCorpusOperatorTests': 'pass',
                  'archiveInventory': 'pass',
                  'fileDigests': 'pass',
                  'unsafeArchiveRejection': 'pass',
              },
              'sourcePayloadPresent': False,
              'sourceTextPresent': False,
              'canonEffect': 'none',
              'graphEffect': 'none',
          }
          out = pathlib.Path('asoiaf/docs/ASOIAF_PUBLIC_CORPUS_V1_IMPORT_RECEIPT.json')
          out.write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Replace transport with qualified source commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf carrier
          rm -f .github/workflows/asoiaf-public-corpus-carrier-import.yml
          rm -f .github/workflows/asoiaf-public-corpus-carrier-recovery-v2.yml
          git add -A
          git diff --cached --check
          git config user.name 'BigBirdReturns'
          git config user.email '219768509+BigBirdReturns@users.noreply.github.com'
          git commit -m 'Publish six-edition ASOIAF public corpus v1'
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Retain recovery receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axm-canon-asoiaf-public-corpus-carrier-recovery-v2
          path: ${{ runner.temp }}/carrier-recovery
          if-no-files-found: warn
          retention-days: 30
