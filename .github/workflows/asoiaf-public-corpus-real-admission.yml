name: Admit the real ASOIAF public corpus

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/asoiaf-public-corpus-real-admission.yml"

permissions:
  contents: write

concurrency:
  group: axm-canon-real-public-corpus-admission
  cancel-in-progress: false

env:
  EXPECTED_BASE: d1ef462fbdeba306cfa8f30b6b72302f03a72261
  CARRIER_URL: "https://sdmntprwestus.oaiusercontent.com/files/00000000-1d88-8230-a2ba-6ca8458ea0f8/raw?se=2026-08-19T14%3A55%3A10Z&sp=r&sv=2026-02-06&sr=b&scid=0a7bd99d-e1e7-5f55-a595-25bb9407544d&skoid=89c13f8f-c33a-46d8-9bf3-ad7158c7790a&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-19T00%3A09%3A02Z&ske=2026-08-20T00%3A09%3A02Z&sks=b&skv=2026-02-06&sig=pKLht6eCVwsWSoCn%2Bz36gatu1dP7YzfodSeFQmsx3mU%3D"

jobs:
  admit:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Authenticate and extract the exact carrier
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_BASE"
          command -v zstd >/dev/null || { sudo apt-get update -qq; sudo apt-get install -y zstd; }
          raw="$RUNNER_TEMP/carrier-input.txt"
          canonical="$RUNNER_TEMP/carrier.b64"
          compressed="$RUNNER_TEMP/carrier.tar.zst"
          tarfile="$RUNNER_TEMP/carrier.tar"
          extracted="$RUNNER_TEMP/extracted"
          curl --fail --location --silent --show-error --retry 5 --retry-delay 2 "$CARRIER_URL" -o "$raw"
          tr -d '\r\n\t ' < "$raw" > "$canonical"
          test "$(wc -c < "$canonical")" = '826356'
          printf '%s  %s\n' 'd4151d244b0541be1dbb1a1ef5a5ed7c4c808ba11d0ad494450acc58b11e6eaa' "$canonical" | sha256sum -c -
          base64 --decode "$canonical" > "$compressed"
          test "$(wc -c < "$compressed")" = '619766'
          printf '%s  %s\n' 'a545ed4384238f329f6fa6e6be2dd25150ac3377837defd3e06d26eabdea2476' "$compressed" | sha256sum -c -
          zstd --decompress --stdout "$compressed" > "$tarfile"
          test "$(wc -c < "$tarfile")" = '8017920'
          printf '%s  %s\n' '9b66aff01f12ae3e6f018fd1c5ccd1d9b1fd96810da4343b3d11e3f69bfaab84' "$tarfile" | sha256sum -c -
          mkdir -p "$extracted"
          export CARRIER_TAR="$tarfile" EXTRACTED="$extracted"
          python - <<'PY'
          import os
          import pathlib
          import tarfile

          expected = sorted('''
          .github/workflows/asoiaf.yml
          .gitignore
          GARBAGE_LEDGER.md
          README.md
          asoiaf/README.md
          asoiaf/docs/ASOIAF_PRIVATE_CORPUS_SQLITE.md
          asoiaf/docs/ASOIAF_SIX_EDITION_CORPUS.md
          asoiaf/public/corpus-v1/CANDIDATE_EVIDENCE_ROUTING.ndjson
          asoiaf/public/corpus-v1/CANDIDATE_EVIDENCE_ROUTING_SUMMARY.json
          asoiaf/public/corpus-v1/CHAPTER_INDEX.ndjson
          asoiaf/public/corpus-v1/CORPUS_CENSUS.json
          asoiaf/public/corpus-v1/ENTITY_CONCORDANCE.json
          asoiaf/public/corpus-v1/ENTITY_CONCORDANCE_SUMMARY.json
          asoiaf/public/corpus-v1/NON_NARRATIVE_UNITS.ndjson
          asoiaf/public/corpus-v1/OPENING_GATE.json
          asoiaf/public/corpus-v1/POV_CENSUS.json
          asoiaf/public/corpus-v1/PUBLIC_CORPUS_MANIFEST.json
          asoiaf/public/corpus-v1/README.md
          asoiaf/public/corpus-v1/SHA256SUMS
          asoiaf/reader/READER_ATLAS_RECEIPT.json
          asoiaf/reader/README.md
          asoiaf/reader/index.html
          asoiaf/tests/test_asoiaf_private_corpus_sqlite.py
          asoiaf/tools/asoiaf_candidate_evidence_routes.py
          asoiaf/tools/asoiaf_entity_concordance.py
          asoiaf/tools/asoiaf_opening_gate.py
          asoiaf/tools/asoiaf_private_corpus_sqlite.py
          asoiaf/tools/asoiaf_public_corpus_projection.py
          asoiaf/tools/asoiaf_reader_atlas.py
          asoiaf/tools/validate_asoiaf_public_corpus.py
          package.json
          scripts/validate-estate.ts
          '''.split())
          archive = pathlib.Path(os.environ['CARRIER_TAR'])
          root = pathlib.Path(os.environ['EXTRACTED'])
          with tarfile.open(archive, 'r:') as handle:
              members = handle.getmembers()
              observed = []
              for member in members:
                  path = pathlib.PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'unsafe path: {member.name}')
                  if not member.isfile() or member.issym() or member.islnk():
                      raise SystemExit(f'non-regular archive member: {member.name}')
                  observed.append(member.name)
              if sorted(observed) != expected:
                  raise SystemExit(f'carrier inventory mismatch: {sorted(observed)}')
              for member in members:
                  target = root.joinpath(*pathlib.PurePosixPath(member.name).parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  source = handle.extractfile(member)
                  if source is None:
                      raise SystemExit(f'unreadable member: {member.name}')
                  target.write_bytes(source.read())
                  target.chmod(member.mode & 0o777)
          PY
          (cd "$extracted/asoiaf/public/corpus-v1" && sha256sum -c SHA256SUMS)
          cp -a "$extracted/." .

      - name: Retire transport residue and qualify the admitted tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf carrier .reader-atlas/DETERMINISM_READY
          rm -f \
            .github/workflows/asoiaf-branch-admission-controller.yml \
            .github/workflows/asoiaf-estate-steward-v1.yml \
            .github/workflows/asoiaf-public-corpus-carrier-final.yml \
            .github/workflows/asoiaf-public-corpus-carrier-import.yml \
            .github/workflows/asoiaf-public-corpus-carrier-recovery-v2.yml \
            .github/workflows/asoiaf-public-corpus-carrier-recovery-v3.yml \
            .github/workflows/asoiaf-public-corpus-carrier-recovery-v4.yml \
            .github/workflows/asoiaf-public-corpus-carrier-recovery-v5.yml \
            .github/workflows/asoiaf-public-corpus-carrier-replay.yml \
            .github/workflows/asoiaf-public-corpus-recovery-watch.yml \
            .github/workflows/asoiaf-reader-atlas-determinism-v0.1.1.yml \
            .github/workflows/asoiaf-reader-domain-atlas-admission-watch.yml \
            .github/workflows/asoiaf-public-corpus-real-admission.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          npm ci --no-audit --no-fund
          PYTHONWARNINGS=error npm run validate
          rm -rf dist
          test -f asoiaf/public/corpus-v1/PUBLIC_CORPUS_MANIFEST.json
          test -f asoiaf/reader/index.html
          test ! -e carrier
          test ! -e .github/workflows/asoiaf-public-corpus-real-admission.yml
          test -z "$(find . -type d -name __pycache__ -print -quit)"
          test -z "$(find . -type f -name '*.pyc' -print -quit)"
          git diff --check

      - name: Commit the real public-corpus admission
        id: admission
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BigBirdReturns'
          git config user.email 'bigbirdreturns@proton.me'
          git add -A
          git diff --cached --check
          git commit -m 'Admit the real six-edition ASOIAF public corpus v1'
          admission_sha="$(git rev-parse HEAD)"
          echo "sha=$admission_sha" >> "$GITHUB_OUTPUT"
          git push origin HEAD:main

      - name: Record truthful programme state and exact receipt
        shell: bash
        env:
          ADMISSION_SHA: ${{ steps.admission.outputs.sha }}
        run: |
          set -euo pipefail
          export ADMISSION_SHA
          python - <<'PY'
          import json
          import os
          import pathlib

          admission = os.environ['ADMISSION_SHA']
          receipt = {
              'format': 'axm-asoiaf-public-corpus-v1-admission-receipt/2',
              'recordedDate': '2026-08-19',
              'baseCommit': 'd1ef462fbdeba306cfa8f30b6b72302f03a72261',
              'admissionCommit': admission,
              'backupBranch': 'archive/main-pre-real-public-corpus-admission-20260819',
              'carrier': {
                  'sourceAttachment': 'axm-canon-asoiaf-corpus-v1-carrier.b64.txt',
                  'canonicalBase64Bytes': 826356,
                  'canonicalBase64Sha256': 'd4151d244b0541be1dbb1a1ef5a5ed7c4c808ba11d0ad494450acc58b11e6eaa',
                  'compressedBytes': 619766,
                  'compressedSha256': 'a545ed4384238f329f6fa6e6be2dd25150ac3377837defd3e06d26eabdea2476',
                  'tarBytes': 8017920,
                  'tarSha256': '9b66aff01f12ae3e6f018fd1c5ccd1d9b1fd96810da4343b3d11e3f69bfaab84',
                  'memberCount': 32
              },
              'publicCorpus': {
                  'manifestPath': 'asoiaf/public/corpus-v1/PUBLIC_CORPUS_MANIFEST.json',
                  'manifestSha256': '6d33c434fee6b596ab74327b7ed578e448701ecbb072657757bc28d3b36f4137',
                  'readerPath': 'asoiaf/reader/index.html',
                  'readerSha256': '51387266ec203ffd45fdc64ef1b05a8367db551801bb54a3405746081752a5d5',
                  'editionCount': 6,
                  'unitCount': 458,
                  'narrativeUnitCount': 347,
                  'nonNarrativeUnitCount': 111,
                  'paragraphLocatorCount': 45828,
                  'wordCount': 1882845,
                  'candidateCount': 805,
                  'candidatePacketCount': 15,
                  'entityCandidateCount': 254,
                  'openingRecordCount': 31
              },
              'qualification': {
                  'archiveIdentity': 'pass',
                  'archiveInventory': 'pass',
                  'fileDigests': 'pass',
                  'npmValidateWithPythonWarningsAsErrors': 'pass',
                  'transportResidueRemoved': True,
                  'privateSourcePayloadPresent': False,
                  'publicSourceTextPresent': False,
                  'automaticCanonEffect': 'none',
                  'automaticGraphEffect': 'none'
              }
          }
          path = pathlib.Path('asoiaf/docs/ASOIAF_PUBLIC_CORPUS_V1_ADMISSION.json')
          path.write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8')

          state = {
              'format': 'axm-asoiaf-programme-state/2',
              'recordedDate': '2026-08-19',
              'repository': {
                  'realPublicCorpusAdmissionCommit': admission,
                  'preAdmissionBackupBranch': 'archive/main-pre-real-public-corpus-admission-20260819',
                  'publicCorpusCarrierMemberCount': 32,
                  'publicCorpusManifestSha256': '6d33c434fee6b596ab74327b7ed578e448701ecbb072657757bc28d3b36f4137',
                  'transportResidueInAdmittedTree': False,
                  'sourcePayloadPresent': False,
                  'sourceTextPresent': False,
                  'automaticCanonEffect': 'none',
                  'automaticGraphEffect': 'none',
                  'readerAtlasSourcePath': 'asoiaf/reader/index.html',
                  'liveReaderPath': 'docs/asoiaf/'
              },
              'publicCorpus': {
                  'exactEditionCount': 6,
                  'unitCount': 458,
                  'paragraphLocatorCount': 45828,
                  'wordCount': 1882845,
                  'reviewCandidateCount': 805,
                  'entityCandidateCount': 254
              },
              'holderControlledEstate': {
                  'exactEditionCount': 6,
                  'wordCount': 1882845,
                  'paragraphReceiptCount': 45828,
                  'semanticAssertionCandidateCount': 186063,
                  'payloadPresentInPublicRepository': False
              },
              'continuationV3': {
                  'manifestAdmissionPresent': True,
                  'componentPayloadsPresent': False,
                  'automaticCanonEffect': 'none'
              },
              'integrationHold': {
                  'requiredArchive': 'asoiaf-private-world-estate-v4.1.tar.zst',
                  'requiredBytes': 244436743,
                  'requiredSha256': '48428ec5630971e75d0f9e0075b4d7fecacdfd2e61efc516ed01c3aaa17fb9d7',
                  'requiredArchiveMaterialized': False,
                  'v4_2Built': False,
                  'v4_2Claimed': False,
                  'substitutionAllowed': False,
                  'reconstructionAllowed': False
              },
              'nextPublicAdmissions': [
                  'materialize the sealed continuation-v3 component payloads under their exact manifests',
                  'continue item-level author-statement and released-future-material descent',
                  'admit additional holder-controlled source families only through local governed intake'
              ]
          }
          pathlib.Path('asoiaf/docs/ASOIAF_PROGRAMME_STATE.json').write_text(json.dumps(state, indent=2) + '\n', encoding='utf-8')

          root_readme = f'''# AXM Canon

`axm-canon` owns portable canon, continuity, evidence, and closure law. It is neither a game engine nor an execution scheduler.

The generic compiler lives under [`src/canon/`](src/canon/). The first domain estate lives under [`asoiaf/`](asoiaf/README.md). Tier Bench execution machinery is intentionally absent.

## Current ASOIAF standing

The repository now contains the authenticated public-safe six-edition corpus admitted at `{admission}`. Its exact carrier bound 32 files, six edition identities, 458 units, 45,828 paragraph locators, 1,882,845 words, 805 bounded review candidates, and 254 entity candidates. The public projection contains no holder-controlled book text or private source payload, and admission grants no automatic canon or graph effect.

The private estate remains separate. Integration beyond v4.1 is held until the exact inherited 244,436,743-byte archive with SHA-256 `48428ec5630971e75d0f9e0075b4d7fecacdfd2e61efc516ed01c3aaa17fb9d7` is materialized. Reconstruction and same-name substitution remain inadmissible.

The current state is recorded in [`asoiaf/docs/ASOIAF_PROGRAMME_STATE.md`](asoiaf/docs/ASOIAF_PROGRAMME_STATE.md), its [machine-readable companion](asoiaf/docs/ASOIAF_PROGRAMME_STATE.json), and the [exact admission receipt](asoiaf/docs/ASOIAF_PUBLIC_CORPUS_V1_ADMISSION.json).

## Qualification

```bash
npm ci
npm run validate
```

The next public corpus operation is materialization of the already sealed continuation-v3 component payloads under their exact manifests. Additional transport scaffolding does not count as corpus progress.
'''
          pathlib.Path('README.md').write_text(root_readme, encoding='utf-8')

          asoiaf_readme = f'''# ASOIAF canon estate

This directory applies the repository's canon, continuity, provenance, and closure law to *A Song of Ice and Fire* and its related source families. It is a governed research estate rather than a flat lore database.

## Authority boundary

Model recall, conversation synthesis, fan consensus, adaptation dialogue, licensed companions, author statements, released future material, and exact book text occupy distinct evidentiary lanes. Collection does not grant authority. Holder-controlled source bytes remain outside this public repository.

## Current standing

The real public-safe six-edition corpus was admitted at `{admission}` from an authenticated 32-member carrier. It exposes 458 units, 45,828 paragraph locators, 1,882,845 words, 805 review candidates in 15 packets, and 254 entity candidates without exposing source prose or local source paths. Every candidate remains review-bound, with automatic canon and graph effect fixed at none.

The reader artifact lives at [`reader/index.html`](reader/index.html). The public Pages surface lives under [`../docs/asoiaf/`](../docs/asoiaf/). The continuation-v3 custody manifest is admitted, while the component payloads themselves remain the next exact-manifest admission.

The private v4.2 integration remains held on the exact inherited `asoiaf-private-world-estate-v4.1.tar.zst` archive at 244,436,743 bytes and SHA-256 `48428ec5630971e75d0f9e0075b4d7fecacdfd2e61efc516ed01c3aaa17fb9d7`.

## Qualification

```bash
npm ci
npm run validate
```
'''
          pathlib.Path('asoiaf/README.md').write_text(asoiaf_readme, encoding='utf-8')

          state_md = f'''# ASOIAF programme state

Recorded 2026-08-19.

## Admitted public repository state

The controlling public-corpus admission is `{admission}`. It materializes the exact authenticated 32-member carrier rather than a merge label or transport receipt. The admitted projection contains six edition identities, 458 units, 45,828 paragraph locators, 1,882,845 words, 805 bounded review candidates, and 254 entity candidates. It contains no holder-controlled source prose, private payload, or local source path, and it grants no automatic canon or graph effect.

The pre-admission main tip is preserved at `archive/main-pre-real-public-corpus-admission-20260819`. Carrier chunks, replay markers, recovery workflows, temporary admission controllers, and state triggers were removed from the admitted tree.

## Reader and continuation standing

The repository contains the source reader at `asoiaf/reader/index.html` and the deployed static surface under `docs/asoiaf/`. The continuation-v3 admission currently establishes custody metadata only. Its component payloads have not yet been materialized into the repository and therefore exercise no source, canon, or graph authority.

## Holder-controlled estate standing

The separate private estate receipts record six exact editions, 1,882,845 words, 45,828 paragraph receipts, and 186,063 semantic assertion candidates. Private book bytes remain outside this public repository.

## Integration hold

```text
asoiaf-private-world-estate-v4.1.tar.zst
244,436,743 bytes
sha256:48428ec5630971e75d0f9e0075b4d7fecacdfd2e61efc516ed01c3aaa17fb9d7
```

The exact archive is not in current custody. Reconstruction, partial extraction, and semantically equivalent substitution remain inadmissible, so v4.2 remains unbuilt and unclaimed.

