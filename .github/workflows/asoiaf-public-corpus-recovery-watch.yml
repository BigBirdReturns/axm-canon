name: Watch recovered custody and admit ASOIAF public corpus

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/asoiaf-public-corpus-recovery-watch.yml"
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: axm-canon-asoiaf-public-corpus-recovery-watch
  cancel-in-progress: false

jobs:
  admit:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Classify current main standing
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          printf 'base_sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ -f asoiaf/docs/ASOIAF_PUBLIC_CORPUS_V1_IMPORT_RECEIPT.json ]; then
            printf 'needed=false\n' >> "$GITHUB_OUTPUT"
          else
            printf 'needed=true\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for exact retained-artifact staging custody
        if: steps.gate.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/axm-arc-public-corpus-staging-watch"
          repo="https://github.com/BigBirdReturns/axm-arc.git"
          branch="recovery/axm-canon-public-corpus-v1"
          for attempt in $(seq 1 1200); do
            rm -rf "$root"
            if git clone --quiet --depth 1 --single-branch --branch "$branch" "$repo" "$root" 2>/dev/null; then
              receipt="$root/recovery/public-corpus-v1/RECOVERY_RECEIPT.json"
              if [ -f "$receipt" ] && python - "$receipt" <<'PY'
          import json, pathlib, sys
          receipt=json.loads(pathlib.Path(sys.argv[1]).read_text())
          raise SystemExit(0 if receipt.get('result') == 'PASS' and len(receipt.get('files', [])) == 32 else 1)
          PY
              then
                break
              fi
            fi
            sleep 15
          done
          receipt="$root/recovery/public-corpus-v1/RECOVERY_RECEIPT.json"
          test -f "$receipt"
          python - "$receipt" <<'PY'
          import json, pathlib, sys
          receipt=json.loads(pathlib.Path(sys.argv[1]).read_text())
          if receipt.get('result') != 'PASS' or len(receipt.get('files', [])) != 32:
              raise SystemExit('staging receipt is not an exact 32-file PASS')
          PY
          printf 'STAGING_ROOT=%s\n' "$root/recovery/public-corpus-v1" >> "$GITHUB_ENV"
          printf 'STAGING_COMMIT=%s\n' "$(git -C "$root" rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify and overlay exact 32-file surface
        if: steps.gate.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib

          staging=pathlib.Path(os.environ['STAGING_ROOT'])
          receipt=json.loads((staging/'RECOVERY_RECEIPT.json').read_text())
          expected=set()
          for row in receipt['files']:
              rel=pathlib.PurePosixPath(row['path'])
              if rel.is_absolute() or '..' in rel.parts:
                  raise SystemExit(f'unsafe staged path: {row["path"]}')
              source=staging.joinpath('files',*rel.parts)
              if not source.is_file():
                  raise SystemExit(f'missing staged file: {row["path"]}')
              data=source.read_bytes()
              digest=hashlib.sha256(data).hexdigest()
              if digest!=row['sha256']:
                  raise SystemExit(f'digest mismatch: {row["path"]}')
              target=pathlib.Path(*rel.parts)
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(data)
              target.chmod(int(str(row.get('mode','0o644')),8)&0o777)
              expected.add(row['path'])
          disk={p.relative_to(staging/'files').as_posix() for p in (staging/'files').rglob('*') if p.is_file()}
          if disk!=expected:
              raise SystemExit('staging disk inventory differs from receipt')
          pathlib.Path(os.environ['RUNNER_TEMP'],'staging-receipt-watch.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
          npm ci --no-audit --no-fund
          PYTHONWARNINGS=error npm run validate
          rm -rf dist
          git diff --check

      - name: Write exact main admission receipt
        if: steps.gate.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import pathlib
          import subprocess

          staging=json.loads(pathlib.Path(os.environ['RUNNER_TEMP'],'staging-receipt-watch.json').read_text())
          expected={row['path'] for row in staging['files']}
          tracked=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          untracked=subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines()
          observed=set(tracked+untracked)
          allowed={'.github/workflows/asoiaf-public-corpus-recovery-watch.yml'}
          unexpected=observed-expected-allowed
          if unexpected:
              raise SystemExit(f'unexpected generated paths: {sorted(unexpected)}')
          receipt={
            'format':'axm-asoiaf-public-corpus-carrier-import-receipt/6',
            'baseCommit':'${{ steps.gate.outputs.base_sha }}',
            'carrierFileCount':32,
            'sourceAttachment':'axm-canon-asoiaf-corpus-v1-carrier.b64.txt',
            'sourceAttachmentSha256':'sha256:d4151d244b0541be1dbb1a1ef5a5ed7c4c808ba11d0ad494450acc58b11e6eaa',
            'canonicalBase64Sha256':'sha256:d4151d244b0541be1dbb1a1ef5a5ed7c4c808ba11d0ad494450acc58b11e6eaa',
            'compressedBytes':619766,
            'compressedSha256':'sha256:a545ed4384238f329f6fa6e6be2dd25150ac3377837defd3e06d26eabdea2476',
            'tarBytes':8017920,
            'tarSha256':'sha256:9b66aff01f12ae3e6f018fd1c5ccd1d9b1fd96810da4343b3d11e3f69bfaab84',
            'materialization':{
              'class':'scheduled-retained-artifact-staging-admission',
              'repository':'BigBirdReturns/axm-arc','branch':'recovery/axm-canon-public-corpus-v1',
              'commit':os.environ['STAGING_COMMIT'],'upstreamMechanism':staging['mechanism'],
            },
            'qualification':{
              'npmValidate':'pass','publicCorpusBoundary':'pass','privateCorpusOperatorTests':'pass',
              'stagingReceipt':'pass','fileInventory':'pass','fileDigests':'pass','unexpectedPathRejection':'pass',
            },
            'sourcePayloadPresent':False,'sourceTextPresent':False,'canonEffect':'none','graphEffect':'none',
          }
          pathlib.Path('asoiaf/docs/ASOIAF_PUBLIC_CORPUS_V1_IMPORT_RECEIPT.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY

      - name: Admit exact source and remove watcher
        if: steps.gate.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/asoiaf-public-corpus-recovery-watch.yml
          git add -A
          git diff --cached --check
          git config user.name 'BigBirdReturns'
          git config user.email '219768509+BigBirdReturns@users.noreply.github.com'
          git commit -m 'Admit six-edition ASOIAF public corpus v1'
          git push origin HEAD:main

      - name: Remove obsolete watcher after prior admission
        if: steps.gate.outputs.needed == 'false'
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/asoiaf-public-corpus-recovery-watch.yml
          git config user.name 'BigBirdReturns'
          git config user.email '219768509+BigBirdReturns@users.noreply.github.com'
          git commit -m 'Remove completed ASOIAF public corpus recovery watcher'
          git push origin HEAD:main

      - name: Retain watcher terminal
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/axm-canon-public-corpus-recovery-watch"
          mkdir -p "$root"
          cp "$RUNNER_TEMP/staging-receipt-watch.json" "$root/" 2>/dev/null || true
          printf '%s\n' \
            "base=${{ steps.gate.outputs.base_sha }}" \
            "needed=${{ steps.gate.outputs.needed }}" \
            "staging=${STAGING_COMMIT:-none}" > "$root/terminal.txt"
          find "$root" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum | sed "s#  $root/#  #" > "$root/SHA256SUMS"

      - name: Upload watcher terminal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axm-canon-asoiaf-public-corpus-recovery-watch
          path: ${{ runner.temp }}/axm-canon-public-corpus-recovery-watch
          if-no-files-found: error
          retention-days: 30
