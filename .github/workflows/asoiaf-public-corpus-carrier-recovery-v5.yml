name: Finalize exact ASOIAF public corpus from recovered custody

on:
  push:
    branches:
      - "asoiaf/public-corpus-v1-carrier"
    paths:
      - "carrier/RECOVER_V5"

permissions:
  contents: write
  pull-requests: write
  actions: read
  checks: read

concurrency:
  group: axm-canon-asoiaf-public-corpus-finalize-v5
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Stop when main already owns the publication
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          if git cat-file -e origin/main:asoiaf/docs/ASOIAF_PUBLIC_CORPUS_V1_IMPORT_RECEIPT.json 2>/dev/null; then
            printf 'needed=false\n' >> "$GITHUB_OUTPUT"
          else
            printf 'needed=true\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for exact recovered staging custody
        if: steps.gate.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f carrier/RECOVER_V5
          root="$RUNNER_TEMP/axm-arc-public-corpus-staging-v5"
          repo="https://github.com/BigBirdReturns/axm-arc.git"
          branch="recovery/axm-canon-public-corpus-v1"
          for attempt in $(seq 1 240); do
            rm -rf "$root"
            if git clone --quiet --depth 1 --single-branch --branch "$branch" "$repo" "$root" 2>/dev/null; then
              if [ -f "$root/recovery/public-corpus-v1/RECOVERY_RECEIPT.json" ]; then
                if python - "$root/recovery/public-corpus-v1/RECOVERY_RECEIPT.json" <<'PY'
          import json, pathlib, sys
          receipt=json.loads(pathlib.Path(sys.argv[1]).read_text())
          raise SystemExit(0 if receipt.get('result') == 'PASS' and len(receipt.get('files', [])) == 32 else 1)
          PY
                then
                  break
                fi
              fi
            fi
            sleep 15
          done
          test -f "$root/recovery/public-corpus-v1/RECOVERY_RECEIPT.json"
          python - "$root/recovery/public-corpus-v1/RECOVERY_RECEIPT.json" <<'PY'
          import json, pathlib, sys
          receipt=json.loads(pathlib.Path(sys.argv[1]).read_text())
          if receipt.get('result') != 'PASS' or len(receipt.get('files', [])) != 32:
              raise SystemExit('staging receipt is not an exact 32-file PASS')
          PY
          printf 'STAGING_ROOT=%s\n' "$root/recovery/public-corpus-v1" >> "$GITHUB_ENV"
          printf 'STAGING_COMMIT=%s\n' "$(git -C "$root" rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify and overlay exact file set
        if: steps.gate.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib

          staging=pathlib.Path(os.environ['STAGING_ROOT'])
          receipt=json.loads((staging/'RECOVERY_RECEIPT.json').read_text())
          expected=set()
          for row in receipt['files']:
              rel=pathlib.PurePosixPath(row['path'])
              if rel.is_absolute() or '..' in rel.parts:
                  raise SystemExit(f'unsafe staged path: {row["path"]}')
              source=staging.joinpath('files',*rel.parts)
              if not source.is_file():
                  raise SystemExit(f'missing staged file: {row["path"]}')
              data=source.read_bytes()
              if hashlib.sha256(data).hexdigest()!=row['sha256']:
                  raise SystemExit(f'digest mismatch: {row["path"]}')
              target=pathlib.Path(*rel.parts)
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(data)
              target.chmod(int(str(row.get('mode','0o644')),8)&0o777)
              expected.add(row['path'])
          disk={p.relative_to(staging/'files').as_posix() for p in (staging/'files').rglob('*') if p.is_file()}
          if disk!=expected:
              raise SystemExit('staging disk inventory differs from receipt')
          pathlib.Path(os.environ['RUNNER_TEMP'],'staging-receipt-v5.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
          npm ci --no-audit --no-fund
          PYTHONWARNINGS=error npm run validate
          rm -rf dist
          git diff --check

      - name: Write exact import receipt
        if: steps.gate.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import pathlib
          import subprocess

          staging=json.loads(pathlib.Path(os.environ['RUNNER_TEMP'],'staging-receipt-v5.json').read_text())
          expected={row['path'] for row in staging['files']}
          tracked=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          untracked=subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines()
          observed=set(tracked+untracked)
          allowed={
            '.github/workflows/asoiaf-public-corpus-carrier-import.yml',
            '.github/workflows/asoiaf-public-corpus-carrier-recovery-v2.yml',
            '.github/workflows/asoiaf-public-corpus-carrier-recovery-v3.yml',
            '.github/workflows/asoiaf-public-corpus-carrier-recovery-v4.yml',
            '.github/workflows/asoiaf-public-corpus-carrier-recovery-v5.yml',
          }
          allowed.update(p.as_posix() for p in pathlib.Path('carrier').rglob('*') if p.is_file())
          unexpected=observed-expected-allowed
          if unexpected:
              raise SystemExit(f'unexpected generated paths: {sorted(unexpected)}')
          receipt={
            'format':'axm-asoiaf-public-corpus-carrier-import-receipt/5',
            'baseCommit':'fec0ddc9a5697d465ac46e55b7e3cb7647221952',
            'carrierFileCount':32,
            'sourceAttachment':'axm-canon-asoiaf-corpus-v1-carrier.b64.txt',
            'sourceAttachmentSha256':'sha256:d4151d244b0541be1dbb1a1ef5a5ed7c4c808ba11d0ad494450acc58b11e6eaa',
            'canonicalBase64Sha256':'sha256:d4151d244b0541be1dbb1a1ef5a5ed7c4c808ba11d0ad494450acc58b11e6eaa',
            'compressedBytes':619766,
            'compressedSha256':'sha256:a545ed4384238f329f6fa6e6be2dd25150ac3377837defd3e06d26eabdea2476',
            'tarBytes':8017920,
            'tarSha256':'sha256:9b66aff01f12ae3e6f018fd1c5ccd1d9b1fd96810da4343b3d11e3f69bfaab84',
            'materialization':{
              'class':'retained-artifact-staging-import',
              'repository':'BigBirdReturns/axm-arc',
              'branch':'recovery/axm-canon-public-corpus-v1',
              'commit':os.environ['STAGING_COMMIT'],
              'upstreamMechanism':staging['mechanism'],
            },
            'qualification':{
              'npmValidate':'pass','publicCorpusBoundary':'pass','privateCorpusOperatorTests':'pass',
              'stagingReceipt':'pass','fileInventory':'pass','fileDigests':'pass','unexpectedPathRejection':'pass',
            },
            'sourcePayloadPresent':False,'sourceTextPresent':False,'canonEffect':'none','graphEffect':'none',
          }
          pathlib.Path('asoiaf/docs/ASOIAF_PUBLIC_CORPUS_V1_IMPORT_RECEIPT.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY

      - name: Replace transport with qualified source commit
        if: steps.gate.outputs.needed == 'true'
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          if git cat-file -e origin/main:asoiaf/docs/ASOIAF_PUBLIC_CORPUS_V1_IMPORT_RECEIPT.json 2>/dev/null; then
            printf 'published_sha=already-on-main\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          rm -rf carrier
          rm -f .github/workflows/asoiaf-public-corpus-carrier-import.yml
          rm -f .github/workflows/asoiaf-public-corpus-carrier-recovery-v2.yml
          rm -f .github/workflows/asoiaf-public-corpus-carrier-recovery-v3.yml
          rm -f .github/workflows/asoiaf-public-corpus-carrier-recovery-v4.yml
          rm -f .github/workflows/asoiaf-public-corpus-carrier-recovery-v5.yml
          git add -A
          git diff --cached --check
          git config user.name 'BigBirdReturns'
          git config user.email '219768509+BigBirdReturns@users.noreply.github.com'
          git commit -m 'Publish six-edition ASOIAF public corpus v1'
          published_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          printf 'published_sha=%s\n' "$published_sha" >> "$GITHUB_OUTPUT"

      - name: Integrate exact publication
        if: steps.gate.outputs.needed == 'true' && steps.publish.outputs.published_sha != 'already-on-main'
        id: integrate
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="$GITHUB_REF_NAME"
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&head=${GITHUB_REPOSITORY_OWNER}:$branch&base=main" --jq '.[0].number // empty')"
          if [ -z "$pr" ]; then
            body='Publishes the qualified 32-file public-safe ASOIAF corpus recovered from retained AXM custody. The complete repository validation suite passed. No private book payload, source text, automatic canon promotion, or graph promotion is present.'
            pr="$(gh api --method POST "repos/$GITHUB_REPOSITORY/pulls" -f title='Publish six-edition ASOIAF public corpus v1' -f head="$branch" -f base='main' -f body="$body" --jq '.number')"
          fi
          printf 'pr=%s\n' "$pr" >> "$GITHUB_OUTPUT"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/pulls/$pr/merge" -f merge_method='merge' -f sha='${{ steps.publish.outputs.published_sha }}' --jq '{sha,merged,message}'

      - name: Retain finalization terminal
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/axm-canon-public-corpus-finalize-v5"
          mkdir -p "$root"
          cp "$RUNNER_TEMP/staging-receipt-v5.json" "$root/" 2>/dev/null || true
          printf '%s\n' \
            "gate=${{ steps.gate.outputs.needed }}" \
            "candidate=${{ github.sha }}" \
            "staging=${STAGING_COMMIT:-none}" \
            "published=${{ steps.publish.outputs.published_sha }}" \
            "pr=${{ steps.integrate.outputs.pr }}" \
            "integrationOutcome=${{ steps.integrate.outcome }}" > "$root/terminal.txt"
          find "$root" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum | sed "s#  $root/#  #" > "$root/SHA256SUMS"

      - name: Upload finalization terminal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axm-canon-asoiaf-public-corpus-finalize-v5
          path: ${{ runner.temp }}/axm-canon-public-corpus-finalize-v5
          if-no-files-found: warn
          retention-days: 30
