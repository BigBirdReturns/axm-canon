name: Publish ASOIAF reader atlas live receipt

on:
  workflow_run:
    workflows: ["Deploy ASOIAF reader atlas v3"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: axm-canon-asoiaf-reader-atlas-publish-live-receipt
  cancel-in-progress: false

jobs:
  verify-and-record:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify live endpoint
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/asoiaf-live-receipt"
          mkdir -p "$root"
          site='https://bigbirdreturns.github.io/axm-canon/'
          matched=false

          for attempt in $(seq 1 20); do
            code="$(curl --location --silent --show-error --output "$root/index.html" --write-out '%{http_code}' --max-time 25 -H 'Cache-Control: no-cache' "$site" || true)"
            if test "$code" = '200' && grep -Fq 'The Narrow Wall' "$root/index.html" && grep -Fq 'Build a bounded research question' "$root/index.html"; then
              matched=true
              break
            fi
            sleep 15
          done
          test "$matched" = true

          curl --location --fail --silent --show-error --max-time 25 -H 'Cache-Control: no-cache' "$site"'data/atlas.json' -o "$root/atlas.json"
          jq -e '
            .version == "1.0.0" and
            .boundary.sourceTextPresent == false and
            .boundary.holderControlledPayloadPresent == false and
            .boundary.automaticCanonEffect == "none" and
            .boundary.automaticGraphEffect == "none" and
            (.sourceLanes | length) == 7 and
            (.twowChapters | length) == 11 and
            .custody.privateArchiveHold.materialized == false and
            .custody.privateArchiveHold.v4_2Built == false and
            .custody.publicWave.sha256 == "0e999b7f8c921e7e81d439fc4c2fc1fd004a2b4a2adb375f0df3b99aefe92ab9" and
            .custody.publicWave.repositoryMaterialized == false
          ' "$root/atlas.json" >/dev/null

          printf '%s\n' "$(sha256sum "$root/index.html" | awk '{print $1}')" > "$root/index.sha"
          printf '%s\n' "$(sha256sum "$root/atlas.json" | awk '{print $1}')" > "$root/atlas.sha"
          printf '%s\n' "$(wc -c < "$root/index.html" | tr -d ' ')" > "$root/index.bytes"
          printf '%s\n' "$(wc -c < "$root/atlas.json" | tr -d ' ')" > "$root/atlas.bytes"

      - name: Commit durable live receipt
        shell: bash
        env:
          WORKFLOW_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/asoiaf-live-receipt"
          receipt='asoiaf/public/reader-atlas/LIVE_RECEIPT.json'
          mkdir -p "$(dirname "$receipt")"
          verified_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          source_sha="${WORKFLOW_SOURCE_SHA:-$(git rev-parse HEAD)}"
          jq -n \
            --arg verifiedAt "$verified_at" \
            --arg site 'https://bigbirdreturns.github.io/axm-canon/' \
            --arg sourceCommit "$source_sha" \
            --arg indexSha256 "$(cat "$root/index.sha")" \
            --arg atlasSha256 "$(cat "$root/atlas.sha")" \
            --argjson indexBytes "$(cat "$root/index.bytes")" \
            --argjson atlasBytes "$(cat "$root/atlas.bytes")" \
            '{
              format: "axm-asoiaf-reader-atlas-live-receipt/1",
              status: "PASS",
              verifiedAt: $verifiedAt,
              site: $site,
              sourceCommit: $sourceCommit,
              rendered: {
                title: "The Narrow Wall",
                boundedQuestionControlPresent: true,
                indexBytes: $indexBytes,
                indexSha256: $indexSha256,
                atlasBytes: $atlasBytes,
                atlasSha256: $atlasSha256
              },
              boundary: {
                sourceTextPresent: false,
                holderControlledPayloadPresent: false,
                automaticCanonEffect: "none",
                automaticGraphEffect: "none"
              },
              counts: {
                sourceLanes: 7,
                releasedFutureWitnesses: 11
              },
              custody: {
                privateV4_1Materialized: false,
                privateV4_2Built: false,
                continuationWaveSha256: "0e999b7f8c921e7e81d439fc4c2fc1fd004a2b4a2adb375f0df3b99aefe92ab9",
                continuationPayloadMaterializedInRepository: false
              }
            }' > "$receipt"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$receipt"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record live ASOIAF reader atlas receipt'
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
            sleep $((attempt * 3))
          done
          exit 1
