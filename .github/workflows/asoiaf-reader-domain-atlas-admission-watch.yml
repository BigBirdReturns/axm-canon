name: Admit qualified ASOIAF reader domain atlas v0.3

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/asoiaf-reader-domain-atlas-admission-watch.yml"
  schedule:
    - cron: "19,49 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read
  checks: read

concurrency:
  group: axm-canon-asoiaf-reader-domain-atlas-admission-watch
  cancel-in-progress: false

jobs:
  admit:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Classify current and candidate standing
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin '+refs/heads/*:refs/remotes/origin/*'
          if [ -f docs/asoiaf/domain/manifest.json ] && \
             [ "$(jq -r '.format // empty' docs/asoiaf/domain/manifest.json)" = 'axm-asoiaf-reader-domain-atlas/0.3' ]; then
            printf 'needed=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf 'needed=true\n' >> "$GITHUB_OUTPUT"
          if git show-ref --verify --quiet refs/remotes/origin/asoiaf/reader-domain-atlas-v0.3; then
            candidate="$(git rev-parse origin/asoiaf/reader-domain-atlas-v0.3)"
            if git cat-file -e "$candidate:docs/asoiaf/domain/manifest.json" 2>/dev/null && \
               [ "$(git show "$candidate:docs/asoiaf/domain/manifest.json" | jq -r '.format // empty')" = 'axm-asoiaf-reader-domain-atlas/0.3' ]; then
              printf 'ready=true\n' >> "$GITHUB_OUTPUT"
              printf 'candidate=%s\n' "$candidate" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          printf 'ready=false\n' >> "$GITHUB_OUTPUT"

      - name: Qualify candidate in detached worktree
        if: steps.gate.outputs.needed == 'true' && steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/domain-candidate"
          git worktree add --detach "$root" "${{ steps.gate.outputs.candidate }}" >/dev/null
          trap 'git worktree remove --force "$root" >/dev/null 2>&1 || true' EXIT
          cd "$root"
          test -f scripts/build-asoiaf-reader-domain-atlas.py
          test -f scripts/verify-asoiaf-reader-domain-atlas.py
          test -f .github/workflows/asoiaf-reader-domain-atlas.yml
          test -f .github/workflows/asoiaf-reader-domain-atlas-live-canary.yml
          test -f asoiaf/docs/ASOIAF_READER_DOMAIN_ATLAS_V0_3.md
          python - <<'PY'
          import json,pathlib
          manifest=json.loads(pathlib.Path('docs/asoiaf/domain/manifest.json').read_text())
          boundary=manifest.get('boundary',{})
          required={
            'classificationAuthority':'navigation-only',
            'facetAuthority':'mechanical-field-presence-only',
            'signalAuthority':'lexical-review-signal-only',
            'canonEffect':'none','graphEffect':'none','sourceTextIncluded':False,
            'privatePayloadIncluded':False,'inferredRelationshipsIncluded':False,
          }
          if manifest.get('format')!='axm-asoiaf-reader-domain-atlas/0.3':raise SystemExit('bad manifest format')
          for key,value in required.items():
              if boundary.get(key)!=value:raise SystemExit(f'boundary mismatch: {key}')
          PY
          python scripts/build-asoiaf-reader-atlas.py > "$RUNNER_TEMP/base-1.json"
          python scripts/build-asoiaf-reader-domain-atlas.py > "$RUNNER_TEMP/domain-1.json"
          find docs -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/pass-1.SHA256SUMS"
          python scripts/build-asoiaf-reader-atlas.py > "$RUNNER_TEMP/base-2.json"
          python scripts/build-asoiaf-reader-domain-atlas.py > "$RUNNER_TEMP/domain-2.json"
          find docs -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/pass-2.SHA256SUMS"
          diff -u "$RUNNER_TEMP/base-1.json" "$RUNNER_TEMP/base-2.json"
          diff -u "$RUNNER_TEMP/domain-1.json" "$RUNNER_TEMP/domain-2.json"
          diff -u "$RUNNER_TEMP/pass-1.SHA256SUMS" "$RUNNER_TEMP/pass-2.SHA256SUMS"
          python scripts/verify-asoiaf-reader-domain-atlas.py > "$RUNNER_TEMP/verify.json"
          npm ci --no-audit --no-fund
          PYTHONWARNINGS=error npm run validate
          rm -rf dist
          git diff --check
          test -z "$(git status --porcelain)"

      - name: Merge exact qualified candidate and remove watcher
        if: steps.gate.outputs.needed == 'true' && steps.gate.outputs.ready == 'true'
        id: integrate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git checkout --detach origin/main
          git merge --no-ff --no-edit "${{ steps.gate.outputs.candidate }}"
          git rm .github/workflows/asoiaf-reader-domain-atlas-admission-watch.yml
          git config user.name 'BigBirdReturns'
          git config user.email '219768509+BigBirdReturns@users.noreply.github.com'
          git commit -m 'Remove completed ASOIAF reader domain-atlas admission watcher'
          npm ci --no-audit --no-fund
          PYTHONWARNINGS=error npm run validate
          rm -rf dist
          python scripts/build-asoiaf-reader-atlas.py >/dev/null
          python scripts/build-asoiaf-reader-domain-atlas.py >/dev/null
          python scripts/verify-asoiaf-reader-domain-atlas.py >/dev/null
          git diff --check
          test -z "$(git status --porcelain)"
          merge_sha="$(git rev-parse HEAD)"
          set +e
          git push origin HEAD:main > "$RUNNER_TEMP/direct-push.log" 2>&1
          direct=$?
          set -e
          if [ "$direct" = '0' ]; then
            printf 'result=direct-main\n' >> "$GITHUB_OUTPUT"
            printf 'merge_sha=%s\n' "$merge_sha" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          branch="asoiaf/domain-atlas-admission-${GITHUB_RUN_ID}"
          git push origin "HEAD:$branch"
          pr="$(gh api --method POST "repos/$GITHUB_REPOSITORY/pulls" -f title='Admit qualified ASOIAF reader domain atlas v0.3' -f head="$branch" -f base=main -f body='Admits the exact candidate after two byte-identical reader builds, the domain verifier, and the full repository validation suite passed. The candidate includes no private payload, source prose, inferred relationship, canon effect, or graph effect.' --jq '.number')"
          printf 'pr=%s\n' "$pr" >> "$GITHUB_OUTPUT"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/pulls/$pr/merge" -f merge_method=merge -f sha="$merge_sha" > "$RUNNER_TEMP/merge.json"
          printf 'result=merged-pr\n' >> "$GITHUB_OUTPUT"
          printf 'merge_sha=%s\n' "$merge_sha" >> "$GITHUB_OUTPUT"

      - name: Remove obsolete watcher after prior admission
        if: steps.gate.outputs.needed == 'false'
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/asoiaf-reader-domain-atlas-admission-watch.yml
          git config user.name 'BigBirdReturns'
          git config user.email '219768509+BigBirdReturns@users.noreply.github.com'
          git commit -m 'Remove completed ASOIAF reader domain-atlas admission watcher'
          git push origin HEAD:main

      - name: Retain admission receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/asoiaf-reader-domain-atlas-admission-watch"
          mkdir -p "$root"
          cp "$RUNNER_TEMP/base-1.json" "$RUNNER_TEMP/base-2.json" "$RUNNER_TEMP/domain-1.json" "$RUNNER_TEMP/domain-2.json" "$RUNNER_TEMP/pass-1.SHA256SUMS" "$RUNNER_TEMP/pass-2.SHA256SUMS" "$RUNNER_TEMP/verify.json" "$RUNNER_TEMP/direct-push.log" "$RUNNER_TEMP/merge.json" "$root/" 2>/dev/null || true
          printf '%s\n' \
            "needed=${{ steps.gate.outputs.needed }}" \
            "ready=${{ steps.gate.outputs.ready }}" \
            "candidate=${{ steps.gate.outputs.candidate }}" \
            "result=${{ steps.integrate.outputs.result }}" \
            "mergeSha=${{ steps.integrate.outputs.merge_sha }}" \
            "pr=${{ steps.integrate.outputs.pr }}" > "$root/terminal.txt"
          find "$root" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum | sed "s#  $root/#  #" > "$root/SHA256SUMS"

      - name: Upload admission receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axm-canon-asoiaf-reader-domain-atlas-admission-watch
          path: ${{ runner.temp }}/asoiaf-reader-domain-atlas-admission-watch
          if-no-files-found: error
          retention-days: 30
